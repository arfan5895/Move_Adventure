/* =======================================================================
   KODE TETAP & PERTEMUAN
   Kode materi tidak berubah walaupun urutan materi digeser atau namanya
   diganti, sehingga nilai siswa tetap tertaut ke materi yang benar.
   ======================================================================= */
const JML_TEMU_BAWAAN = 1;

function kodeMateri(k,i){
  k = KELAS_ISI;
  const jmlBawaan = DATA[k] ? DATA[k].length : 0;
  if(i < jmlBawaan) return `K${k}-M${String(i+1).padStart(2,"0")}`;
  const t = (S.tambahan[k]||[])[i - jmlBawaan];
  if(!t) return `K${k}-M??`;
  if(!t.id) t.id = "T" + Math.random().toString(36).slice(2,7).toUpperCase();
  return `K${k}-${t.id}`;
}
function kunciLama(k,i){ return `${KELAS_ISI}-${i}`; }

/* ---------- jumlah & isi pertemuan ---------- */
function dataTemu(kode){ return S.temuData[kode] || {jml:JML_TEMU_BAWAAN, list:{}}; }
function jumlahTemu(kode){ return 1; }
function judulTemuBawaan(n,jml){
  if(n === jml) return "Penerapan dan penilaian";
  if(n === 1) return "Mengenal gerak dasar";
  if(n === 2) return "Melatih gerak lanjutan";
  if(n === 3) return "Merangkai dan memvariasikan";
  return "Memperdalam variasi gerak";
}
/* apa yang dikerjakan siswa pada tiap tahap, bukan sekadar materi yang diulang */
function kegiatanTemuBawaan(n,jml){
  if(n === jml) return "Memainkan permainan utuh dengan aturan sederhana, sambil dinilai gurunya.";
  if(n === 1) return "Menirukan gerakan yang dicontohkan, satu per satu dan pelan-pelan.";
  if(n === 2) return "Mengulang gerakan berpasangan sambil saling mengoreksi.";
  if(n === 3) return "Menyambung seluruh gerakan menjadi satu rangkaian, lalu diubah-ubah tingkat kesulitannya.";
  return "Mengulang rangkaian dengan tantangan yang lebih sulit dari pertemuan sebelumnya.";
}
/* saran variasi yang membedakan pertemuan lanjutan, dapat diubah guru */
function variasiTemuBawaan(n,jml){
  if(n <= 2) return [];
  if(n === jml) return ["Gerakan dilakukan dalam permainan sesungguhnya, bukan latihan terpisah.",
                        "Setiap siswa mendapat giliran yang sama banyak.",
                        "Guru menilai sambil siswa bermain, tanpa menghentikan permainan."];
  const dasar = [
    ["Jarak diperjauh atau diperpendek dari pertemuan sebelumnya.",
     "Kecepatan gerak ditambah, dari pelan menjadi sedang.",
     "Arah gerak diubah, tidak hanya lurus ke depan."],
    ["Gerakan dilakukan sambil berpindah tempat.",
     "Ditambah satu rintangan sederhana yang harus dilewati.",
     "Dilakukan berpasangan secara bergantian."],
    ["Jumlah pengulangan ditambah dengan waktu yang sama.",
     "Gerakan disambung langsung tanpa berhenti di antaranya.",
     "Dilakukan sambil menghitung atau mengikuti aba-aba."]
  ];
  return dasar[(n - 3) % dasar.length];
}
function fokusTemuBawaan(n,jml){
  if(n === jml) return "Seluruh gerak dipakai dalam permainan dan dinilai. Tidak ada gerak baru yang diajarkan.";
  if(n === 1) return "Bagian awal gerakan saja. Tekankan sikap awal dan keselamatan.";
  if(n === 2) return "Bagian lanjutan gerakan, melanjutkan yang sudah dikuasai pada pertemuan pertama.";
  if(n === 3) return "Seluruh bagian disambung menjadi satu rangkaian, lalu divariasikan.";
  return "Rangkaian yang sama dengan tantangan yang lebih sulit.";
}
/* membagi sebuah daftar menjadi beberapa bagian berurutan yang tidak saling menimpa */
function bagiBerurutan(arr, bagian, ke){
  if(!arr.length) return [];
  if(bagian <= 1) return arr.slice();
  const dasar = Math.floor(arr.length / bagian), sisa = arr.length % bagian;
  let mulai = 0;
  for(let i = 1; i < ke; i++) mulai += dasar + (i <= sisa ? 1 : 0);
  const panjang = dasar + (ke <= sisa ? 1 : 0);
  const potong = arr.slice(mulai, mulai + panjang);
  return potong.length ? potong : arr.slice(-1);
}
/* permainan latihan dipakai lebih dulu, permainan utuh disimpan untuk pertemuan lanjutan */
function permainanTahap(P, n, lanjutan){
  if(!P.length) return [];
  const penuh = /mini|turnamen|pertandingan|lawan|beregu/i;
  const latihan = P.filter(x=>!penuh.test(x.n));
  const utuh = P.filter(x=>penuh.test(x.n));
  if(lanjutan) return (utuh.length ? utuh : P).slice(-1);
  const urut = latihan.concat(utuh);
  return urut.slice(n-1, n).length ? urut.slice(n-1, n) : urut.slice(0,1);
}
/* Pembagian bertahap: pertemuan awal mempelajari bagian gerak yang berbeda,
   pertemuan lanjutan merangkai seluruhnya dengan variasi, pertemuan terakhir menilai. */
function temuBawaan(m,n,jml){
  const L = m.l||[], P = m.p||[], K = m.k||[], T = m.t||[];
  const tahapBelajar = Math.max(1, Math.min(2, jml - 2));   // berapa pertemuan untuk memecah langkah
  let l, p, k, t;

  if(n === jml){                       // pertemuan penilaian
    l = L; p = P; k = K; t = T;
  } else if(n <= tahapBelajar){        // memecah langkah gerak menjadi bagian berbeda
    l = bagiBerurutan(L, tahapBelajar, n);
    t = bagiBerurutan(T, tahapBelajar + 1, n);
    p = permainanTahap(P, n, false);
    k = K.slice(n-1, n).length ? K.slice(n-1, n) : K.slice(0,1);
  } else {                             // merangkai seluruh gerak dengan variasi
    l = L;
    t = bagiBerurutan(T, tahapBelajar + 1, tahapBelajar + 1);
    p = permainanTahap(P, n, true);
    k = K.slice(n-1, n).length ? K.slice(n-1, n) : K.slice(-1);
  }
  if(!l.length) l = L;
  if(!p.length) p = P;
  if(!k.length) k = K;
  if(!t.length) t = T;
  return {judul: judulTemuBawaan(n,jml), fokus: fokusTemuBawaan(n,jml),
          kegiatan: kegiatanTemuBawaan(n,jml), variasi: variasiTemuBawaan(n,jml),
          t, l, p, k};
}
function temuAktif(k,i,n){
  const m = materiAktif(k,i);
  if(!m) return null;
  const kode = kodeMateri(k,i);
  const jml = jumlahTemu(kode);
  const nomor = Math.min(Math.max(1, n||1), jml);
  const dasar = temuBawaan(m, nomor, jml);
  const ubah = (dataTemu(kode).list || {})[nomor] || {};
  return {...m, ...dasar, ...ubah,
    g: {...m.g, ...(ubah.g||{})},
    j: m.j, judul: m.j, kegiatan: "", variasi: [], fokus: m.ak || "",
    nomor, jmlTemu: jml, kodeMateri: kode, kodeTemu: `${kode}-P${nomor}`};
}
function adaSuntinganTemu(kode,n){ return !!((dataTemu(kode).list||{})[n]); }
function temuSelesai(kode,n){ return progresAktif()[`${kode}-P${n}`] !== undefined; }

async function simpanTemu(kode, n, bagian){
  const d = S.temuData[kode] || (S.temuData[kode] = {jml:JML_TEMU_BAWAAN, list:{}});
  d.list = d.list || {};
  const lama = d.list[n] || {};
  d.list[n] = {...lama, ...bagian, g:{...(lama.g||{}), ...(bagian.g||{})}};
  if(!Object.keys(d.list[n].g).length) delete d.list[n].g;
  return simpanData();
}


function ubahNamaMateri(m){
  const h2 = document.getElementById("judulmateri");
  if(!h2 || h2.dataset.ubah) return;
  h2.dataset.ubah = "1";
  const kode = kodeMateri(S.kelas,S.materi);
  const asli = materiTambahan(S.kelas,S.materi)
    ? m.j
    : (DATA[S.kelas][S.materi] ? DATA[S.kelas][S.materi].j : m.j);
  h2.outerHTML = `<div class="ubah-nama">
    <input class="cari" id="namamaterib" value="${esc(m.j)}" aria-label="Nama materi">
    <div class="kendali" style="margin-top:8px">
      <button class="tombol" id="simpannamamateri">Simpan nama</button>
      <button id="batalnamamateri">Batal</button>
      ${m.j!==asli?`<button id="pulihnamamateri">Kembalikan nama asli</button>`:""}
    </div></div>`;
  const inp = document.getElementById("namamaterib");
  inp.focus(); inp.select();
  const simpan = async (nilai)=>{
    const n = String(nilai).trim();
    if(n.length < 2) return;
    await simpanSunting({j:n}, "materi");
    tampilMateri();
  };
  document.getElementById("simpannamamateri").onclick = ()=> simpan(inp.value);
  inp.onkeydown = e=>{ if(e.key==="Enter") simpan(inp.value); };
  document.getElementById("batalnamamateri").onclick = ()=> tampilMateri();
  const pl = document.getElementById("pulihnamamateri");
  if(pl) pl.onclick = ()=> simpan(asli);
}

  [/kerucut|cone|botol/i,"kerucut"], [/peluit/i,"peluit"], [/tali|karet/i,"tali"],
  [/matras|kasur/i,"matras"], [/tongkat|estafet/i,"tongkat"], [/net|jaring/i,"net"],
  [/sabun/i,"sabun"], [/air|keran|gayung/i,"air"]
];
function piktoDariTeks(teks){
  for(const [pola,kunci] of KATA_ALAT) if(pola.test(String(teks))) return kunci;
  return null;
}
function piktoDariAnimasi(a){ return PETA_ANIMASI[a] || "lari"; }

function gambarPikto(kunci, kelas){
  const p = PIKTO[kunci];
  if(!p) return "";
  return `<svg class="pk ${kelas||""}" viewBox="0 0 100 100" role="img" aria-label="${esc(p.n)}">${p.s}</svg>`;
}
function namaPikto(kunci){ return (PIKTO[kunci]||{}).n || ""; }

/* suara instruksi, memakai pembaca teks bawaan perangkat */
/* ---------- pembaca suara untuk siswa yang belum lancar membaca ---------- */
function bersihkanUcap(t){
  return String(t).replace(/[#*_`>]/g," ").replace(/\s+/g," ").trim();
}
function teksTab(m, id){
  const b = [];
  if(id==="tujuan"){
    b.push(`Pelajaran ${esc(m.j)}.`, "Yang akan kamu capai.");
    (m.t||[]).forEach((x,i)=> b.push(`Nomor ${i+1}. ${x}`));
  } else if(id==="gerak"){
    b.push(`Cara melakukan ${m.j}.`, m.ak || "");
    (m.l||[]).forEach((x,i)=> b.push(`Langkah ${i+1}. ${x}`));
  } else if(id==="rumah"){
    const r = rumahAktif(m);
    b.push("Cara melakukannya di rumah.", r.ruang);
    (r.alat||[]).forEach(x=> b.push(`${x.asli} diganti dengan ${x.ganti}.`));
    b.push("Supaya aman.");
    (r.aman||[]).forEach(x=> b.push(x));
  } else if(id==="materi"){
    b.push(m.ml || m.ak || "");
    (m.p||[]).forEach(x=> b.push(`Permainan ${x.n}. ${x.d}`));
  } else if(id==="kuis"){
    b.push("Ayo jawab pertanyaannya.");
    (m.k||[]).forEach((q,i)=>{
      b.push(`Soal nomor ${i+1}. ${q.s}`);
      q.o.forEach((o,j)=> b.push(`Pilihan ${String.fromCharCode(65+j)}. ${o}.`));
    });
  } else if(id==="video"){
    b.push("Bagian video. Mintalah bantuan gurumu untuk memutarnya.");
  }
  return bersihkanUcap(b.filter(Boolean).join(" "));
}
function barisSuara(){
  return `<div class="suara">
    <button class="dengar" id="dengartab">🔊 Dengarkan halaman ini</button>
    <button class="dengar" id="stopdengar">■ Berhenti</button>
  </div>`;
}
function pasangSuara(m, id){
  const d = document.getElementById("dengartab");
  if(d) d.onclick = ()=>{
    const t = teksTab(m, id);
    if(!t){ return; }
    if(!window.speechSynthesis){
      d.textContent = "Perangkat ini belum mendukung suara";
      return;
    }
    S.bunyi = true;
    ucap(t);
  };
  const s = document.getElementById("stopdengar");
  if(s) s.onclick = ()=>{ try{ speechSynthesis.cancel(); }catch(e){} };
}
function ucap(teks){
  if(!S.bunyi || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(teks);
    u.lang = "id-ID"; u.rate = .92; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* =======================================================================
   ISI PERMAINAN MENGIKUTI PERTEMUAN
   Piktogram diambil dari langkah gerak pertemuan yang sedang dibuka,
   sehingga tiap pertemuan memunculkan gambar dan tingkat kesulitan
   yang berbeda.
   ======================================================================= */
const KATA_GERAK = [
  [/berlari|lari\b|sprint|kecepatan/i,"lari"],
  [/berjalan|jalan\b|melangkah|langkah/i,"jalan"],
  [/melompat|meloncat|lompat|loncat|tolakan|mendarat|awalan/i,"lompat"],
  [/guling|berguling|roll/i,"guling"],
  [/mengayun|ayun/i,"ayun"],
  [/memutar|putar|rotasi/i,"putar"],
  [/menekuk|tekuk|meliuk|liuk|membungkuk|bungkuk|kayang|lentur/i,"tekuk"],
  [/seimbang|keseimbangan|satu kaki|sikap lilin/i,"imbang"],
  [/bergantung|gantung|bertumpu|tumpuan/i,"gantung"],
  [/mendorong|dorong|menarik|tarik|kekuatan|otot/i,"kuat"],
  [/melempar|lempar|melambung/i,"lempar"],
  [/menangkap|tangkap|menerima/i,"tangkap"],
  [/menendang|tendang|menyepak|gawang/i,"tendang"],
  [/memantul|pantul|menggiring|giring|dribel/i,"dribel"],
  [/passing|umpan|mengoper|oper|servis bawah/i,"passing"],
  [/memukul|pukul|servis atas|smes|raket/i,"pukul"],
  [/irama|ritmik|senam|hitungan|tepuk|musik|lagu/i,"ritmik"],
  [/cuci tangan|sabun|kebersihan|mandi|gigi|kuman|sehat/i,"sehat"]
];
function piktoDariLangkah(teks){
  for(const [pola,kunci] of KATA_GERAK) if(pola.test(String(teks))) return kunci;
  return null;
}
/* kumpulan gambar khas satu pertemuan */
function kolamPertemuan(m){
  const set = [];
  const tambah = k => { if(k && PIKTO[k] && !set.includes(k)) set.push(k); };
  (m.l||[]).forEach(x=> tambah(piktoDariLangkah(x)));
  tambah(piktoDariAnimasi(m.a));
  (m.g && m.g.alat || []).forEach(x=> tambah(piktoDariTeks(x)));
  return set;
}
function kolamLengkap(m, minimal){
  const set = kolamPertemuan(m).slice();
  kolamGerak().forEach(k=>{ if(!set.includes(k)) set.push(k); });
  while(set.length < (minimal||4)){
    const t = PIK_GERAK[Math.floor(Math.random()*PIK_GERAK.length)];
    if(!set.includes(t)) set.push(t);
  }
  return set;
}
function animasiUntuk(pikto){
  return Object.keys(PETA_ANIMASI).find(a=> PETA_ANIMASI[a] === pikto) || null;
}

/* =======================================================================
   PEMILIHAN PERMAINAN OLEH GURU
   ======================================================================= */
const SEMUA_GAME = {
  tebak:     {ikon:"👀", nama:"Tebak Gerak",       ket:"Lihat gerakannya, lalu pilih gambar yang sama.", fase:"A"},
  lampu:     {ikon:"🚦", nama:"Lampu Lalu Lintas", ket:"Aba-aba warna, anak menekan gambar gerak yang cocok.", fase:"A"},
  pasang:    {ikon:"🃏", nama:"Cari Pasangan",     ket:"Buka kartu dan temukan gambar yang kembar.", fase:"A"},
  sehatg:    {ikon:"🧼", nama:"Pilih yang Sehat",  ket:"Ketuk semua kebiasaan yang menyehatkan.", fase:"A"},
  susun:     {ikon:"🧩", nama:"Susun Gerakan",     ket:"Urutkan langkah gerakan pertemuan ini.", fase:"BC"},
  kilat:     {ikon:"⚡", nama:"Kuis Kilat",        ket:"Jawab soal pertemuan ini sebelum waktunya habis.", fase:"BC"},
  tantangan: {ikon:"🏃", nama:"Tantangan Gerak",   ket:"Praktikkan tiap langkah pertemuan ini sungguhan.", fase:"AB"}
};
function gameLayak(m){
  const ada = [];
  const l = (m.l||[]).length, k = (m.k||[]).length;
  if(fase_A()){
    ada.push("tebak","pasang");
    ada.push("lampu");
    if(m.a === "sehat" || /sehat|kebersihan|gizi|makan/i.test(m.e + " " + m.j)) ada.push("sehatg");
    if(l >= 1) ada.push("tantangan");
  } else {
    if(l >= 2) ada.push("susun");
    if(k >= 1) ada.push("kilat");
    if(l >= 1) ada.push("tantangan");
    ada.push("pasang","tebak");
  }
  return ada;
}
/* permainan bawaan berbeda tiap pertemuan, mengikuti tahap belajarnya */
function gameBawaanTemu(m){
  const n = m.nomor, akhir = n === m.jmlTemu, layak = gameLayak(m);
  if(m.jmlTemu === 1){
    const semua = fase_A() ? ["tebak","pasang","lampu","tantangan","sehatg"]
                           : ["susun","kilat","tantangan","tebak","pasang"];
    const hasilSemua = semua.filter(x=> layak.includes(x));
    return hasilSemua.length ? hasilSemua : layak.slice(0,1);
  }
  let urut;
  if(fase_A()){
    if(akhir)      urut = ["pasang","sehatg","tebak"];
    else if(n===1) urut = ["tebak","pasang"];
    else if(n===2) urut = ["lampu","tebak"];
    else           urut = ["tantangan","lampu"];
  } else {
    if(akhir)      urut = ["kilat","susun"];
    else if(n===1) urut = ["susun","kilat"];
    else if(n===2) urut = ["susun","tantangan"];
    else           urut = ["tantangan","kilat"];
  }
  const hasil = urut.filter(x=> layak.includes(x));
  return hasil.length ? hasil : layak.slice(0,1);
}
function gamePilihan(m){
  const p = (m.gamePilih || []).filter(x=> gameLayak(m).includes(x));
  return p.length ? p : gameBawaanTemu(m);
}
function gameSisa(m){
  const utama = gamePilihan(m);
  return gameLayak(m).filter(x=> !utama.includes(x));
}

/* ---------- tab guru: Permainan ---------- */
function pilihGame(p,m){
  const layak = gameLayak(m);
  const dipakai = gamePilihan(m);
  const sendiri = !!(m.gamePilih && m.gamePilih.length);
  let h = tombolUbah();
  h += `<h3>Permainan untuk Pertemuan ${m.nomor}</h3>
    <p class="catatan">Centang permainan yang muncul paling atas di menu siswa pada pertemuan ini. Permainan lain tetap bisa dibuka siswa lewat tombol Permainan lain. Isi tiap permainan mengikuti langkah gerak dan soal pertemuan ini, jadi otomatis berbeda antarpertemuan.</p>
    <p class="catatan">${sendiri ? "Saat ini memakai pilihanmu sendiri." : "Saat ini memakai pilihan bawaan untuk pertemuan ini."}</p>
    <div class="g-pilih">`;
  layak.forEach(id=>{
    const g = SEMUA_GAME[id], aktif = dipakai.includes(id);
    h += `<button class="g-kartu ${aktif?"g-terpilih":""}" data-pilihgame="${id}" aria-pressed="${aktif}">
      <span class="g-ikon">${g.ikon}</span>
      <span class="g-teks"><span class="g-nama">${g.nama}</span><span class="g-ket">${esc(g.ket)}</span>
        <span class="g-rekor">${aktif ? "Ditampilkan di pertemuan ini" : "Tersembunyi di Permainan lain"}</span></span>
      <span class="g-centang">${aktif?"✓":"+"}</span></button>`;
  });
  h += `</div>
    <div class="kendali">
      ${sendiri?`<button id="pulihgame">Kembalikan pilihan bawaan</button>`:""}
    </div>
    <p class="catatan" id="pesangame"></p>`;
  if(fase_A()){
    h += `<p class="catatan">Kelas ${S.kelas} termasuk Fase A, jadi permainan yang tersedia adalah yang bergambar dan bisa dimainkan tanpa membaca.</p>`;
  }
  p.innerHTML = h;
  pasangUbah(p,m);

  p.querySelectorAll("[data-pilihgame]").forEach(b=> b.onclick = async ()=>{
    const id = b.dataset.pilihgame;
    let baru = gamePilihan(m).slice();
    if(baru.includes(id)){
      if(baru.length === 1){
        document.getElementById("pesangame").textContent = "Sisakan minimal satu permainan untuk pertemuan ini.";
        return;
      }
      baru = baru.filter(x=>x!==id);
    } else baru.push(id);
    await simpanTemu(m.kodeMateri, m.nomor, {gamePilih:baru});
    panel();
  });
  const pg = document.getElementById("pulihgame");
  if(pg) pg.onclick = async ()=>{
    const d = S.temuData[m.kodeMateri];
    if(d && d.list && d.list[m.nomor]) delete d.list[m.nomor].gamePilih;
    await simpanData(); panel();
  };
}

/* =======================================================================
   PERMAINAN BERGAMBAR UNTUK KELAS 1-2 (FASE A)
   Semua permainan dapat diselesaikan tanpa membaca satu kata pun.
   Instruksi dibacakan suara, gambar besar, paling banyak tiga pilihan.
   ======================================================================= */
const GAME_A = [
  {id:"tebak",  ikon:"👀", nama:"Tebak Gerak",       ket:"Lihat gerakannya, lalu pilih gambar yang sama."},
  {id:"lampu",  ikon:"🚦", nama:"Lampu Lalu Lintas", ket:"Merah berhenti, kuning jalan di tempat, hijau lari."},
  {id:"pasang", ikon:"🃏", nama:"Cari Pasangan",     ket:"Buka kartu dan temukan gambar yang kembar."},
  {id:"sehatg", ikon:"🧼", nama:"Pilih yang Sehat",  ket:"Ketuk semua kebiasaan yang menyehatkan."}
];
const RONDE_TEBAK = 5, RONDE_LAMPU = 8;

function fase_A(){ return false; }
function gameATersedia(m){
  return GAME_A.filter(g=>{
    if(g.id === "sehatg") return m.a === "sehat" || /sehat|kebersihan|gizi|makan/i.test(m.e + " " + m.j);
    return true;
  });
}
function kolamGerak(){
  const set = new Set();
  daftarMateri(S.kelas).forEach((x,i)=>{
    const mm = materiAktif(S.kelas,i);
    if(mm) set.add(piktoDariAnimasi(mm.a));
  });
  const arr = [...set].filter(x=>PIKTO[x]);
  while(arr.length < 4){
    const tambah = PIK_GERAK[Math.floor(Math.random()*PIK_GERAK.length)];
    if(!arr.includes(tambah)) arr.push(tambah);
  }
  return arr;
}

/* ---------- bilah atas versi anak ---------- */
function aBar(judul, kanan){

    <button class="g-keluar" id="gkeluar">‹ Arena</button>

}
function aHasil(ikon, besar, ket, rekorBaru){
  return `<div class="g-hasil">

    <p class="g-besar">${besar}</p>

/* =======================================================================
   1. TEBAK GERAK
   ======================================================================= */
function mulaiTebak(m){
  hentikanGame();
  const khas = kolamPertemuan(m);
  const kolam = kolamLengkap(m, 5);
  const jmlRonde = Math.min(8, Math.max(RONDE_TEBAK, khas.length + m.nomor));
  const jmlPilihan = m.nomor <= 2 ? 3 : 4;
  const urutTarget = acak(khas.length ? khas : kolam);
  const ronde = [];
  for(let r=0;r<jmlRonde;r++){
    const target = urutTarget[r % urutTarget.length];
    const lain = acak(kolam.filter(x=>x!==target)).slice(0,jmlPilihan-1);
    while(lain.length < jmlPilihan-1){
      const t = PIK_GERAK[Math.floor(Math.random()*PIK_GERAK.length)];
      if(t!==target && !lain.includes(t)) lain.push(t);
    }
    ronde.push({target, pilihan:acak([target,...lain])});
  }
  S.gs = {ronde, ke:0, benar:0, jawab:null, selesai:false, rekorBaru:false};
}
function mainTebak(p,m){
  if(!S.gs) mulaiTebak(m);
  const g = S.gs;
  S.ulang = ()=> mainTebak(p,m);

  if(g.selesai){
    p.innerHTML = aBar("👀 Tebak Gerak", `${g.benar}/${g.ronde.length}`) +
      aHasil(g.benar === g.ronde.length ? "🎉" : "👍", `${g.benar} dari ${g.ronde.length} benar`,
             g.benar === g.ronde.length ? "Semua gerakan kamu kenali. Hebat!" : "Lihat lagi gerakannya di tab Gerakan, lalu coba lagi.",
             g.rekorBaru);
    pasangKeluar(p,m); pasangUlang(p,m);
    return;
  }

  const r = g.ronde[g.ke];
  const anim = animasiUntuk(r.target);
  let h = aBar("👀 Tebak Gerak", titikRonde(g.ke, g.ronde.length, g.benar));
  h += `<p class="a-perintah">${anim ? "Gerakan mana yang sama?" : "Bayangan ini gambar apa?"}</p>`;
  h += anim
    ? `<div class="panggung g-panggung">${svgGerak(anim)}</div>`
    : `<div class="a-siluet-kotak">${gambarPikto(r.target,"siluet")}</div>`;
  h += `<div class="a-pilih ${r.pilihan.length>3?"empat":"tiga"}">`;
  r.pilihan.forEach(k=>{
    let kelas = "";
    if(g.jawab){ kelas = k === r.target ? " a-benar" : (k === g.jawab ? " a-salah" : " a-redup"); }
    h += `<button class="a-kartu${kelas}" data-pilih="${k}" ${g.jawab?"disabled":""}>
      ${gambarPikto(k)}<span class="a-label">${esc(namaPikto(k))}</span></button>`;
  });
  h += `</div>`;
  if(g.jawab) h += `<div class="g-aksi"><button class="tombol" id="glanjut">${g.ke+1 < g.ronde.length ? "Lanjut" : "Lihat hasil"}</button></div>`;
  p.innerHTML = h;
  pasangKeluar(p,m);
  const svg = p.querySelector("svg.gerak");
  if(svg) svg.classList.toggle("lambat", true);
  if(!g.jawab) ucap(anim ? "Gerakan mana yang sama?" : "Bayangan ini gambar apa?");

  p.querySelectorAll("[data-pilih]").forEach(b=> b.onclick = ()=>{
    if(g.jawab) return;
    g.jawab = b.dataset.pilih;
    if(g.jawab === r.target){ g.benar++; bunyi("benar"); ucap("Benar"); }
    else { bunyi("salah"); ucap("Coba lagi ya"); }
    mainTebak(p,m);
  });
  const lj = document.getElementById("glanjut");
  if(lj) lj.onclick = ()=>{
    g.ke++;
    if(g.ke >= g.ronde.length){ g.selesai = true; g.rekorBaru = catatRekor("tebak", g.benar); bunyi("juara"); }
    else g.jawab = null;
    mainTebak(p,m);
  };
}
function titikRonde(ke, jml, benar){
  let h = `<span class="a-titik">`;
  for(let i=0;i<jml;i++) h += `<i class="${i<ke?(i<benar?"isi":"lewat"):(i===ke?"kini":"")}"></i>`;
  return h + `</span>`;
}

/* =======================================================================
   2. LAMPU LALU LINTAS
   ======================================================================= */
const LAMPU = [
  {warna:"merah",  pikto:"berhenti",      kata:"Merah, berhenti"},
  {warna:"kuning", pikto:"jalanditempat", kata:"Kuning, jalan di tempat"},
  {warna:"hijau",  pikto:"lari",          kata:"Hijau, lari"}
];
function lampuUntuk(m){
  const dasar = LAMPU.slice();
  if(m.nomor >= 3){
    const k = kolamPertemuan(m)[0] || piktoDariAnimasi(m.a);
    if(k && !dasar.some(x=>x.pikto===k)){
      dasar.push({warna:"biru", pikto:k, kata:"Biru, lakukan " + namaPikto(k).toLowerCase()});
    }
  }
  return dasar;
}
function mulaiLampu(m){
  hentikanGame();
  const daftar = lampuUntuk(m);
  const jml = Math.min(12, 5 + m.nomor*2);
  const ronde = [];
  for(let i=0;i<jml;i++) ronde.push(Math.floor(Math.random()*daftar.length));
  S.gs = {daftar, ronde, ke:0, benar:0, jawab:null, selesai:false, rekorBaru:false};
}
function mainLampu(p,m){
  if(!S.gs) mulaiLampu(m);
  const g = S.gs;
  const daftar = g.daftar || LAMPU;
  S.ulang = ()=> mainLampu(p,m);

  if(g.selesai){
    p.innerHTML = aBar("🚦 Lampu Lalu Lintas", `${g.benar}/${g.ronde.length}`) +
      aHasil(g.benar >= g.ronde.length-1 ? "🏆" : "🚦", `${g.benar} dari ${g.ronde.length} benar`,
             "Permainan ini juga bisa dimainkan di lapangan bersama teman satu kelas.", g.rekorBaru);
    pasangKeluar(p,m); pasangUlang(p,m);
    return;
  }

  const l = daftar[g.ronde[g.ke]];
  let h = aBar("🚦 Lampu Lalu Lintas", titikRonde(g.ke, g.ronde.length, g.benar));
  h += `<div class="a-lampu">
    ${daftar.map(x=>`<span class="a-bola-lampu a-${x.warna} ${x.warna===l.warna?"nyala":""}"></span>`).join("")}
  </div>`;
  h += `<p class="a-perintah">Kamu harus apa?</p>`;
  h += `<div class="a-pilih ${daftar.length>3?"empat":"tiga"}">`;
  daftar.forEach(x=>{
    let kelas = "";
    if(g.jawab){ kelas = x.pikto === l.pikto ? " a-benar" : (x.pikto === g.jawab ? " a-salah" : " a-redup"); }
    h += `<button class="a-kartu${kelas}" data-lampu="${x.pikto}" ${g.jawab?"disabled":""}>
      ${gambarPikto(x.pikto)}<span class="a-label">${esc(namaPikto(x.pikto))}</span></button>`;
  });
  h += `</div>`;
  if(g.jawab) h += `<div class="g-aksi"><button class="tombol" id="glanjut">${g.ke+1 < g.ronde.length ? "Lanjut" : "Lihat hasil"}</button></div>`;
  p.innerHTML = h;
  pasangKeluar(p,m);
  if(!g.jawab) ucap(l.kata);

  p.querySelectorAll("[data-lampu]").forEach(b=> b.onclick = ()=>{
    if(g.jawab) return;
    g.jawab = b.dataset.lampu;
    if(g.jawab === l.pikto){ g.benar++; bunyi("benar"); ucap("Benar"); }
    else { bunyi("salah"); ucap("Belum tepat"); }
    mainLampu(p,m);
  });
  const lj = document.getElementById("glanjut");
  if(lj) lj.onclick = ()=>{
    g.ke++;
    if(g.ke >= g.ronde.length){ g.selesai = true; g.rekorBaru = catatRekor("lampu", g.benar); bunyi("juara"); }
    else g.jawab = null;
    mainLampu(p,m);
  };
}

/* =======================================================================
   3. CARI PASANGAN
   ======================================================================= */
function mulaiPasang(m){
  hentikanGame();
  const jmlPasang = m.nomor <= 2 ? 3 : (m.nomor === 3 ? 4 : 5);
  const pakai = kolamLengkap(m, jmlPasang).slice(0, jmlPasang);
  const kartu = acak([...pakai, ...pakai].map((k,i)=>({k, id:i, buka:false, cocok:false})));
  S.gs = {kartu, pasang:jmlPasang, pilih:[], salah:0, cocok:0, selesai:false, kunci:false, rekorBaru:false};
}
function mainPasang(p,m){
  if(!S.gs) mulaiPasang(m);
  const g = S.gs;
  S.ulang = ()=> mainPasang(p,m);

  if(g.selesai){
    const bt = g.salah <= g.pasang-1 ? 3 : (g.salah <= g.pasang+1 ? 2 : 1);
    p.innerHTML = aBar("🃏 Cari Pasangan", bintang(bt)) +
      aHasil(bintang(bt), "Semua pasangan ketemu!", `${g.pasang} pasang dengan ${g.salah} kali salah.`, g.rekorBaru);
    pasangKeluar(p,m); pasangUlang(p,m);
    return;
  }

  let h = aBar("🃏 Cari Pasangan", `${g.cocok}/${g.pasang} pasang`);
  h += `<p class="a-perintah">Cari dua gambar yang sama</p>`;
  h += `<div class="a-papan">`;
  g.kartu.forEach((c,i)=>{
    const tampak = c.buka || c.cocok;
    h += `<button class="a-balik ${tampak?"terbuka":""} ${c.cocok?"cocok":""}" data-kartu="${i}" ${c.cocok?"disabled":""}>
      ${tampak ? gambarPikto(c.k) : `<span class="a-punggung">?</span>`}</button>`;
  });
  h += `</div>`;
  p.innerHTML = h;
  pasangKeluar(p,m);

  p.querySelectorAll("[data-kartu]").forEach(b=> b.onclick = ()=>{
    if(g.kunci) return;
    const i = Number(b.dataset.kartu), c = g.kartu[i];
    if(c.buka || c.cocok) return;
    c.buka = true;
    g.pilih.push(i);
    if(g.pilih.length < 2){ bunyi("mulai"); mainPasang(p,m); return; }
    const [a,b2] = g.pilih;
    if(g.kartu[a].k === g.kartu[b2].k){
      g.kartu[a].cocok = g.kartu[b2].cocok = true;
      g.cocok++; g.pilih = []; bunyi("benar"); ucap(namaPikto(g.kartu[a].k));
      if(g.cocok === g.pasang){
        g.selesai = true;
        g.rekorBaru = catatRekor("pasang", g.salah <= g.pasang-1 ? 3 : (g.salah <= g.pasang+1 ? 2 : 1));
        bunyi("juara");
      }
      mainPasang(p,m);
    } else {
      g.salah++; g.kunci = true; bunyi("salah");
      mainPasang(p,m);
      setTimeout(()=>{
        if(!S.gs || S.gs !== g) return;
        g.kartu[a].buka = g.kartu[b2].buka = false;
        g.pilih = []; g.kunci = false;
        if(S.ulang) S.ulang();
      }, 900);
    }
  });
}

/* =======================================================================
   4. PILIH YANG SEHAT
   ======================================================================= */
function mulaiSehat(m){
  hentikanGame();
  const sehat = acak(PIK_SEHAT).slice(0, (m && m.nomor >= 3) ? 6 : 4);
  const tidak = acak(PIK_TIDAK).slice(0,2);
  S.gs = {kartu:acak([...sehat.map(k=>({k,sehat:true})), ...tidak.map(k=>({k,sehat:false}))]),
          ketuk:{}, benar:0, salah:0, selesai:false, rekorBaru:false};
}
function mainSehat(p,m){
  if(!S.gs) mulaiSehat(m);
  const g = S.gs;
  S.ulang = ()=> mainSehat(p,m);
  const jmlSehat = g.kartu.filter(c=>c.sehat).length;

  if(g.selesai){
    const bt = g.salah === 0 ? 3 : (g.salah <= 2 ? 2 : 1);
    p.innerHTML = aBar("🧼 Pilih yang Sehat", bintang(bt)) +
      aHasil(bintang(bt), "Semua kebiasaan sehat kamu temukan!",
             g.salah ? `Kamu salah ketuk ${g.salah} kali.` : "Tanpa salah sekali pun.", g.rekorBaru);
    pasangKeluar(p,m); pasangUlang(p,m);
    return;
  }

  let h = aBar("🧼 Pilih yang Sehat", `${g.benar}/${jmlSehat}`);
  h += `<p class="a-perintah">Ketuk gambar kebiasaan yang menyehatkan</p>`;
  h += `<div class="a-papan tiga-kolom">`;
  g.kartu.forEach((c,i)=>{
    const st = g.ketuk[i];
    h += `<button class="a-kartu kecil${st === "benar" ? " a-benar" : st === "salah" ? " a-salah" : ""}"
      data-sehat="${i}" ${st === "benar" ? "disabled" : ""}>
      ${gambarPikto(c.k)}<span class="a-label">${esc(namaPikto(c.k))}</span></button>`;
  });
  h += `</div>`;
  p.innerHTML = h;
  pasangKeluar(p,m);
  ucap("Ketuk gambar kebiasaan yang menyehatkan");

  p.querySelectorAll("[data-sehat]").forEach(b=> b.onclick = ()=>{
    const i = Number(b.dataset.sehat), c = g.kartu[i];
    if(g.ketuk[i] === "benar") return;
    if(c.sehat){
      g.ketuk[i] = "benar"; g.benar++; bunyi("benar"); ucap(namaPikto(c.k));
      if(g.benar === jmlSehat){
        g.selesai = true;
        g.rekorBaru = catatRekor("sehatg", g.salah === 0 ? 3 : (g.salah <= 2 ? 2 : 1));
        bunyi("juara");
      }
      mainSehat(p,m);
    } else {
      g.salah++; bunyi("salah"); ucap("Itu kurang sehat");
      b.classList.add("goyah");
      setTimeout(()=>b.classList.remove("goyah"), 420);
    }
  });
}

/* =======================================================================
   ARENA BERMAIN SISWA
   Tiga permainan yang isinya diambil langsung dari materi yang dibuka:
   langkah gerakan (m.l), soal kuis (m.k), dan animasi peraga (m.a).
   ======================================================================= */
const GAME = [
  {id:"susun",     ikon:"🧩", nama:"Susun Gerakan",   ket:"Urutkan langkah gerakan dari awal sampai akhir."},
  {id:"kilat",     ikon:"⚡", nama:"Kuis Kilat",      ket:"Jawab soal sebelum waktunya habis. Makin cepat, makin besar poinnya."},
  {id:"tantangan", ikon:"🏃", nama:"Tantangan Gerak", ket:"Praktikkan gerakannya sungguhan, satu kartu satu tantangan."}
];
const DETIK_KILAT = 15, DETIK_TANTANGAN = 20;

function gameTersedia(m){
  return GAME.filter(g => g.id==="kilat" ? (m.k||[]).length>=1
    : (g.id==="susun" ? (m.l||[]).length>=2 : (m.l||[]).length>=1));
}
function kunciRekor(id){ return `${kodeMateri(S.kelas,S.materi)}-P${S.temuKe||1}-${id}`; }
function rekorGame(id){ return S.rekor[kunciRekor(id)] || 0; }
function catatRekor(id, nilai){
  const baru = nilai > rekorGame(id);
  if(baru){ S.rekor[kunciRekor(id)] = nilai; simpanData(); }
  return baru;
}
function acak(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]] = [b[j],b[i]]; }
  return b;
}
function hentikanGame(){ if(S.gtik){ clearInterval(S.gtik); S.gtik = null; } }
function tutupGame(){ hentikanGame(); S.game = null; S.gs = null; S.ulang = null; }
function bintang(n){ return "★".repeat(n) + "☆".repeat(Math.max(0,3-n)); }
function nyawaTeks(n){ return "❤️".repeat(n) + "🤍".repeat(Math.max(0,3-n)); }

function bunyi(jenis){
  if(!S.bunyi) return;
  try{
    const A = window.AudioContext || window.webkitAudioContext;
    if(!A) return;
    S.audio = S.audio || new A();
    if(S.audio.state === "suspended") S.audio.resume();
    const nada = {benar:[660,880], salah:[233,175], mulai:[523,784], juara:[659,880,1319], habis:[392,294]}[jenis] || [440];
    nada.forEach((f,i)=>{
      const o = S.audio.createOscillator(), g = S.audio.createGain(), t = S.audio.currentTime + i*0.1;
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.16,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+.17);
      o.connect(g); g.connect(S.audio.destination); o.start(t); o.stop(t+.19);
    });
  }catch(e){}
}

/* ---------- pintu masuk tab "Ayo Bermain" ---------- */
function daftarGame(m){
  const ambil = id => ({id, ...SEMUA_GAME[id]});
  return (S.semuaGame ? gameLayak(m) : gamePilihan(m)).map(ambil);
}
function labelRekor(id, r){
  if(!r) return "Belum pernah dimainkan";
  if(id==="susun" || id==="pasang" || id==="sehatg") return `Rekormu ${bintang(r)}`;
  if(id==="kilat") return `Rekormu ${r} poin`;
  if(id==="tantangan") return `Rekormu ${r} tantangan selesai`;
  return `Rekormu ${r} jawaban benar`;
}
function arena(p,m){
  if(S.game === "susun")          mainSusun(p,m);
  else if(S.game === "kilat")     mainKilat(p,m);
  else if(S.game === "tantangan") mainTantangan(p,m);
  else if(S.game === "tebak")     mainTebak(p,m);
  else if(S.game === "lampu")     mainLampu(p,m);
  else if(S.game === "pasang")    mainPasang(p,m);
  else if(S.game === "sehatg")    mainSehat(p,m);
  else                            menuArena(p,m);
}

function menuArena(p,m){
  hentikanGame(); S.gs = null; S.ulang = null;
  const daftar = daftarGame(m);
  const sisa = gameSisa(m).length;
  let h = `<div class="g-kepala">
      <div><h3 style="margin:0">Arena bermain</h3>
        <p class="catatan" style="margin:2px 0 0">${fase_A()
          ? "Ketuk gambarnya. Suara akan membacakan perintahnya."
          : "Main dulu, lalu lanjutkan berlatih di lapangan bersama teman."}</p></div>
      <button class="g-bunyi" id="gbunyi" aria-pressed="${S.bunyi}" title="Hidupkan atau matikan bunyi">${S.bunyi?"🔊":"🔇"}</button>
    </div>`;

  if(daftar.length === 0){
    h += `<p class="catatan">Permainan layar belum bisa dibuka karena materi ini belum punya langkah gerakan atau soal. Mintalah gurumu melengkapinya.</p>`;
  } else {
    h += `<div class="g-pilih">`;
    daftar.forEach(g=>{
      const rekor = labelRekor(g.id, rekorGame(g.id));
      h += `<button class="g-kartu" data-game="${g.id}">
        <span class="g-ikon">${g.ikon}</span>
        <span class="g-teks"><span class="g-nama">${g.nama}</span><span class="g-ket">${g.ket}</span>
          <span class="g-rekor">${rekor}</span></span>
        <span class="panah">›</span></button>`;
    });
    h += `</div>`;
  }

  if(sisa && !S.semuaGame){
    h += `<p style="margin:2px 0 0"><button class="tombol garis" id="gsemua">Permainan lain (${sisa})</button></p>`;
  } else if(S.semuaGame){
    h += `<p style="margin:2px 0 0"><button class="tombol garis" id="gutama">Kembali ke permainan pertemuan ini</button></p>`;
  }
  h += `<h3>Permainan di lapangan</h3>
    ${m.p.map(x=>`<div class="main"><b>${esc(x.n)}</b>${esc(x.d)}</div>`).join("")}`;
  p.innerHTML = h;

  const tb = document.getElementById("gbunyi");
  if(tb) tb.onclick = ()=>{ S.bunyi = !S.bunyi; bunyi("mulai"); menuArena(p,m); };
  p.querySelectorAll("[data-game]").forEach(b=> b.onclick = ()=>{
    S.game = b.dataset.game; S.gs = null; bunyi("mulai"); arena(p,m);
  });
  const gs2 = document.getElementById("gsemua");
  if(gs2) gs2.onclick = ()=>{ S.semuaGame = true; menuArena(p,m); };
  const gu2 = document.getElementById("gutama");
  if(gu2) gu2.onclick = ()=>{ S.semuaGame = false; menuArena(p,m); };
}

/* ---------- bilah atas setiap permainan ---------- */
function gBar(judul, kanan){
  return `<div class="g-bar">
    <button class="g-keluar" id="gkeluar">‹ Arena</button>
    <span class="g-judul">${judul}</span>
    <span class="g-status">${kanan}</span></div>`;
}
function pasangKeluar(p,m){
  const b = document.getElementById("gkeluar");
  if(b) b.onclick = ()=>{ tutupGame(); arena(p,m); };
}
function tombolUlang(id){
  return `<div class="g-aksi">
    <button class="tombol" id="gulangi">Main lagi</button>
    <button class="tombol garis" id="gkembali">Permainan lain</button></div>`;
}
function pasangUlang(p,m,mulai){
  const u = document.getElementById("gulangi");
  if(u) u.onclick = ()=>{ S.gs = null; bunyi("mulai"); arena(p,m); };
  const k = document.getElementById("gkembali");
  if(k) k.onclick = ()=>{ tutupGame(); arena(p,m); };
}

/* =======================================================================
   1. SUSUN GERAKAN
   ======================================================================= */
function mulaiSusun(m){
  hentikanGame();
  S.gs = {urut:[], sisa:acak(m.l.map((t,i)=>i)), nyawa:3, detik:0, menang:false, gagal:false, rekorBaru:false};
  S.gtik = setInterval(()=>{
    if(!S.gs || S.gs.menang || S.gs.gagal) return;
    S.gs.detik++;
    const el = document.getElementById("gjam");
    if(el) el.textContent = fmt(S.gs.detik);
  },1000);
}
function mainSusun(p,m){
  if(!S.gs) mulaiSusun(m);
  const g = S.gs;
  S.ulang = ()=> mainSusun(p,m);

  if(g.menang || g.gagal){
    hentikanGame();
    const bt = g.menang ? g.nyawa : 0;
    let h = gBar("🧩 Susun Gerakan", `<span id="gjam">${fmt(g.detik)}</span>`);
    h += `<div class="g-hasil ${g.menang?"":"g-kalah"}">
      <div class="g-bintang">${g.menang ? bintang(bt) : "😅"}</div>
      <p class="g-besar">${g.menang ? "Urutanmu benar semua!" : "Nyawamu habis"}</p>
      <p>${g.menang ? `Selesai dalam ${fmt(g.detik)} dengan sisa nyawa ${g.nyawa}.`
                    : "Perhatikan lagi urutan gerakannya di tab Gerakan, lalu coba sekali lagi."}</p>
      ${g.rekorBaru ? `<p class="g-rekorbaru">Rekor baru untuk materi ini!</p>` : ""}
    </div>${tombolUlang()}`;
    p.innerHTML = h;
    pasangKeluar(p,m); pasangUlang(p,m);
    return;
  }

  let h = gBar("🧩 Susun Gerakan", `${nyawaTeks(g.nyawa)} <span id="gjam">${fmt(g.detik)}</span>`);
  h += `<p class="catatan">Ketuk langkah sesuai urutan yang benar, mulai dari gerakan paling awal.</p>`;
  h += `<div class="g-progres"><span style="width:${Math.round(g.urut.length/m.l.length*100)}%"></span></div>`;
  h += `<ol class="g-slot">${g.urut.map(i=>`<li>${esc(m.l[i])}</li>`).join("")}
      ${g.urut.length < m.l.length ? `<li class="g-kosong">Langkah ke-${g.urut.length+1}?</li>` : ""}</ol>`;
  h += `<div class="g-acak">${g.sisa.map(i=>`<button data-lang="${i}">${esc(m.l[i])}</button>`).join("")}</div>`;
  p.innerHTML = h;
  pasangKeluar(p,m);

  p.querySelectorAll("[data-lang]").forEach(b=> b.onclick = ()=>{
    const i = Number(b.dataset.lang);
    if(i === g.urut.length){
      g.urut.push(i);
      g.sisa = g.sisa.filter(x=>x!==i);
      bunyi("benar");
      if(g.urut.length === m.l.length){
        g.menang = true;
        g.rekorBaru = catatRekor("susun", g.nyawa);
        bunyi("juara");
      }
      mainSusun(p,m);
    } else {
      g.nyawa--;
      bunyi("salah");
      b.classList.add("goyah");
      setTimeout(()=>b.classList.remove("goyah"),420);
      if(g.nyawa <= 0){ g.gagal = true; bunyi("habis"); mainSusun(p,m); }
      else {
        const st = p.querySelector(".g-status");
        if(st) st.innerHTML = `${nyawaTeks(g.nyawa)} <span id="gjam">${fmt(g.detik)}</span>`;
      }
    }
  });
}

/* =======================================================================
   2. KUIS KILAT
   ======================================================================= */
function mulaiKilat(m){
  hentikanGame();
  const soal = acak(m.k.map((q,i)=>i)).map(i=>{
    const q = m.k[i];
    return {s:q.s, x:q.x, img:q.img, opsi:acak(q.o.map((t,j)=>({t, benar:j===q.a})))};
  });
  const batas = Math.max(8, DETIK_KILAT + 3 - m.nomor*2);
  S.gs = {soal, ke:0, poin:0, streak:0, terbaikStreak:0, batas, sisa:batas, jawab:null, selesai:false, rekorBaru:false};
  S.gtik = setInterval(()=>{
    if(!S.gs || S.gs.selesai || S.gs.jawab !== null) return;
    S.gs.sisa--;
    const el = document.getElementById("gsisa"), c = document.getElementById("gcincin");
    if(el) el.textContent = S.gs.sisa;
    if(c) c.style.setProperty("--p", Math.round(S.gs.sisa/S.gs.batas*100)+"%");
    if(S.gs.sisa <= 0 && S.ulang){ S.gs.jawab = -1; S.gs.streak = 0; bunyi("habis"); S.ulang(); }
  },1000);
}
function mainKilat(p,m){
  if(!S.gs) mulaiKilat(m);
  const g = S.gs;
  S.ulang = ()=> mainKilat(p,m);

  if(g.selesai){
    hentikanGame();
    let h = gBar("⚡ Kuis Kilat", `${g.poin} poin`);
    h += `<div class="g-hasil">
      <div class="g-bintang">${g.poin >= g.soal.length*180 ? "🏆" : "⚡"}</div>
      <div class="g-poin">${g.poin}</div>
      <p class="g-besar">poin</p>
      <p>Rentetan jawaban benar terpanjangmu: ${g.terbaikStreak}.</p>
      ${g.rekorBaru ? `<p class="g-rekorbaru">Rekor baru untuk materi ini!</p>` : ""}
      <p class="catatan">Permainan ini untuk latihan sendiri, nilainya tidak dikirim ke gurumu.</p>
    </div>${tombolUlang()}`;
    p.innerHTML = h;
    pasangKeluar(p,m); pasangUlang(p,m);
    return;
  }

  const q = g.soal[g.ke];
  let h = gBar("⚡ Kuis Kilat", `<span class="g-poinkecil">${g.poin} poin</span>${g.streak>=2?`<span class="g-streak">🔥${g.streak}</span>`:""}`);
  h += `<div class="g-atas">
      <span class="g-nomor">Soal ${g.ke+1} dari ${g.soal.length}</span>
      <span class="g-cincin ${g.sisa<=5?"g-panas":""}" id="gcincin" style="--p:${Math.round(g.sisa/g.batas*100)}%"><b id="gsisa">${g.sisa}</b></span>
    </div>`;
  if(q.img) h += `<img class="foto" src="${q.img}" alt="Gambar soal" style="max-height:200px;border-radius:14px;margin-bottom:10px">`;
  h += `<p class="g-tanya">${esc(q.s)}</p>`;
  h += `<div class="g-opsi">`;
  q.opsi.forEach((o,j)=>{
    let kelas = "";
    if(g.jawab !== null) kelas = o.benar ? " benar" : (j === g.jawab ? " salah" : "");
    h += `<button class="pilihan${kelas}" data-opsi="${j}" ${g.jawab!==null?"disabled":""}>${esc(o.t)}</button>`;
  });
  h += `</div>`;
  if(g.jawab !== null){
    const benar = g.jawab >= 0 && q.opsi[g.jawab].benar;
    h += `<div class="bahas"><b>${benar ? "Benar!" : (g.jawab === -1 ? "Waktu habis." : "Belum tepat.")}</b> ${esc(q.x)}</div>
      <div class="g-aksi"><button class="tombol" id="glanjut">${g.ke+1 < g.soal.length ? "Soal berikutnya" : "Lihat hasil"}</button></div>`;
  }
  p.innerHTML = h;
  pasangKeluar(p,m);

  p.querySelectorAll("[data-opsi]").forEach(b=> b.onclick = ()=>{
    if(g.jawab !== null) return;
    const j = Number(b.dataset.opsi);
    g.jawab = j;
    if(q.opsi[j].benar){
      g.poin += 100 + g.sisa*10 + g.streak*25;
      g.streak++;
      g.terbaikStreak = Math.max(g.terbaikStreak, g.streak);
      bunyi("benar");
    } else { g.streak = 0; bunyi("salah"); }
    mainKilat(p,m);
  });
  const lj = document.getElementById("glanjut");
  if(lj) lj.onclick = ()=>{
    g.ke++;
    if(g.ke >= g.soal.length){
      g.selesai = true;
      g.rekorBaru = catatRekor("kilat", g.poin);
      bunyi("juara");
    } else { g.jawab = null; g.sisa = g.batas; }
    mainKilat(p,m);
  };
}

/* =======================================================================
   3. TANTANGAN GERAK
   ======================================================================= */
function mulaiTantangan(m){
  hentikanGame();
  const batas = Math.max(12, DETIK_TANTANGAN + 4 - m.nomor*2);
  S.gs = {kartu:m.l.map(t=>t), ke:0, batas, sisa:batas, selesai:0, habis:false, rekorBaru:false};
  S.gtik = setInterval(()=>{
    if(!S.gs || S.gs.habis) return;
    S.gs.sisa--;
    const el = document.getElementById("gsisa"), c = document.getElementById("gcincin");
    if(el) el.textContent = S.gs.sisa;
    if(c) c.style.setProperty("--p", Math.round(S.gs.sisa/S.gs.batas*100)+"%");
    if(S.gs.sisa <= 0 && S.ulang){ bunyi("habis"); lanjutTantangan(false); }
  },1000);
}
function lanjutTantangan(sukses){
  const g = S.gs;
  if(!g || g.habis) return;
  if(sukses){ g.selesai++; bunyi("benar"); }
  g.ke++;
  if(g.ke >= g.kartu.length){
    g.habis = true;
    g.rekorBaru = catatRekor("tantangan", g.selesai);
    bunyi("juara");
  } else g.sisa = g.batas;
  if(S.ulang) S.ulang();
}
function mainTantangan(p,m){
  if(!S.gs) mulaiTantangan(m);
  const g = S.gs;
  S.ulang = ()=> mainTantangan(p,m);

  if(g.habis){
    hentikanGame();
    let h = gBar("🏃 Tantangan Gerak", `${g.selesai}/${g.kartu.length}`);
    h += `<div class="g-hasil">
      <div class="g-bintang">${g.selesai === g.kartu.length ? "🎉" : "💪"}</div>
      <p class="g-besar">${g.selesai} dari ${g.kartu.length} tantangan selesai</p>
      <p>${g.selesai === g.kartu.length ? "Semua gerakan kamu praktikkan. Hebat!"
                                        : "Belum semuanya selesai. Coba lagi sambil minta temanmu mengamati gerakanmu."}</p>
      ${g.rekorBaru ? `<p class="g-rekorbaru">Rekor baru untuk materi ini!</p>` : ""}
    </div>${tombolUlang()}`;
    p.innerHTML = h;
    pasangKeluar(p,m); pasangUlang(p,m);
    return;
  }

  let h = gBar("🏃 Tantangan Gerak", `Kartu ${g.ke+1}/${g.kartu.length}`);
  h += `<div class="g-atas">
      <span class="g-nomor">Praktikkan gerakannya sekarang</span>
      <span class="g-cincin ${g.sisa<=5?"g-panas":""}" id="gcincin" style="--p:${Math.round(g.sisa/g.batas*100)}%"><b id="gsisa">${g.sisa}</b></span>
    </div>`;
  h += `<div class="panggung g-panggung">${svgGerak(m.a)}</div>`;
  if(fase_A()){
    const pk = piktoDariLangkah(g.kartu[g.ke]) || piktoDariAnimasi(m.a);
    h += `<div class="a-pilih" style="grid-template-columns:1fr"><div class="a-kartu" style="cursor:default">
      ${gambarPikto(pk)}<span class="a-label">${esc(namaPikto(pk))}</span></div></div>`;
  }
  h += `<p class="g-tanya">${esc(g.kartu[g.ke])}</p>`;
  h += `<div class="g-aksi">
      <button class="tombol" id="gsudah">Sudah aku lakukan</button>
      <button class="tombol garis" id="glewat">Lewati kartu ini</button></div>`;
  h += `<p class="catatan">Lakukan gerakannya di tempat yang lapang dan aman. Kalau lelah, istirahat dulu.</p>`;
  p.innerHTML = h;
  pasangKeluar(p,m);

  const svg = p.querySelector("svg.gerak");
  if(svg){ svg.classList.toggle("jeda",S.jeda); svg.classList.toggle("lambat",S.lambat); }
  const sd = document.getElementById("gsudah");
  if(sd) sd.onclick = ()=> lanjutTantangan(true);
  const lw = document.getElementById("glewat");
  if(lw) lw.onclick = ()=> lanjutTantangan(false);
}

/* =======================================================================
   BUKTI LATIHAN DI RUMAH
   Siswa menandai bahwa gerakan sudah dilakukan, dan bila diminta guru,
   melampirkan satu foto sebagai bukti. Foto dikecilkan lebih dulu agar
   ringan dikirim lewat jaringan rumah.
   ======================================================================= */
function kompresFoto(berkas, lebarMaks, mutu){
  return new Promise(ok=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const skala = Math.min(1, lebarMaks / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * skala);
        c.height = Math.round(img.height * skala);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        try{ ok(c.toDataURL("image/jpeg", mutu || 0.55)); }catch(e){ ok(null); }
      };
      img.onerror = ()=> ok(null);
      img.src = r.result;
    };
    r.onerror = ()=> ok(null);
    r.readAsDataURL(berkas);
  });
}
function kunciBukti(m){ return `${m.kodeMateri}-${(akunAktif()||{}).id || "tamu"}`; }
function buktiAktif(m){ return S.bukti[kunciBukti(m)] || null; }

async function simpanBukti(m, foto, catatan){
  const a = akunAktif();
  const d = {
    kode: m.kodeMateri, materi: m.j, kelasMateri: S.kelas,
    nama: a ? a.nama : "", kelas: a ? (a.kelas||"") : "",
    tgl: new Date().toISOString().slice(0,16).replace("T"," "),
    foto: foto || "", catatan: catatan || "", terkirim: false
  };
  S.bukti[kunciBukti(m)] = d;
  S.antrianBukti.push({aksi:"bukti", kodeKelas:S.kodeKelas, kunci:kunciBukti(m), ...d, foto:undefined, isi:d.foto});
  await simpanData();
  await kirimBuktiAntrian();
  return d;
}
async function kirimBuktiAntrian(){
  if(!S.server || !S.antrianBukti.length) return;
  const sisa = [];
  for(const d of S.antrianBukti){
    let sukses = false;
    try{
      const r = await fetch(S.server, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify(d)});
      const j = await r.json();
      sukses = !!(j && j.ok);
    }catch(e){ sukses = false; }
    if(sukses){
      if(S.bukti[d.kunci]) S.bukti[d.kunci].terkirim = true;
    } else sisa.push(d);
  }
  const berubah = sisa.length !== S.antrianBukti.length;
  S.antrianBukti = sisa;
  if(berubah) await simpanData();
  return berubah;
}
async function ambilBukti(kodeMateri){
  if(!S.server || !S.kodeKelas || !S.kodeGuru) return {ok:false, pesan:"Kode kelas dan kode guru belum lengkap."};
  try{
    const r = await fetch(S.server + (S.server.includes("?")?"&":"?") + "aksi=bukti" +
      "&kode=" + encodeURIComponent(S.kodeKelas) +
      "&guru=" + encodeURIComponent(S.kodeGuru) +
      "&materi=" + encodeURIComponent(kodeMateri));
    const j = await r.json();
    if(!j || j.ok === false) return {ok:false, pesan:(j && j.pesan) || "Server menolak permintaan."};
    return {ok:true, daftar: j.daftar || []};
  }catch(e){ return {ok:false, pesan:"Gagal menghubungi server."}; }
}

function pasangBukti(p, m){
  let fotoSementara = null;
  const kabar = ()=> document.getElementById("pesanbukti");
  const inp = document.getElementById("fotobukti");
  if(inp) inp.onchange = async ()=>{
    const f = inp.files && inp.files[0];

    kabar().textContent = "Mengecilkan foto...";
    fotoSementara = await kompresFoto(f, 720, 0.55);

    kabar().textContent = fotoSementara
      ? `Foto siap (sekitar ${Math.round(fotoSementara.length/1400)} KB). Tekan tombol di bawah untuk mengirim.`
      : "Foto gagal dibaca, coba foto lain.";
  };

  if(kirim) kirim.onclick = async ()=>{
    if(S.mintaFoto && !fotoSementara){
      kabar().textContent = "Gurumu meminta foto. Ambil fotonya dulu ya.";

    }
    const cat = (document.getElementById("catatanbukti")||{}).value || "";

    } else if(id==="gerak"){
      p.innerHTML = barisSuara() + `<h3>Lihat gerakannya</h3>${blokPeraga(m)}
        <h3>Lakukan berurutan</h3><ol class="langkah">${m.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
      pasangKendali();
      pastikanGambar(m);
    } else if(id==="video"){
      p.innerHTML = blokVideo(m);
    } else if(id==="materi"){
      p.innerHTML = barisSuara() + tampilMateriLengkap(m) +
        ((m.p||[]).length ? `<h3>Permainan latihan</h3>
          <p class="catatan">Mainkan bersama teman atau keluarga setelah kamu menguasai gerakannya.</p>
          ${m.p.map(x=>`<div class="main"><b>${esc(x.n)}</b>${esc(x.d)}</div>`).join("")}` : "");
    } else if(id==="rumah"){
      p.innerHTML = barisSuara() + tampilRumah(m) + blokBukti(m);
      pasangBukti(p,m);
    } else kuis(p,m);
    pasangSuara(m, id);
    return;
  }

  if(id==="bantu"){ alatBantu(p,m); return; }
  if(id==="kuis"){ editorKuis(p,m); return; }
  if(id==="video"){ p.innerHTML = blokVideo(m); pasangVideo(p,m); return; }
  if(S.ubah){ p.innerHTML = tombolUbah() + formUbah(m); pasangUbah(p,m); return; }

  if(id==="modul"){
    p.innerHTML = tombolUbah() + `<h3>Peragaan gerak untuk ditayangkan</h3>${blokPeraga(m)}
      <p class="catatan">Alokasi 3 JP (105 menit): pendahuluan 15, inti 75, penutup 15.</p>
      <h3>Capaian pembelajaran</h3><p>${FASE[S.kelas].f} — ${esc(FASE[S.kelas].d)}</p>
      <h3>Tujuan pembelajaran</h3><ul class="rapi">${m.t.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <h3>Materi pokok</h3><ol class="langkah">${m.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
    pasangKendali();
  } else if(id==="materi"){
    p.innerHTML = tombolUbah() + tampilMateriLengkap(m);
  } else if(id==="alur"){
    p.innerHTML = tombolUbah() + `<h3>Kegiatan pendahuluan</h3><p>${esc(m.g.pe)}</p>
      <h3>Kegiatan inti</h3><p>${esc(m.g.in)}</p>
      <h3>Kegiatan penutup</h3><p>${esc(m.g.pu)}</p>
      <h3>Permainan yang digunakan</h3>${m.p.map(x=>`<div class="main"><b>${esc(x.n)}</b>${esc(x.d)}</div>`).join("")}`;
  } else if(id==="rumah"){
    p.innerHTML = tombolUbah() + tampilRumah(m) + blokBuktiGuru(m);
    pasangBuktiGuru(p,m);
  } else if(id==="alat"){
    p.innerHTML = tombolUbah() + `<h3>Alat dan bahan</h3><ul class="rapi">${m.g.alat.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <p class="catatan">Alat dapat diganti barang bekas yang aman apabila sarana sekolah terbatas.</p>`;
  } else if(id==="nilai"){ penilaian(p,m); }
  pasangUbah(p,m);
}

/* ---------- penyunting kuis untuk guru ---------- */
function editorKuis(p,m){
  if(!S.draftKuis) S.draftKuis = JSON.parse(JSON.stringify(m.k));
  const d = S.draftKuis;
  const sdh = adaSuntingan(S.kelas,S.materi);
  let h = `<div class="kendali" style="margin-top:0">
      <button class="tombol" id="simpankuis">Simpan kuis</button>
      <button id="tambahsoal">+ Tambah soal</button>
      ${sdh?`<button id="pulihkuis">Kembalikan kuis bawaan</button>`:""}
    </div>
    <p class="catatan">Ubah pertanyaan, pilihan jawaban, kunci jawaban, dan pembahasannya. Setiap soal boleh diberi satu gambar.</p>`;

  d.forEach((q,i)=>{
    h += `<div class="main" style="border-style:solid">
      <div class="baris-soal"><b>Soal ${i+1}</b>
        <button class="hapus" data-hapussoal="${i}" aria-label="Hapus soal ${i+1}">✕</button></div>
      <h3 style="margin-top:8px">Pertanyaan</h3>
      <textarea data-f="s" data-i="${i}" style="min-height:66px">${esc(q.s)}</textarea>
      <h3>Pilihan jawaban</h3>
      <p class="catatan" style="margin-top:-4px">Satu pilihan per baris, dua sampai empat pilihan.</p>
      <textarea data-f="o" data-i="${i}" style="min-height:88px">${esc(q.o.join("\n"))}</textarea>
      <h3>Kunci jawaban</h3>
      <select data-f="a" data-i="${i}" style="padding:9px;border:2px solid var(--garis);border-radius:10px;font-family:var(--teks);font-size:15px;background:#fff;width:100%">
        ${q.o.map((o,j)=>`<option value="${j}" ${j===q.a?"selected":""}>${esc(o)}</option>`).join("")}
      </select>
      <h3>Pembahasan</h3>
      <textarea data-f="x" data-i="${i}" style="min-height:66px">${esc(q.x)}</textarea>
      <h3>Gambar soal</h3>`;
    h += q.img
      ? `<img class="foto" src="${q.img}" alt="Gambar soal ${i+1}" style="max-height:190px;border-radius:10px">
         <div class="kendali"><button data-hapusgbr="${i}">Hapus gambar soal</button></div>`
      : `<div class="kendali"><label class="unggah">+ Unggah gambar soal<input type="file" data-gbr="${i}" accept="image/*"></label></div>`;
    h += `</div>`;
  });

  if(d.length===0) h += `<p class="kosong">Belum ada soal. Tekan Tambah soal untuk mulai menyusun.</p>`;
  h += `<p class="catatan" id="pesankuis"></p>`;
  p.innerHTML = h;

  p.querySelectorAll("[data-f]").forEach(el=>{
    el.onchange = ()=>{
      const i = Number(el.dataset.i);
      if(el.dataset.f==="o"){
        const pil = baris(el.value).slice(0,4);
        if(pil.length>=2){ d[i].o = pil; if(d[i].a>=pil.length) d[i].a=0; }
        editorKuis(p,m); return;
      }
      if(el.dataset.f==="a") d[i].a = Number(el.value);
      else d[i][el.dataset.f] = el.value.trim();
    };
  });
  p.querySelectorAll("[data-hapussoal]").forEach(b=>b.onclick=()=>{
    if(!confirm("Hapus soal ini?")) return;
    d.splice(Number(b.dataset.hapussoal),1); editorKuis(p,m);
  });
  p.querySelectorAll("[data-gbr]").forEach(el=>el.onchange=async ()=>{
    const f = el.files[0]; if(!f) return;
    const data = await kecilkan(f);
    if(data){ d[Number(el.dataset.gbr)].img = data; editorKuis(p,m); }
  });
  p.querySelectorAll("[data-hapusgbr]").forEach(b=>b.onclick=()=>{
    delete d[Number(b.dataset.hapusgbr)].img; editorKuis(p,m);
  });
  document.getElementById("tambahsoal").onclick = ()=>{
    d.push({s:"Pertanyaan baru",o:["Pilihan A","Pilihan B","Pilihan C"],a:0,x:"Penjelasan jawaban benar."});
    editorKuis(p,m);
  };
  document.getElementById("simpankuis").onclick = async ()=>{
    const sah = d.filter(q=>q.s.trim() && q.o.length>=2);
    if(!sah.length){ document.getElementById("pesankuis").textContent="Kuis harus berisi minimal satu soal dengan dua pilihan jawaban."; return; }
    await simpanSunting({k:sah});
    S.draftKuis=null; S.jawab={};
    editorKuis(p,temuAktif(S.kelas,S.materi,S.temuKe));
    document.getElementById("pesankuis").textContent="Kuis tersimpan dan langsung dipakai di menu siswa.";
  };
  const pk = document.getElementById("pulihkuis");
  if(pk) pk.onclick = async ()=>{
    if(!confirm("Kembalikan kuis materi ini ke soal bawaan aplikasi?")) return;
    const k = kunciMateri();
    const d = S.temuData[k];
    if(d && d.list && d.list[S.temuKe]) delete d.list[S.temuKe].k;
    if(S.sunting[k]){ delete S.sunting[k].k; if(!Object.keys(S.sunting[k]).length) delete S.sunting[k]; }
    await simpanData(); S.draftKuis=null; S.jawab={}; panel();
  };
}

/* ---------- kuis ---------- */
function kuis(p,m){
  const kunci = m.kodeTemu;
  const hasil = progresAktif()[kunci];

  if(hasil!==undefined){
    p.innerHTML = `<div class="skor"><div class="angka">✓</div>
      <p>Kuis materi ini sudah kamu kerjakan dan jawabanmu sudah terkirim ke guru.</p></div>
      ${S.antrian.length ? `<p class="catatan" style="margin-top:12px">Ada ${S.antrian.length} hasil yang belum sampai ke guru karena internet terputus. Buka aplikasi ini lagi saat ada internet, hasilnya akan terkirim sendiri.</p>`
        : `<p class="catatan" style="margin-top:12px">Hasilnya akan disampaikan gurumu. Kalau ingin mengerjakan ulang, mintalah gurumu membuka kembali kuis ini.</p>`}`;
    return;
  }

  let h = `<h3 style="margin-top:0">Uji pemahaman</h3>
    <p class="catatan">Pilih satu jawaban untuk tiap soal. Jawaban masih bisa kamu ubah sebelum dikirim.</p>`;
  m.k.forEach((q,i)=>{
    h += `<div class="soal"><div class="no">Soal ${i+1} dari ${m.k.length}</div>`;
    if(q.img) h += `<img class="foto" src="${q.img}" alt="Gambar soal ${i+1}" style="max-height:210px;border-radius:10px;margin-bottom:10px">`;
    h += `<button class="dengar" data-dengar="${i}" aria-label="Dengarkan soal">🔊 Dengarkan soal</button>`;
    h += `<div class="tanya">${esc(q.s)}</div>`;
    if(q.gbr && q.o.every(x=>PIKTO[x])){
      h += `<div class="a-pilih tiga">`;
      q.o.forEach((o,j)=>{
        const dipilih = S.jawab[i]===j;
        h += `<button class="a-kartu${dipilih?" a-benar":""}" data-s="${i}" data-o="${j}" aria-pressed="${dipilih}">
          ${gambarPikto(o)}<span class="a-label">${esc(namaPikto(o))}</span></button>`;
      });
      h += `</div>`;
    } else {
      q.o.forEach((o,j)=>{
        const dipilih = S.jawab[i]===j;
        h += `<button class="pilihan${dipilih?" dipilih":""}" data-s="${i}" data-o="${j}" aria-pressed="${dipilih}">${esc(o)}</button>`;
      });
    }
    h += `</div>`;
  });
  h = barisSuara() + `<p class="catatan">Ketuk tanda 🔊 pada setiap soal untuk mendengarkan pertanyaannya.</p>` + h;
  const lengkap = Object.keys(S.jawab).length===m.k.length;
  h += `<p class="catatan">${lengkap?"Semua soal sudah terisi.":`Terisi ${Object.keys(S.jawab).length} dari ${m.k.length} soal.`}</p>
    <button class="tombol" id="kirimkuis" ${lengkap?"":"disabled style=opacity:.5"}>Kirim jawaban</button>`;
  p.innerHTML = h;

  p.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ S.jawab[b.dataset.s]=Number(b.dataset.o); kuis(p,m); });
  pasangSuara(m, "kuis");
  p.querySelectorAll("[data-dengar]").forEach(b=>b.onclick=()=>{
    const q = m.k[Number(b.dataset.dengar)];
    if(!q) return;
    S.bunyi = true;
    ucap(q.s + ". " + q.o.map((x,j)=>`Pilihan ${String.fromCharCode(65+j)}. ${x}`).join(". "));
  });
  const kirim = document.getElementById("kirimkuis");
  if(kirim && lengkap) kirim.onclick = async ()=>{
    const benar = m.k.filter((q,i)=>S.jawab[i]===q.a).length;
    const nilai = Math.round(benar/m.k.length*100);
    progresAktif()[kunci] = {n:nilai, b:benar, t:m.k.length, tgl:new Date().toISOString().slice(0,10)};
    const a = akunAktif();
    if(a && S.server){
      S.antrian.push({nama:a.nama, kelas:a.kelas||"", materi:m.j, kelasMateri:S.kelas,
                      kode:m.kodeMateri, pertemuan:m.nomor, judulTemu:m.judul,
                      benar, total:m.k.length, nilai, perangkat:idPerangkat(),
                      kodeKelas: a.kodeKelas || S.kodeUndangan || S.kodeKelas || ""});
    }
    if(S.siswaAktif) await simpanData();
    S.jawab = {};
    p.innerHTML = `<p class="catatan">Mengirim jawaban...</p>`;
    await kirimAntrian();
    kuis(p, m);
  };
}

/* ---------- penilaian ---------- */
function kelompokHasil(m){
  /* hanya nilai siswa dari jenjang kelas yang sedang dibuka guru,
     supaya penilaian kelas 1, 2, dan 3 tidak tercampur */
  const data = (S.hasilServer||[]).filter(x=>{
    const cocokMateri = x.kode
      ? (String(x.kode)===String(m.kodeMateri) && String(x.pertemuan||1)===String(m.nomor))
      : (String(x.materi)===String(m.j) && m.nomor===1);
    return cocokMateri && (!S.kelas || String(x.kelas)===String(S.kelas));
  });
  const peta = {};
  data.forEach(x=>{
    const kunci = `${m.kodeTemu}|${String(x.nama).trim().toLowerCase()}|${x.kelas}`;
    (peta[kunci] = peta[kunci] || {kunci, nama:String(x.nama).trim(), kelas:x.kelas, kirim:[]}).kirim.push(x);
  });
  const hasil = Object.values(peta);
  hasil.forEach(g=>{
    g.kirim.sort((a,b)=> String(a.waktu).localeCompare(String(b.waktu)));
    const pilih = S.pilihanNilai[g.kunci];
    g.pilih = (pilih!==undefined && pilih < g.kirim.length) ? pilih : 0;
  });
  return hasil.sort((a,b)=> (a.kelas-b.kelas) || a.nama.localeCompare(b.nama));
}
function hasilKuisMateri(m){
  const kunci = m.kodeTemu;
  const baris = Object.entries(S.akun)
    .filter(([id,a])=>a.progres && a.progres[kunci]!==undefined)
    .map(([id,a])=>({id, nama:a.nama, kelas:a.kelas||"–", h:a.progres[kunci]}))
    .sort((x,y)=> (x.kelas+"").localeCompare(y.kelas+"") || x.nama.localeCompare(y.nama));
  let h = `<h3 style="margin-top:0">Hasil kuis siswa</h3>`;
  if(baris.length===0){
    h += `<p class="catatan">Belum ada siswa yang mengerjakan kuis materi ini di perangkat ini.</p>`;
  } else {
    h += `<div class="gulir"><table><thead><tr><th>Nama</th><th>Kelas</th><th>Benar</th><th>Nilai</th><th>Tanggal</th><th></th></tr></thead><tbody>`;
    baris.forEach(r=>{
      const nilai = nilaiDari(r.h);
      const benar = typeof r.h==="object" ? `${r.h.b}/${r.h.t}` : "–";
      const tgl = typeof r.h==="object" ? (r.h.tgl||"–") : "–";
      h += `<tr><td>${esc(r.nama)}</td><td>${r.kelas}</td><td>${benar}</td>
        <td class="nilai">${nilai}</td><td>${tgl}</td>
        <td><button class="hapus" data-bukakuis="${r.id}" title="Buka kembali kuis untuk siswa ini" aria-label="Buka kembali kuis ${esc(r.nama)}">↺</button></td></tr>`;
    });
    const rata = Math.round(baris.reduce((x,r)=>x+nilaiDari(r.h),0)/baris.length);
    h += `</tbody></table></div>
      <p class="catatan">${baris.length} siswa mengerjakan · rata-rata nilai ${rata}. Tombol ↺ membuka kembali kuis agar siswa dapat mengerjakan ulang.</p>
      <p><button class="tombol garis" id="salinkuis">Salin hasil kuis</button></p>
      <p class="catatan" id="pesankuisguru"></p>`;
  }
  h += `<h3>Hasil dari server daring</h3>`;
  if(!S.server){
    h += `<p class="catatan">Server nilai belum diatur. Isi alamatnya di tab Alat Bantu agar nilai siswa yang mengerjakan di rumah ikut masuk ke sini.</p>`;
  } else if(!S.kodeKelas){
    h += `<p class="catatan">Kamu belum punya kode kelas. Buat kode lebih dulu di halaman awal menu guru, lalu bagikan tautan siswa yang sudah berkode itu.</p>`;
  } else if(!S.bukaNilai){
    h += `<p class="catatan">Nilai terkunci. Buka dulu lewat halaman awal menu guru: pilih kelas, lalu masukkan kode guru pada kotak Nilai siswa.</p>`;
  } else if(!S.hasilServer){
    h += `<p class="catatan">Tekan tombol di bawah untuk mengambil nilai siswa dari Spreadsheet.</p>
      <p><button class="tombol" id="ambilserver">Ambil hasil dari server</button></p>
      <p class="catatan" id="pesanserverguru"></p>`;
  } else {
    h += `<p><button class="tombol garis" id="ambilserver">Muat ulang hasil</button></p>
      <p class="catatan" id="pesanserverguru"></p>`;
    const grup = kelompokHasil(m);
    if(grup.length===0){
      h += `<p class="catatan">Belum ada siswa yang mengirim nilai untuk materi ini.</p>`;
    } else {
      const ganda = grup.filter(g=>g.kirim.length>1);
      const bedaAlat = ganda.filter(g=>new Set(g.kirim.map(k=>k.perangkat)).size>1);
      h += `<div class="gulir"><table><thead><tr><th>Nama</th><th>Kelas</th><th>Benar</th><th>Nilai dipakai</th><th>Waktu</th><th>Pengiriman</th></tr></thead><tbody>`;
      grup.forEach(g=>{
        const t = g.kirim[g.pilih];
        const tanda = g.kirim.length>1
          ? `<span class="lencana" style="background:#FDECE7;color:var(--lintasan)">${g.kirim.length}×</span>`
          : `1×`;
        h += `<tr><td>${esc(g.nama)}</td><td>${esc(g.kelas)}</td><td>${esc(t.benar)}/${esc(t.total)}</td>
          <td class="nilai">${esc(t.nilai)}</td><td>${esc(String(t.waktu).slice(0,16))}</td><td>${tanda}</td></tr>`;
        if(g.kirim.length>1){
          g.kirim.forEach((k,i)=>{
            const dipakai = i===g.pilih;
            h += `<tr style="background:var(--kapur)"><td colspan="2" style="padding-left:18px;font-size:13px">
                Pengiriman ${i+1} · perangkat ${esc(k.perangkat||"?")}</td>
              <td style="font-size:13px">${esc(k.benar)}/${esc(k.total)}</td>
              <td style="font-size:13px">${esc(k.nilai)}</td>
              <td style="font-size:13px">${esc(String(k.waktu).slice(0,16))}</td>
              <td>${dipakai?`<b style="font-size:12px">dipakai</b>`
                : `<button class="tombol garis" style="padding:4px 10px;font-size:12px" data-pakai="${esc(g.kunci)}|${i}">Pakai</button>`}</td></tr>`;
          });
        }
      });
      const rata = Math.round(grup.reduce((a,g)=>a+Number(g.kirim[g.pilih].nilai||0),0)/grup.length);
      h += `</tbody></table></div>
        <p class="catatan">${grup.length} siswa · rata-rata ${rata}. Nilai yang dipakai secara bawaan adalah pengiriman pertama.</p>`;
      if(ganda.length){
        h += `<div class="main" style="border-color:var(--lintasan)">
          <b>Perlu diperiksa: ${ganda.length} siswa mengirim lebih dari sekali</b>
          ${bedaAlat.length ? `${bedaAlat.length} di antaranya mengirim dari perangkat berbeda dengan nama yang sama — periksa apakah dikerjakan ulang sendiri atau dibantu orang lain. ` : ""}
          Pilih pengiriman mana yang dipakai lewat tombol Pakai pada baris abu-abu.</div>`;
      }
      h += `<p><button class="tombol garis" id="salindaring">Salin rekap nilai akhir</button></p>`;
    }
  }
  return h + `<hr style="border:0;border-top:1px solid var(--garis);margin:22px 0">`;
}
function pasangHasilKuis(p,m){
  p.querySelectorAll("[data-bukakuis]").forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.bukakuis, a = S.akun[id];
    if(!confirm(`Buka kembali kuis materi ini untuk ${a.nama}? Nilai lamanya akan terhapus.`)) return;
    delete a.progres[m.kodeTemu];
    await simpanData(); penilaian(p,m);
  });
  p.querySelectorAll("[data-pakai]").forEach(b=>b.onclick=async ()=>{
    const pisah = b.dataset.pakai.lastIndexOf("|");
    S.pilihanNilai[b.dataset.pakai.slice(0,pisah)] = Number(b.dataset.pakai.slice(pisah+1));
    await simpanData(); penilaian(p,m);
  });
  const sd = document.getElementById("salindaring");
  if(sd) sd.onclick = ()=>{
    const grup = kelompokHasil(m);
    let teks = `Rekap Nilai Kuis Daring\n${m.j}\n\n`;
    grup.forEach((g,i)=>{
      const t = g.kirim[g.pilih];
      teks += `${i+1}. ${g.nama} (Kelas ${g.kelas}) — ${t.benar}/${t.total} — nilai ${t.nilai}` +
              (g.kirim.length>1 ? ` [${g.kirim.length} pengiriman]` : "") + `\n`;
    });
    navigator.clipboard.writeText(teks).then(
      ()=>document.getElementById("pesanserverguru").textContent="Rekap nilai akhir tersalin.",
      ()=>document.getElementById("pesanserverguru").textContent="Penyalinan gagal.");
  };
  const as = document.getElementById("ambilserver");
  if(as) as.onclick = async ()=>{
    const kabar = document.getElementById("pesanserverguru");
    kabar.textContent = "Mengambil data...";
    const r = await ambilHasilServer();
    if(!r.ok){ kabar.textContent = r.pesan; return; }
    penilaian(p,m);
  };
  const sk = document.getElementById("salinkuis");
  if(sk) sk.onclick = ()=>{
    const kunci = m.kodeTemu;
    let teks = `Hasil Kuis PJOK\n${m.j} — Kelas ${S.kelas}\n\n`;
    Object.values(S.akun).filter(a=>a.progres && a.progres[kunci]!==undefined).forEach((a,i)=>{
      const hh = a.progres[kunci];
      teks += `${i+1}. ${a.nama} (Kelas ${a.kelas||"-"}) — ${typeof hh==="object"?hh.b+"/"+hh.t:"-"} benar — nilai ${nilaiDari(hh)}\n`;
    });
    navigator.clipboard.writeText(teks).then(
      ()=>document.getElementById("pesankuisguru").textContent="Hasil kuis tersalin. Tempel di Word, Excel, atau WhatsApp.",
      ()=>document.getElementById("pesankuisguru").textContent="Penyalinan gagal. Salin manual dari tabel di atas.");
  };
}

function penilaian(p,m){
  const asp = m.g.r;
  let h = tombolUbah() + hasilKuisMateri(m) + `<h3>Lembar penilaian keterampilan · Kelas ${S.kelas}</h3>
    <p class="catatan">Skala 1–4 pada setiap aspek. Nilai akhir dihitung otomatis.</p>
    <div class="isian"><input id="nama" placeholder="Nama siswa" autocomplete="off">
    <button class="tombol" id="tambah">Tambah siswa</button></div>
    <div class="gulir"><table><thead><tr><th>Nama</th>${asp.map(a=>`<th>${esc(a)}</th>`).join("")}<th>Nilai</th><th></th></tr></thead><tbody>`;
  if(S.nilai.length===0){
    h += `<tr><td class="kosong" colspan="${asp.length+3}">Belum ada siswa. Tambahkan nama untuk mulai menilai.</td></tr>`;
  } else {
    S.nilai.forEach((s,i)=>{
      const nilai = Math.round(s.s.reduce((a,b)=>a+b,0)/(asp.length*4)*100);
      h += `<tr><td>${esc(s.n)}</td>`;
      s.s.forEach((v,j)=> h += `<td><select data-i="${i}" data-j="${j}">${[1,2,3,4].map(x=>`<option value="${x}" ${x===v?"selected":""}>${x}</option>`).join("")}</select></td>`);
      h += `<td class="nilai">${nilai}</td><td><button class="hapus" data-hapus="${i}" aria-label="Hapus ${esc(s.n)}">✕</button></td></tr>`;
    });
  }
  h += `</tbody></table></div>`;
  if(S.nilai.length>0) h += `<p style="margin-top:14px"><button class="tombol garis" id="salin">Salin rekap nilai</button></p><p class="catatan" id="pesan"></p>`;
  h += `<p class="catatan" style="margin-top:16px">Data hanya tersimpan selama halaman dibuka. Salin rekapnya sebelum menutup aplikasi.</p>`;
  p.innerHTML=h;

  const tambah = ()=>{ const el=document.getElementById("nama"), n=el.value.trim();
    if(!n){ el.focus(); return; } S.nilai.push({n, s:asp.map(()=>3)}); penilaian(p,m); document.getElementById("nama").focus(); };
  document.getElementById("tambah").onclick = tambah;
  document.getElementById("nama").onkeydown = e=>{ if(e.key==="Enter") tambah(); };
  p.querySelectorAll("td select").forEach(sel=>sel.onchange=()=>{ S.nilai[sel.dataset.i].s[sel.dataset.j]=Number(sel.value); penilaian(p,m); });
  p.querySelectorAll("[data-hapus]").forEach(b=>b.onclick=()=>{ S.nilai.splice(Number(b.dataset.hapus),1); penilaian(p,m); });
  pasangHasilKuis(p,m);
  pasangUbah(p,m);
  const sl=document.getElementById("salin");
  if(sl) sl.onclick=()=>{
    let teks = `Rekap Penilaian PJOK\nKelas ${S.kelas} — ${m.j}\nAspek: ${asp.join(", ")}\n\n`;
    S.nilai.forEach((s,i)=>{ const nilai=Math.round(s.s.reduce((a,b)=>a+b,0)/(asp.length*4)*100);
      teks += `${i+1}. ${s.n} — ${s.s.join("/")} — nilai ${nilai}\n`; });
    navigator.clipboard.writeText(teks).then(
      ()=>document.getElementById("pesan").textContent="Rekap tersalin. Tempel di WhatsApp, Word, atau Excel.",
      ()=>document.getElementById("pesan").textContent="Penyalinan gagal. Salin manual dari tabel di atas.");
  };
}

    if(!h.baru){ kabar.textContent = h.pesan || "Tidak ada materi di server."; return; }
    pasangNamaApp();
    kabar.textContent = "Materi terbaru berhasil diterapkan di perangkat ini.";
    setTimeout(render, 900);
  };
  document.getElementById("eksporapp").onclick = ()=>{
    const kabar = document.getElementById("pesanekspor");
    try{
      const isiBawaan = JSON.stringify({gambar:S.gambar, video:S.video, sunting:S.sunting,
                                        regu:S.regunama, preset:S.preset, server:S.server,
                                        namaApp:S.namaApp, subApp:S.subApp, logo:S.logo,
                                        tambahan:S.tambahan, temuData:S.temuData, tautanCP:S.tautanCP}).replace(/<\//g,"<\\/");
      let sumber = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      sumber = sumber.replace(/(<main[^>]*id="isi"[^>]*>)[\s\S]*?(<\/main>)/, "$1$2");
      const penanda = "let BAWAAN = null; /*ISI-BAWAAN*/";
      if(sumber.indexOf(penanda) === -1){ kabar.textContent = "Penanda isi bawaan tidak ditemukan pada file ini."; return; }
      sumber = sumber.replace(penanda, "let BAWAAN = " + isiBawaan + "; /*ISI-BAWAAN*/");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([sumber],{type:"text/html"}));
      a.download = "ayo-gerak-siap-dibagikan.html";
      a.click(); URL.revokeObjectURL(a.href);
      const mb = (sumber.length/1048576).toFixed(1);
      kabar.textContent = `Aplikasi diunduh (sekitar ${mb} MB). File ini bisa langsung dibuka guru lain atau diunggah ke internet.`;
    }catch(e){ kabar.textContent = "Gagal membuat salinan aplikasi: " + e.message; }
  };
  document.getElementById("hapussunting").onclick = async ()=>{
    if(jumlahUbah===0){ pesan.textContent="Belum ada modul yang disesuaikan."; return; }
    if(!confirm(`Kembalikan ${jumlahUbah} materi ke isi bawaan aplikasi? Gambar tidak ikut terhapus.`)) return;
    S.sunting = {}; await simpanData(); alatBantu(p,m);
    document.getElementById("pesangambar").textContent = "Seluruh modul kembali ke isi bawaan.";
  };
  document.getElementById("hapussemua").onclick = async ()=>{
    if(jumlahFoto===0){ pesan.textContent="Belum ada gambar yang tersimpan."; return; }
    if(!confirm(`Hapus seluruh ${jumlahFoto} gambar peraga? Penyesuaian modul tidak ikut terhapus.`)) return;
    S.gambar = {}; await simpanData(); alatBantu(p,m);
    document.getElementById("pesangambar").textContent = "Semua gambar dihapus. Materi kembali memakai animasi.";
  };
}

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      S.luring = true;
      reg.addEventListener("updatefound", ()=>{
        const baru = reg.installing;
        if(!baru) return;
        baru.addEventListener("statechange", ()=>{
          if(baru.state === "installed" && navigator.serviceWorker.controller) S.adaPembaruan = true;
        });
      });
      // periksa pembaruan aplikasi setiap kali dibuka
      reg.update().catch(()=>{});
    }).catch(()=>{ S.luring = false; });
  });
}

muatData().then(()=>{
                 migrasiSemua();
                 let perluSimpan = false;
                 /* Tautan undangan selalu menang atas pengaturan lama di perangkat siswa,
                    supaya guru yang mengganti alamat server atau kode kelas cukup
                    membagikan tautan baru tanpa menyuruh siswa menghapus aplikasinya. */
                 if(S.serverUndangan && S.server !== S.serverUndangan){
                   S.server = S.serverUndangan; perluSimpan = true;
                 }
                 if(S.kodeUndangan && S.kodeKelas !== S.kodeUndangan){
                   S.kodeKelas = S.kodeUndangan;
                   S.versiKonten = 0;          // materi ditarik ulang dari kode yang baru
                   S.versiGambar = 0;
                   S.gambarAmbil = {};
                   perluSimpan = true;
                 }
                 if(perluSimpan) simpanData();
                 render(); kirimAntrian(); kirimBuktiAntrian(); sinkronKonten();
               },
               ()=>{ migrasiSemua(); render(); });
</script>
