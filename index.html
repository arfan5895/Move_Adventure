<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move Adventure — Belajar PBB dan Gerak Dasar</title>
<meta name="theme-color" content="#243B6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap">
<style>
  :root{
    /* ---- palet lapangan pagi ---- */
    --lapangan:#0B7A56;        /* hijau lapangan, dasar tombol utama */
    --lapangan-tua:#0A2E27;    /* warna teks */
    --kapur:#E8F4FF;           /* latar langit */
    --tenis:#FFD84D;           /* aksen menu siswa */
    --lintasan:#FF6B2C;        /* aksen menu guru */
    --abu:#5C7269;
    --garis:#C7DBE8;
    --langit:#BFE6FF;
    --rumput:#7ED957;
    --biru:#2F7BFF;
    --ungu:#8B5CF6;
    --pink:#FF5D8F;
    --pemain:#14364F;
    --tepi:#08543C;            /* tepi bawah tombol utama */
    --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
    --teks:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    --aksen:var(--tenis);
    --aksen-tepi:#C9A200;
    --radius:20px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--kapur);
    background-image:radial-gradient(circle 380px at 8% -90px,rgba(126,217,87,.30),rgba(126,217,87,0) 72%);
    background-repeat:no-repeat;background-attachment:fixed;
    color:var(--lapangan-tua);font-family:var(--teks);font-size:17px;line-height:1.6;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  }
  .bungkus{max-width:760px;margin:0 auto;padding:0 18px 110px}

  /* =============== kepala =============== */
  header.lapangan{
    background:var(--lapangan);
    background-image:repeating-linear-gradient(90deg,transparent 0 43px,rgba(255,255,255,.08) 43px 46px);
    color:#fff;padding:20px 0 20px;border-bottom:7px solid var(--aksen);
    border-radius:0 0 26px 26px;transition:border-color .2s ease;
  }
  .kepala-isi{max-width:760px;margin:0 auto;padding:0 18px}
  .logo{display:flex;align-items:center;gap:13px}
  .peluit{
    width:48px;height:48px;border-radius:16px;background:var(--aksen);
    display:grid;place-items:center;font-family:var(--display);font-size:19px;font-weight:600;
    color:var(--lapangan-tua);flex:none;transition:background .2s ease;overflow:hidden;
    box-shadow:0 4px 0 rgba(0,0,0,.22);
  }
  .peluit.berlogo{background:#fff}
  .peluit img{width:100%;height:100%;object-fit:contain;display:block}
  .logo h1{font-family:var(--display);font-weight:600;font-size:clamp(27px,7.4vw,36px);letter-spacing:-.01em;margin:0;line-height:1.05}
  .logo p{margin:2px 0 0;font-size:14px;color:rgba(255,255,255,.85);line-height:1.35}

  .peran{display:flex;gap:7px;margin-top:18px;background:rgba(0,0,0,.24);padding:6px;border-radius:22px}
  .peran button{
    flex:1;border:0;background:transparent;color:rgba(255,255,255,.88);font-family:var(--display);
    font-weight:500;font-size:17px;padding:12px 6px;border-radius:16px;cursor:pointer;min-height:48px;
    transition:background .18s ease,color .18s ease;
  }
  .peran button[aria-pressed="true"]{background:var(--aksen);color:var(--lapangan-tua);box-shadow:0 3px 0 rgba(0,0,0,.2)}
  .peran button:focus-visible{outline:3px solid #fff;outline-offset:2px}

  /* =============== judul & teks =============== */
  .eyebrow{
    font-family:var(--display);font-weight:500;font-size:15px;text-transform:none;letter-spacing:0;
    color:var(--lapangan);margin:30px 0 12px;display:flex;align-items:flex-start;gap:9px;
  }
  .eyebrow::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--aksen);flex:none;margin-top:7px}
  h2{font-family:var(--display);font-weight:600;font-size:27px;letter-spacing:-.01em;margin:0 0 6px;text-transform:none;line-height:1.2}
  h3{font-family:var(--display);font-weight:500;font-size:19px;margin:26px 0 10px;letter-spacing:0}
  p{margin:0 0 12px}
  .catatan{color:var(--abu);font-size:15.5px}

  /* =============== pencarian =============== */
  .cari{
    width:100%;padding:15px 17px;border:3px solid var(--garis);border-bottom-width:5px;border-radius:18px;
    font-family:var(--teks);font-size:16.5px;font-weight:600;background:#fff;margin-bottom:6px;min-height:54px;
  }
  .cari::placeholder{color:#8CA3AE;font-weight:500}
  .cari:focus{outline:3px solid var(--biru);outline-offset:2px;border-color:var(--biru)}

  /* =============== nomor punggung kelas =============== */
  .kelas-baris{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .kelas-baris.tiga{grid-template-columns:repeat(3,1fr)}
  .nomor{
    width:100%;height:78px;padding:0;border:3px solid var(--garis);border-bottom-width:6px;background:#fff;
    border-radius:18px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:30px;
    color:var(--lapangan);display:grid;place-items:center;line-height:1;
    transition:transform .12s ease,border-color .12s ease,background .12s ease;
  }
  .nomor small{display:block;font-family:var(--teks);font-size:11.5px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--abu);margin-top:5px}
  .kelas-baris .nomor:nth-child(1){color:var(--lintasan)}
  .kelas-baris .nomor:nth-child(2){color:var(--pink)}
  .kelas-baris .nomor:nth-child(3){color:var(--ungu)}
  .kelas-baris .nomor:nth-child(4){color:var(--biru)}
  .kelas-baris .nomor:nth-child(5){color:#0E9AA7}
  .kelas-baris .nomor:nth-child(6){color:var(--lapangan)}
  .nomor:hover{transform:translateY(-3px)}
  .nomor:active{transform:translateY(3px);border-bottom-width:3px}
  .nomor[aria-pressed="true"]{background:var(--lapangan);color:#fff;border-color:var(--lapangan);border-bottom-color:var(--tepi)}
  .nomor[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
  .nomor:focus-visible{outline:3px solid var(--biru);outline-offset:3px}

  .fase{
    margin-top:16px;padding:15px 17px;background:#fff;border-radius:var(--radius);
    border:3px solid var(--garis);border-left:9px solid var(--aksen);font-size:15.5px;
  }
  .fase b{display:block;font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:0;text-transform:none;color:var(--lapangan);margin-bottom:4px}

  /* =============== papan progres =============== */
  .progres{background:#fff;border:3px solid var(--garis);border-radius:var(--radius);padding:16px 18px;margin-top:16px}
  .progres .baris{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .progres b{font-family:var(--display);font-weight:600;font-size:24px;color:var(--lapangan)}
  .bar{height:18px;background:#E3EEF4;border-radius:99px;overflow:hidden;border:2px solid var(--garis)}
  .bar span{
    display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.34,1.4,.64,1);
    background:repeating-linear-gradient(115deg,var(--aksen) 0 10px,rgba(255,255,255,.5) 10px 18px),var(--aksen);
  }

  /* =============== kartu materi =============== */
  .kartu{
    width:100%;text-align:left;border:3px solid var(--garis);border-bottom-width:6px;background:#fff;
    cursor:pointer;border-radius:var(--radius);padding:14px 15px;margin-bottom:12px;
    display:flex;align-items:center;gap:14px;min-height:76px;
    transition:transform .12s ease,border-color .12s ease;font-family:var(--teks);
  }
  .kartu:hover{transform:translateY(-3px);border-color:var(--lapangan)}
  .kartu:active{transform:translateY(3px);border-bottom-width:3px}
  .kartu:focus-visible{outline:3px solid var(--biru);outline-offset:3px}
  .jalur{
    width:46px;height:46px;flex:none;align-self:center;border-radius:15px;background:var(--lapangan);
    background-image:radial-gradient(circle at 30% 28%,rgba(255,255,255,.55) 0 6px,transparent 6px);
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.16);
  }
  .kartu:nth-of-type(4n+1) .jalur{background-color:var(--biru)}
  .kartu:nth-of-type(4n+2) .jalur{background-color:var(--lintasan)}
  .kartu:nth-of-type(4n+3) .jalur{background-color:var(--ungu)}
  .kartu:nth-of-type(4n+4) .jalur{background-color:var(--lapangan)}
  .kartu-teks{flex:1;min-width:0}
  .kartu .el{font-size:13px;letter-spacing:0;text-transform:none;color:var(--abu);font-weight:700;display:block}
  .kartu .jd{display:block;font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:0;margin-top:1px;line-height:1.25}
  .lencana{
    font-family:var(--display);font-weight:500;font-size:14px;color:#5A4300;background:var(--tenis);
    border-radius:99px;padding:5px 12px;flex:none;box-shadow:0 3px 0 var(--aksen-tepi);
  }
  .lencana::before{content:"★ "}
  .panah{
    font-family:var(--display);font-size:22px;color:#fff;background:var(--lapangan);flex:none;
    width:34px;height:34px;border-radius:12px;display:grid;place-items:center;line-height:1;
  }

  /* =============== tab =============== */
  .tab{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;-webkit-overflow-scrolling:touch}
  .tab button{
    border:3px solid var(--garis);border-bottom-width:5px;background:#fff;color:var(--lapangan-tua);
    padding:10px 16px;border-radius:16px;cursor:pointer;white-space:nowrap;min-height:48px;
    font-family:var(--display);font-weight:500;font-size:16px;
  }
  .tab button:active{transform:translateY(2px);border-bottom-width:3px}
  .tab button[aria-pressed="true"]{background:var(--lapangan);color:#fff;border-color:var(--lapangan);border-bottom-color:var(--tepi)}
  .tab button:focus-visible{outline:3px solid var(--biru);outline-offset:3px}

  .panel{background:#fff;border:3px solid var(--garis);border-radius:var(--radius);padding:18px 18px 22px;animation:masuk .22s cubic-bezier(.34,1.4,.64,1)}
  @keyframes masuk{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
  ul.rapi{margin:0;padding-left:6px;list-style:none}
  ul.rapi li{margin-bottom:10px;padding-left:28px;position:relative}
  ul.rapi li::before{content:"";position:absolute;left:0;top:9px;width:13px;height:13px;border-radius:5px;background:var(--aksen)}
  ol.langkah{list-style:none;counter-reset:l;margin:0;padding:0}
  ol.langkah li{counter-increment:l;position:relative;padding-left:52px;margin-bottom:16px;min-height:38px}
  ol.langkah li::before{
    content:counter(l);position:absolute;left:0;top:-2px;width:38px;height:38px;border-radius:13px;
    background:var(--lapangan);color:#fff;display:grid;place-items:center;
    font-family:var(--display);font-weight:600;font-size:18px;box-shadow:0 4px 0 var(--tepi);
  }
  .main{border:3px dashed var(--rumput);background:#F4FCEF;border-radius:16px;padding:14px 16px;margin-bottom:12px}
  .main b{display:block;font-family:var(--display);font-weight:500;font-size:18px;margin-bottom:4px}

  /* =============== panggung: lapangan sungguhan =============== */
  .panggung{
    background:linear-gradient(180deg,#D6F0FF 0%,var(--langit) 58%,#A8E88A 76%,var(--rumput) 100%);
    border:3px solid var(--garis);border-radius:var(--radius);padding:10px 10px 0;overflow:hidden;position:relative;
  }
  .panggung::before{
    content:"";position:absolute;left:0;right:0;bottom:0;height:26%;
    background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(255,255,255,.4) 34px 38px);
    pointer-events:none;
  }
  .panggung svg{display:block;width:100%;height:auto;max-height:250px;position:relative}
  .keterangan{
    background:#fff;color:var(--lapangan-tua);font-size:15.5px;padding:12px 14px;margin:0 -10px;
    line-height:1.5;border-top:3px solid var(--garis);position:relative;
  }
  .kendali{display:flex;gap:9px;margin:14px 0 4px;flex-wrap:wrap}
  .kendali button,.kendali .unggah{
    border:3px solid var(--garis);border-bottom-width:5px;background:#fff;color:var(--lapangan-tua);
    font-family:var(--display);font-weight:500;font-size:16px;padding:9px 16px;border-radius:15px;
    cursor:pointer;min-height:48px;display:inline-flex;align-items:center;gap:7px;
  }
  .kendali button:active,.kendali .unggah:active{transform:translateY(2px);border-bottom-width:3px}
  .kendali button[aria-pressed="true"]{background:var(--lapangan);color:#fff;border-color:var(--lapangan);border-bottom-color:var(--tepi)}
  .kendali button:focus-visible{outline:3px solid var(--biru);outline-offset:3px}
  .kendali .unggah{border-color:var(--lapangan);color:var(--lapangan)}
  .kendali .unggah input{display:none}
  .kendali a.unggah{text-decoration:none}
  .kendali .unggah:focus-within{outline:3px solid var(--biru);outline-offset:3px}
  .panggung img.foto{display:block;width:100%;height:auto;max-height:280px;object-fit:contain;border-radius:14px;background:rgba(255,255,255,.7);position:relative}
  .mini{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
  .mini button{border:3px solid var(--garis);background:#fff;border-radius:14px;padding:0;overflow:hidden;width:70px;height:58px;cursor:pointer}
  .mini button[aria-pressed="true"]{border-color:var(--lapangan)}
  .mini img{width:100%;height:100%;object-fit:cover;display:block}
  .mini:focus-visible{outline:3px solid var(--biru)}

  .baris-soal{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .sapa{
    display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;
    border:3px solid var(--garis);border-radius:var(--radius);padding:13px 16px;margin-top:18px;font-size:16px;
  }
  .sapa button{
    border:3px solid var(--garis);border-bottom-width:5px;background:#fff;color:var(--lapangan);
    font-family:var(--display);font-weight:500;font-size:15px;padding:8px 14px;border-radius:14px;cursor:pointer;flex:none;min-height:44px;
  }
  .sapa button:active{transform:translateY(2px);border-bottom-width:3px}
  .daftar-akun{margin-bottom:8px}
  .daftar-akun .kartu{margin-bottom:10px}
  .kunci input#namabaru,.kunci input#tautansiswa{letter-spacing:normal;text-align:left;font-size:16.5px}
  .isian input[readonly]{background:#F1F7FB;font-size:15px}

  .bingkai{position:relative;width:100%;padding-top:56.25%;margin-top:12px;border-radius:16px;overflow:hidden;background:#000;border:3px solid var(--garis)}
  .bingkai iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  video.video{width:100%;max-height:300px;border-radius:16px;background:#000;margin-top:12px;display:block;border:3px solid var(--garis)}

  /* =============== layar masuk =============== */
  .kunci{max-width:380px;margin:28px auto 0;background:#fff;border:3px solid var(--garis);border-radius:26px;padding:24px}
  .kunci h2{margin-bottom:10px}
  .kunci input{
    width:100%;padding:15px 16px;border:3px solid var(--garis);border-bottom-width:5px;border-radius:16px;
    font-family:var(--display);font-weight:500;font-size:23px;letter-spacing:.28em;text-align:center;margin-bottom:12px;background:#fff;min-height:56px;
  }
  .kunci input:focus{outline:3px solid var(--biru);outline-offset:2px;border-color:var(--biru)}
  .kunci .tombol{width:100%}
  .kunci .pesan{color:#C43A0C;font-size:15px;font-weight:700;min-height:22px;margin:10px 0 0}

  /* =============== sosok pemain =============== */
  .figur line,.figur circle,.gulung line,.gulung circle{stroke:var(--pemain);stroke-width:8;stroke-linecap:round;fill:none}
  .figur .kepala,.gulung .kepala{fill:var(--lintasan);stroke:var(--lintasan)}
  .bola{fill:#FF3B30;stroke:#fff;stroke-width:2}
  .alat{stroke:#7A4B1E;stroke-width:8;stroke-linecap:round}
  .tanah{stroke:rgba(255,255,255,.85);stroke-width:4;stroke-dasharray:12 9}
  .gelembung{fill:rgba(255,255,255,.85);stroke:var(--biru);stroke-width:2}
  .lgn{transform-box:view-box;transform-origin:100px 78px}
  .kk{transform-box:view-box;transform-origin:100px 115px}
  .figur,.gulung,.bola,.alat,.gelembung{transform-box:view-box}
  .figur{transform-origin:100px 160px}
  .gulung{transform-origin:100px 130px}

  @keyframes ayunA{from{transform:rotate(32deg)}to{transform:rotate(-32deg)}}
  @keyframes ayunB{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
  @keyframes ayunKecilA{from{transform:rotate(15deg)}to{transform:rotate(-15deg)}}
  @keyframes ayunKecilB{from{transform:rotate(-15deg)}to{transform:rotate(15deg)}}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
  @keyframes putarPenuh{to{transform:rotate(360deg)}}
  @keyframes lompatFigur{0%,100%{transform:translateY(0)}18%{transform:translateY(10px)}45%{transform:translateY(-52px)}72%{transform:translateY(6px)}}
  @keyframes lenganAngkat{0%,100%{transform:rotate(20deg)}45%{transform:rotate(-115deg)}}
  @keyframes goyang{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes geserSamping{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
  @keyframes lenganNaik{0%,100%{transform:rotate(35deg)}50%{transform:rotate(-70deg)}}
  @keyframes tendangKaki{0%,55%,100%{transform:rotate(0)}30%{transform:rotate(-60deg)}}
  @keyframes bolaTendang{0%,30%{transform:translate(0,0);opacity:1}75%{transform:translate(105px,-34px);opacity:1}90%,100%{transform:translate(120px,-10px);opacity:0}}
  @keyframes lemparLengan{0%{transform:rotate(150deg)}35%{transform:rotate(140deg)}60%{transform:rotate(-35deg)}100%{transform:rotate(150deg)}}
  @keyframes bolaLempar{0%,45%{transform:translate(0,0);opacity:1}80%{transform:translate(96px,-46px);opacity:1}95%,100%{transform:translate(120px,4px);opacity:0}}
  @keyframes squat{0%,100%{transform:translateY(0)}50%{transform:translateY(20px)}}
  @keyframes gulingMaju{0%{transform:translateX(-62px) rotate(0)}100%{transform:translateX(62px) rotate(360deg)}}
  @keyframes gulingMundur{0%{transform:translateX(62px) rotate(0)}100%{transform:translateX(-62px) rotate(-360deg)}}
  @keyframes bolaPantul{0%,100%{transform:translateY(0)}50%{transform:translateY(-58px)}}
  @keyframes bolaDribel{0%,100%{transform:translateY(-52px)}50%{transform:translateY(0)}}
  @keyframes pompaLengan{0%,100%{transform:rotate(28deg)}50%{transform:rotate(58deg)}}
  @keyframes ayunPemukul{0%,60%,100%{transform:rotate(-55deg)}80%{transform:rotate(70deg)}}
  @keyframes bolaPukul{0%,78%{transform:translate(0,0);opacity:1}96%,100%{transform:translate(-120px,-40px);opacity:0}}
  @keyframes gosokKi{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(8deg)}}
  @keyframes gosokKa{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-8deg)}}
  @keyframes naikHilang{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-52px);opacity:0}}
  @keyframes larikanan{from{transform:translateX(-70px)}to{transform:translateX(20px)}}
  @keyframes tongkatPindah{0%,40%{transform:translate(-52px,0)}70%,100%{transform:translate(34px,0)}}

  @keyframes napas{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes hormatLengan{0%,20%{transform:rotate(0)}45%,80%{transform:rotate(-150deg)}100%{transform:rotate(0)}}
  @keyframes putarBadan{0%,15%{transform:rotate(0)}45%,70%{transform:rotate(90deg)}100%{transform:rotate(0)}}
  @keyframes balikBadan{0%,15%{transform:rotate(0)}50%,80%{transform:rotate(180deg)}100%{transform:rotate(0)}}
  @keyframes lencangLengan{0%,20%{transform:rotate(0)}50%,85%{transform:rotate(-88deg)}100%{transform:rotate(0)}}
  @keyframes lututNaik{0%,100%{transform:rotate(0)}50%{transform:rotate(-52deg)}}

  svg.gerak{--spd:1}
  svg.gerak.lambat{--spd:2.1}
  svg.gerak.jeda *{animation-play-state:paused!important}

  .a-sempurna .figur{animation:napas calc(var(--spd)*2.6s) infinite ease-in-out}
  .a-hormat .lgn-ka{animation:hormatLengan calc(var(--spd)*3s) infinite ease-in-out}
  .a-hadap .figur{animation:putarBadan calc(var(--spd)*3.4s) infinite ease-in-out;transform-origin:100px 130px}
  .a-balik .figur{animation:balikBadan calc(var(--spd)*3.6s) infinite ease-in-out;transform-origin:100px 130px}
  .a-lencang .lgn-ka{animation:lencangLengan calc(var(--spd)*3s) infinite ease-in-out}
  .a-jalantempat .kk-ki{animation:lututNaik calc(var(--spd)*.7s) infinite ease-in-out}
  .a-jalantempat .kk-ka{animation:lututNaik calc(var(--spd)*.7s) infinite ease-in-out reverse}
  .a-jalantempat .lgn-ka{animation:ayunA calc(var(--spd)*.7s) infinite alternate ease-in-out}
  .a-jalantempat .lgn-ki{animation:ayunB calc(var(--spd)*.7s) infinite alternate ease-in-out}

  .a-lari .lgn-ka,.a-lari .kk-ki{animation:ayunA calc(var(--spd)*.42s) infinite alternate ease-in-out}
  .a-lari .lgn-ki,.a-lari .kk-ka{animation:ayunB calc(var(--spd)*.42s) infinite alternate ease-in-out}
  .a-lari .figur{animation:bob calc(var(--spd)*.21s) infinite alternate ease-in-out}
  .a-jalan .lgn-ka,.a-jalan .kk-ki{animation:ayunKecilA calc(var(--spd)*.8s) infinite alternate ease-in-out}
  .a-jalan .lgn-ki,.a-jalan .kk-ka{animation:ayunKecilB calc(var(--spd)*.8s) infinite alternate ease-in-out}
  .a-putar .lgn-ki,.a-putar .lgn-ka{animation:putarPenuh calc(var(--spd)*1.7s) linear infinite}
  .a-lompat .figur{animation:lompatFigur calc(var(--spd)*1.9s) infinite ease-in-out}
  .a-lompat .lgn-ki,.a-lompat .lgn-ka{animation:lenganAngkat calc(var(--spd)*1.9s) infinite ease-in-out}
  .a-imbang .kk-ka{transform:rotate(38deg)}
  .a-imbang .lgn-ki{transform:rotate(-72deg)}
  .a-imbang .lgn-ka{transform:rotate(72deg)}
  .a-imbang .figur{animation:goyang calc(var(--spd)*2.4s) infinite ease-in-out}
  .a-ritmik .figur{animation:geserSamping calc(var(--spd)*1.1s) infinite alternate ease-in-out}
  .a-ritmik .lgn-ki{animation:lenganNaik calc(var(--spd)*1.1s) infinite ease-in-out}
  .a-ritmik .lgn-ka{animation:lenganNaik calc(var(--spd)*1.1s) infinite ease-in-out reverse}
  .a-tendang .kk-ka{animation:tendangKaki calc(var(--spd)*1.7s) infinite ease-in-out}
  .a-tendang .bola{animation:bolaTendang calc(var(--spd)*1.7s) infinite ease-out}
  .a-tendang .lgn-ki{transform:rotate(-24deg)}
  .a-lempar .lgn-ka{animation:lemparLengan calc(var(--spd)*1.9s) infinite ease-in-out}
  .a-lempar .bola{animation:bolaLempar calc(var(--spd)*1.9s) infinite ease-out}
  .a-kuat .figur{animation:squat calc(var(--spd)*1.6s) infinite ease-in-out}
  .a-kuat .lgn-ki{transform:rotate(-84deg)}
  .a-kuat .lgn-ka{transform:rotate(84deg)}
  .a-guling .gulung{animation:gulingMaju calc(var(--spd)*2.2s) infinite linear}
  .a-guling-mundur .gulung{animation:gulingMundur calc(var(--spd)*2.2s) infinite linear}
  .a-passing .figur{animation:squat calc(var(--spd)*1.5s) infinite ease-in-out}
  .a-passing .lgn-ki{transform:rotate(-44deg)}
  .a-passing .lgn-ka{transform:rotate(44deg)}
  .a-passing .bola{animation:bolaPantul calc(var(--spd)*1.5s) infinite ease-in-out}
  .a-dribel .bola{animation:bolaDribel calc(var(--spd)*.72s) infinite ease-in-out}
  .a-dribel .lgn-ka{animation:pompaLengan calc(var(--spd)*.72s) infinite ease-in-out}
  .a-pukul .alat-pukul{animation:ayunPemukul calc(var(--spd)*2s) infinite ease-in-out}
  .a-pukul .bola{animation:bolaPukul calc(var(--spd)*2s) infinite ease-out}
  .a-pukul .lgn-ki,.a-pukul .lgn-ka{transform:rotate(-40deg)}
  .a-sehat .lgn-ki{animation:gosokKi calc(var(--spd)*.6s) infinite ease-in-out;transform-origin:100px 78px}
  .a-sehat .lgn-ka{animation:gosokKa calc(var(--spd)*.6s) infinite ease-in-out;transform-origin:100px 78px}
  .a-sehat .gelembung{animation:naikHilang calc(var(--spd)*2s) infinite ease-out}
  .a-sehat .g2{animation-delay:.6s}
  .a-sehat .g3{animation-delay:1.2s}
  .a-estafet .lgn-ka,.a-estafet .kk-ki{animation:ayunA calc(var(--spd)*.42s) infinite alternate ease-in-out}
  .a-estafet .lgn-ki,.a-estafet .kk-ka{animation:ayunB calc(var(--spd)*.42s) infinite alternate ease-in-out}
  .a-estafet .tongkat{animation:tongkatPindah calc(var(--spd)*2.6s) infinite ease-in-out}

  /* =============== kuis =============== */
  .soal{margin-bottom:28px;counter-reset:pil}
  .soal .no{
    display:inline-block;font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:0;
    text-transform:none;color:var(--lapangan);background:#DFF3EA;border-radius:99px;padding:4px 12px;
  }
  .soal .tanya{font-family:var(--display);font-weight:500;font-size:20px;line-height:1.35;margin:10px 0 14px}
  .pilihan{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:10px;
    border:3px solid var(--garis);border-bottom-width:6px;background:#fff;border-radius:18px;
    padding:13px 15px;cursor:pointer;font-family:var(--teks);font-weight:600;font-size:17px;
    color:var(--lapangan-tua);min-height:60px;counter-increment:pil;
  }
  .pilihan::before{
    content:counter(pil,upper-alpha);flex:none;width:34px;height:34px;border-radius:11px;
    background:#EDF4F8;color:var(--abu);display:grid;place-items:center;
    font-family:var(--display);font-weight:600;font-size:17px;
  }
  .pilihan:hover:not(:disabled){border-color:var(--lapangan)}
  .pilihan:active:not(:disabled){transform:translateY(3px);border-bottom-width:3px}
  .pilihan:disabled{cursor:default}
  .pilihan.benar{background:#E4F8E6;border-color:#2E9E4F;border-bottom-color:#1F7738}
  .pilihan.benar::before{content:"✓";background:#2E9E4F;color:#fff}
  .pilihan.dipilih{background:var(--lapangan);color:#fff;border-color:var(--lapangan);border-bottom-color:var(--tepi)}
  .pilihan.dipilih::before{background:rgba(255,255,255,.25);color:#fff}
  .pilihan.salah{background:#FFEDE6;border-color:var(--lintasan);border-bottom-color:#C4441A}
  .pilihan.salah::before{content:"✕";background:var(--lintasan);color:#fff}
  .pilihan:focus-visible{outline:3px solid var(--biru);outline-offset:3px}
  .bahas{font-size:15.5px;background:#F1F7FB;border-radius:16px;border:3px solid var(--garis);padding:12px 14px;margin-top:4px}
  .skor{
    background:var(--lapangan);color:#fff;border-radius:var(--radius);padding:22px;text-align:center;
    margin-top:8px;border-bottom:7px solid var(--tepi);
  }
  .skor .angka{font-family:var(--display);font-weight:600;font-size:52px;line-height:1}
  .skor p{margin:6px 0 0;color:rgba(255,255,255,.9);font-size:15.5px}

  /* =============== isian & tombol =============== */
  .isian{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .isian input,.isian select{
    flex:1;min-width:150px;padding:13px 15px;border:3px solid var(--garis);border-bottom-width:5px;
    border-radius:16px;font-family:var(--teks);font-weight:600;font-size:16px;background:#fff;min-height:52px;
  }
  .isian input:focus,.isian select:focus{outline:3px solid var(--biru);outline-offset:2px;border-color:var(--biru)}
  textarea{
    width:100%;min-height:110px;padding:13px 15px;border:3px solid var(--garis);border-bottom-width:5px;
    border-radius:16px;font-family:var(--teks);font-size:16px;background:#fff;resize:vertical;line-height:1.55;
  }
  textarea:focus{outline:3px solid var(--biru);outline-offset:2px;border-color:var(--biru)}
  .tombol{
    border:0;background:var(--lapangan);color:#fff;font-family:var(--display);font-weight:500;font-size:17px;
    padding:13px 22px;border-radius:16px;cursor:pointer;min-height:52px;box-shadow:0 5px 0 var(--tepi);
  }
  .tombol:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tepi)}
  .tombol.garis{background:#fff;color:var(--lapangan);border:3px solid var(--lapangan);box-shadow:0 5px 0 rgba(11,122,86,.28)}
  .tombol:focus-visible{outline:3px solid var(--biru);outline-offset:3px}
  .tombol:disabled{box-shadow:0 5px 0 rgba(10,46,39,.18)}
  .tombol:disabled:active{transform:none}

  .gulir{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px}
  table{border-collapse:collapse;width:100%;font-size:15.5px;min-width:430px}
  th,td{padding:12px 9px;border-bottom:2px solid var(--garis);text-align:left}
  th{font-family:var(--display);font-weight:500;font-size:14px;letter-spacing:0;text-transform:none;color:var(--abu);vertical-align:bottom}
  td select{padding:9px;border:3px solid var(--garis);border-radius:12px;font-family:var(--teks);font-size:15px;background:#fff}
  td.nilai{font-family:var(--display);font-weight:600;font-size:20px;color:var(--lapangan)}
  .hapus{border:0;background:none;color:var(--lintasan);cursor:pointer;font-size:22px;padding:6px 10px;min-height:44px}
  .kosong{text-align:center;color:var(--abu);padding:26px 12px;font-size:15.5px}

  /* =============== alat bantu guru =============== */
  .jam{
    background:var(--lapangan);color:#fff;border-radius:var(--radius);padding:22px;text-align:center;
    margin-bottom:14px;border-bottom:7px solid var(--tepi);
  }
  .jam .angka{font-family:var(--display);font-weight:600;font-size:clamp(48px,15vw,74px);line-height:1;font-variant-numeric:tabular-nums}
  .jam.habis{background:var(--lintasan);border-bottom-color:#C4441A}
  .regu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .regu .sisi{background:#F1F7FB;border:3px solid var(--garis);border-radius:18px;padding:15px;text-align:center}
  .regu .sisi:first-child{border-color:var(--biru)}
  .regu .sisi:last-child{border-color:var(--lintasan)}
  .regu .sisi .nm{font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:0;text-transform:none;color:var(--abu)}
  .regu .sisi .poin{font-family:var(--display);font-weight:600;font-size:52px;line-height:1.1;font-variant-numeric:tabular-nums}
  .regu .sisi button{
    border:3px solid var(--garis);border-bottom-width:5px;background:#fff;border-radius:14px;
    width:48px;height:46px;font-size:22px;cursor:pointer;margin:0 4px;font-family:var(--display);font-weight:500;
  }
  .regu .sisi button:active{transform:translateY(2px);border-bottom-width:3px}
  .grup{display:flex;flex-wrap:wrap;gap:11px;margin-top:12px}
  .grup .kel{background:#F4FCEF;border:3px solid var(--rumput);border-radius:18px;padding:13px 15px;flex:1 1 160px}
  .grup .kel b{display:block;font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:0;text-transform:none;color:var(--lapangan);margin-bottom:5px}
  .grup .kel span{display:block;font-size:16px}

  .balik{
    display:inline-flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--garis);
    border-bottom-width:5px;color:var(--lapangan);font-family:var(--display);font-weight:500;font-size:16px;
    cursor:pointer;padding:10px 18px;border-radius:16px;margin:18px 0 10px;min-height:48px;
  }
  .balik:active{transform:translateY(2px);border-bottom-width:3px}
  .balik:focus-visible{outline:3px solid var(--biru);outline-offset:3px}
  footer{border-top:3px solid var(--garis);margin-top:38px;padding-top:18px;font-size:14px;color:var(--abu)}


  /* =============== arena bermain siswa =============== */
  .g-kepala{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
  .g-bunyi{
    border:3px solid var(--garis);border-bottom-width:5px;background:#fff;border-radius:14px;
    width:52px;height:50px;font-size:22px;cursor:pointer;flex:none;line-height:1;
  }
  .g-bunyi:active{transform:translateY(2px);border-bottom-width:3px}
  .g-bunyi:focus-visible{outline:3px solid var(--biru);outline-offset:3px}

  .g-pilih{display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
  .g-kartu{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
    background:#fff;border:3px solid var(--garis);border-bottom-width:6px;border-radius:var(--radius);
    padding:14px 15px;font-family:var(--teks);color:var(--lapangan-tua);
    transition:transform .12s ease,border-color .12s ease;
  }
  .g-kartu:hover{transform:translateY(-3px);border-color:var(--lapangan)}
  .g-kartu:active{transform:translateY(3px);border-bottom-width:3px}
  .g-kartu:focus-visible{outline:3px solid var(--biru);outline-offset:3px}
  .g-ikon{
    width:54px;height:54px;flex:none;border-radius:17px;background:var(--aksen);
    display:grid;place-items:center;font-size:27px;line-height:1;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14);
  }
  .g-teks{flex:1;min-width:0}
  .g-nama{display:block;font-family:var(--display);font-weight:500;font-size:19px;line-height:1.25}
  .g-ket{display:block;font-size:14.5px;color:var(--abu);line-height:1.4;margin-top:2px}
  .g-rekor{display:block;font-family:var(--display);font-weight:500;font-size:14px;color:var(--lapangan);margin-top:5px}

  .g-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .g-keluar{
    border:3px solid var(--garis);border-bottom-width:5px;background:#fff;color:var(--lapangan);
    font-family:var(--display);font-weight:500;font-size:15px;padding:8px 14px;border-radius:14px;
    cursor:pointer;min-height:44px;flex:none;
  }
  .g-keluar:active{transform:translateY(2px);border-bottom-width:3px}
  .g-keluar:focus-visible{outline:3px solid var(--biru);outline-offset:3px}
  .g-judul{font-family:var(--display);font-weight:500;font-size:17px;flex:1;min-width:100px;line-height:1.25}
  .g-status{font-family:var(--display);font-weight:500;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .g-poinkecil{color:var(--lapangan)}
  .g-streak{background:var(--lintasan);color:#fff;border-radius:99px;padding:3px 10px;font-size:15px}

  .g-progres{height:14px;background:#E3EEF4;border:2px solid var(--garis);border-radius:99px;overflow:hidden;margin:12px 0 16px}
  .g-progres span{display:block;height:100%;background:var(--aksen);border-radius:99px;transition:width .35s cubic-bezier(.34,1.4,.64,1)}

  .g-slot{list-style:none;counter-reset:s;margin:0 0 18px;padding:0}
  .g-slot li{
    counter-increment:s;position:relative;padding:13px 15px 13px 54px;margin-bottom:9px;min-height:56px;
    background:#E4F8E6;border:3px solid #2E9E4F;border-radius:16px;font-weight:600;font-size:16px;
    animation:gmasuk .25s cubic-bezier(.34,1.5,.64,1);
  }
  .g-slot li::before{
    content:counter(s);position:absolute;left:11px;top:11px;width:32px;height:32px;border-radius:11px;
    background:#2E9E4F;color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:16px;
  }
  .g-slot li.g-kosong{
    background:#fff;border:3px dashed var(--garis);color:var(--abu);font-weight:600;animation:none;
  }
  .g-slot li.g-kosong::before{background:var(--garis);color:var(--abu)}
  @keyframes gmasuk{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}

  .g-acak{display:flex;flex-direction:column;gap:10px}
  .g-acak button{
    width:100%;text-align:left;background:#fff;border:3px solid var(--garis);border-bottom-width:6px;
    border-radius:16px;padding:14px 16px;min-height:60px;cursor:pointer;
    font-family:var(--teks);font-weight:600;font-size:16.5px;color:var(--lapangan-tua);line-height:1.4;
  }
  .g-acak button:hover{border-color:var(--lapangan)}
  .g-acak button:active{transform:translateY(3px);border-bottom-width:3px}
  .g-acak button:focus-visible{outline:3px solid var(--biru);outline-offset:3px}
  .g-acak button.goyah{
    border-color:var(--lintasan);background:#FFEDE6;animation:goyah .42s ease;
  }
  @keyframes goyah{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

  .g-atas{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  .g-nomor{font-family:var(--display);font-weight:500;font-size:15px;color:var(--lapangan);background:#DFF3EA;border-radius:99px;padding:6px 14px}
  .g-cincin{
    width:62px;height:62px;flex:none;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--lapangan) var(--p,100%),#E3EEF4 0);
  }
  .g-cincin b{
    width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;
    font-family:var(--display);font-weight:600;font-size:22px;color:var(--lapangan);font-variant-numeric:tabular-nums;
  }
  .g-cincin.g-panas{background:conic-gradient(var(--lintasan) var(--p,100%),#FFE3D6 0);animation:denyut .6s ease-in-out infinite alternate}
  .g-cincin.g-panas b{color:var(--lintasan)}
  @keyframes denyut{from{transform:scale(1)}to{transform:scale(1.07)}}

  .g-tanya{font-family:var(--display);font-weight:500;font-size:21px;line-height:1.35;margin:4px 0 14px}
  .g-opsi{display:flex;flex-direction:column}
  .g-opsi .pilihan{counter-increment:none}
  .g-opsi .pilihan::before{content:"●";font-size:14px}
  .g-opsi .pilihan.benar::before{content:"✓"}
  .g-opsi .pilihan.salah::before{content:"✕"}
  .g-panggung{margin-bottom:14px}
  .g-panggung svg{max-height:210px}

  .g-aksi{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 14px}
  .g-aksi .tombol{flex:1 1 160px}

  .g-hasil{
    background:var(--lapangan);color:#fff;border-radius:var(--radius);padding:26px 20px;text-align:center;
    border-bottom:7px solid var(--tepi);animation:gmuncul .35s cubic-bezier(.34,1.5,.64,1);
  }
  .g-hasil.g-kalah{background:var(--abu);border-bottom-color:#3E4F49}
  .g-hasil p{color:rgba(255,255,255,.92);margin:6px 0 0;font-size:15.5px}
  .g-hasil .catatan{color:rgba(255,255,255,.72)}
  .g-bintang{font-size:44px;line-height:1.2;letter-spacing:.08em}
  .g-poin{font-family:var(--display);font-weight:600;font-size:58px;line-height:1;font-variant-numeric:tabular-nums}
  .g-besar{font-family:var(--display);font-weight:500;font-size:21px;margin-top:6px!important;line-height:1.3}
  .g-rekorbaru{
    display:inline-block;background:var(--tenis);color:#5A4300;font-family:var(--display);font-weight:500;
    border-radius:99px;padding:7px 16px;margin-top:14px!important;font-size:16px;
  }
  @keyframes gmuncul{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    .g-slot li,.g-hasil,.g-acak button.goyah,.g-cincin.g-panas{animation:none!important}
    .g-kartu:hover{transform:none}
  }

  /* =============== warna khas tiap kelas =============== */
  body[data-kelas="1"]{--aksen:#FF6B2C;--aksen-tepi:#C4441A}
  body[data-kelas="2"]{--aksen:#FF5D8F;--aksen-tepi:#C63566}
  body[data-kelas="3"]{--aksen:#8B5CF6;--aksen-tepi:#6538D4}
  body[data-kelas="4"]{--aksen:#2F7BFF;--aksen-tepi:#1B54C4}
  body[data-kelas="5"]{--aksen:#0E9AA7;--aksen-tepi:#0A737D}
  body[data-kelas="6"]{--aksen:#FFD84D;--aksen-tepi:#C9A200}
  body.mode-guru{--aksen:var(--lintasan);--aksen-tepi:#C4441A}

  /* =============== judul yang bisa diganti =============== */
  .judul-baris{display:flex;align-items:flex-start;gap:10px}
  .judul-baris h2{flex:1;min-width:0}
  .pensil{
    border:3px solid var(--garis);border-bottom-width:5px;background:#fff;color:var(--lapangan);
    border-radius:14px;width:48px;height:46px;font-size:19px;cursor:pointer;flex:none;line-height:1;
  }
  .pensil:active{transform:translateY(2px);border-bottom-width:3px}
  .pensil:focus-visible{outline:3px solid var(--biru);outline-offset:3px}
  .ubah-nama{margin:0 0 6px}

  /* =============== peta pertemuan =============== */
  .temu-baris{display:flex;flex-direction:column;gap:12px}
  .temu{

  /* =============== piktogram =============== */
  .pk{width:100%;height:auto;display:block}
  .pk-badan,.pk-alat,.pk-tanah,.pk-air,.pk-garis-putih{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .pk-badan{stroke:var(--pemain);stroke-width:7}
  .pk-kepala{fill:var(--lintasan)}
  .pk-alat{stroke:#7A4B1E;stroke-width:7}
  .pk-tanah{stroke:#9BB3A8;stroke-width:5;stroke-dasharray:9 8}
  .pk-air{stroke:#3FA9F5;stroke-width:6}
  .pk-bola{fill:#FF3B30}
  .pk-oranye{fill:var(--lintasan)}
  .pk-hijau{fill:#3FAE4A}
  .pk-merah{fill:#E23B2E}
  .pk-busa{fill:#BFE6FF;stroke:#3FA9F5;stroke-width:3}
  .pk-busa2{fill:#BFE6FF}
  .pk-kotor{fill:#8A6B3B}
  .pk-jaring{fill:none;stroke:#7A4B1E;stroke-width:3;stroke-dasharray:6 5}
  .pk-garis-putih{stroke:#fff;stroke-width:4}
  .pk-larang{fill:none;stroke:#E23B2E;stroke-width:7}
  .pk-larang-garis{stroke:#E23B2E;stroke-width:7;stroke-linecap:round}
  .pk-teks{fill:var(--pemain);font-family:var(--display);font-size:20px;font-weight:600}

    font-family:var(--teks);color:var(--lapangan-tua);transition:transform .12s ease,border-color .12s ease;

  .a-kartu:focus-visible{outline:3px solid var(--biru);outline-offset:3px}

  .a-kartu.a-salah{background:#FFEDE6;border-color:var(--lintasan);border-bottom-color:#C4441A}

  .a-titik{display:inline-flex;gap:5px;align-items:center}
  .a-titik i{width:11px;height:11px;border-radius:50%;background:#DCE8EF;display:block}
  .a-titik i.isi{background:#2E9E4F}
  .a-titik i.lewat{background:var(--lintasan)}
  .a-titik i.kini{background:var(--lapangan);transform:scale(1.35)}

  .a-lampu{
    display:flex;flex-direction:column;align-items:center;gap:12px;background:#2B3A40;
    border-radius:26px;padding:18px;width:106px;margin:0 auto 6px;border-bottom:7px solid #16232A;
  }
  .a-bola-lampu{width:58px;height:58px;border-radius:50%;background:#46585F;display:block}
  .a-bola-lampu.a-merah.nyala{background:#FF3B30;box-shadow:0 0 0 8px rgba(255,59,48,.28)}
  .a-bola-lampu.a-kuning.nyala{background:#FFD23F;box-shadow:0 0 0 8px rgba(255,210,63,.3)}
  .a-bola-lampu.a-hijau.nyala{background:#2ED573;box-shadow:0 0 0 8px rgba(46,213,115,.28)}

  .a-papan{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:14px}
  .a-balik{
    aspect-ratio:1;background:var(--lapangan);border:3px solid var(--tepi);border-bottom-width:6px;
    border-radius:18px;cursor:pointer;display:grid;place-items:center;padding:8px;
    transition:transform .14s ease,background .14s ease;
  }
  .a-balik .pk{width:100%;max-width:80px}
  .a-balik.terbuka{background:#fff;border-color:var(--garis);border-bottom-color:var(--garis)}
  .a-balik.cocok{background:#E4F8E6;border-color:#2E9E4F;border-bottom-color:#1F7738}
  .a-balik:active{transform:translateY(3px)}
  .a-balik:focus-visible{outline:3px solid var(--biru);outline-offset:3px}
  .a-punggung{font-family:var(--display);font-weight:600;font-size:34px;color:rgba(255,255,255,.55)}

  .a-pilih.empat{grid-template-columns:repeat(2,1fr)}
  .a-siluet-kotak{
    background:#EAF2F6;border:3px solid var(--garis);border-radius:var(--radius);
    padding:14px;display:grid;place-items:center;
  }
  .a-siluet-kotak .pk{max-width:190px}
  .siluet .pk-badan,.siluet .pk-alat,.siluet .pk-tanah,.siluet .pk-air,
  .siluet .pk-garis-putih,.siluet .pk-jaring,.siluet .pk-larang,.siluet .pk-larang-garis{stroke:#33454D}
  .siluet .pk-kepala,.siluet .pk-bola,.siluet .pk-oranye,.siluet .pk-hijau,
  .siluet .pk-merah,.siluet .pk-busa,.siluet .pk-busa2,.siluet .pk-kotor,.siluet .pk-teks{fill:#33454D;stroke:none}
  .a-bola-lampu.a-biru.nyala{background:#2F7BFF;box-shadow:0 0 0 8px rgba(47,123,255,.28)}
  .g-kartu.g-terpilih{border-color:var(--lapangan);background:#F2FBF7}
  .g-centang{
    width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;
    font-family:var(--display);font-weight:600;font-size:19px;background:#EDF4F8;color:var(--abu);
  }
  .g-terpilih .g-centang{background:var(--lapangan);color:#fff}

  @media (max-width:380px){
    .a-kartu .pk{max-width:84px}
    .a-label{font-size:11.5px}
  }
  @media (prefers-reduced-motion:reduce){
    .temu:hover,.a-kartu:hover{transform:none}
    .a-balik,.a-kartu{transition:none}
  }

  @media (max-width:400px){
    .nomor{height:70px;font-size:25px}
    .nomor small{font-size:10px}
    .kelas-baris{gap:6px}
    .bungkus{padding:0 14px 110px}
  }
  @media (prefers-reduced-motion:reduce){
    .panel,.kartu,.nomor,.bar span{animation:none!important;transition:none!important}
    .kartu:hover,.nomor:hover{transform:none}
  }

  /* =====================================================================
     TEMA PETUALANGAN — khas Move Adventure
     Nuansa peta perjalanan: latar kertas pasir, biru nila tua, aksen amber.
     ===================================================================== */
  :root{
    --lapangan:#243B6B;   --lapangan-tua:#1B2B45;  --tepi:#16254A;
    --kapur:#FFF6EA;      --tenis:#F5A524;         --aksen-tepi:#C77F0B;
    --lintasan:#E4572E;   --abu:#6E6355;           --garis:#E7D9C2;
    --langit:#D7ECFF;     --rumput:#9FD6A0;        --biru:#1B87C9;
    --ungu:#7A5AF8;       --pemain:#1B2B45;
    --display:"Baloo 2","Fredoka","Trebuchet MS",system-ui,sans-serif;
    --teks:"Quicksand","Nunito","Segoe UI",system-ui,sans-serif;
    --radius:18px;
    --bayang:0 4px 14px rgba(36,59,107,.10);
  }
  body.mode-guru{--aksen:var(--lintasan);--aksen-tepi:#B23C18}
  body[data-kelas="1"]{--aksen:var(--tenis);--aksen-tepi:#C77F0B}

  body{
    background:var(--kapur);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(36,59,107,.10) 1px, transparent 0),
      radial-gradient(circle 420px at 100% -80px, rgba(245,165,36,.16), transparent 70%);
    background-size:22px 22px, auto;
    background-attachment:scroll, fixed;
    font-weight:500;
  }

  /* ---------- kepala: papan peta ---------- */
  header.lapangan{
    background:var(--lapangan);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.10) 1px, transparent 0),
      linear-gradient(180deg, rgba(255,255,255,.06), transparent 60%);
    background-size:16px 16px, auto;
    border-bottom:0;
    border-radius:0 0 30px 30px;
    box-shadow:0 6px 0 var(--tenis);
    margin-bottom:6px;
  }
  .peluit{
    border-radius:50%;
    background:var(--tenis);
    box-shadow:0 0 0 4px rgba(255,255,255,.18);
  }
  .peluit.berlogo{background:#fff}
  .logo h1{letter-spacing:.01em}
  .peran{background:rgba(0,0,0,.28);border-radius:999px;padding:5px}
  .peran button{border-radius:999px}

  /* ---------- kartu: pos perjalanan ---------- */
  .kartu, .temu, .g-kartu{
    border:2px solid var(--garis);
    border-bottom-width:2px;
    border-radius:var(--radius);
    box-shadow:var(--bayang);
    position:relative;
  }
  .kartu:active, .temu:active, .g-kartu:active{transform:translateY(2px);border-bottom-width:2px}
  .kartu:hover{border-color:var(--tenis)}
  /* penanda pos dengan garis putus-putus penghubung */
  .kartu .jalur{
    width:42px;height:42px;border-radius:50%;
    background:var(--lapangan);
    background-image:none;
    box-shadow:0 0 0 4px rgba(245,165,36,.35);
  }
  .kartu:nth-of-type(4n+1) .jalur{background-color:var(--lapangan)}
  .kartu:nth-of-type(4n+2) .jalur{background-color:#2E6E8E}
  .kartu:nth-of-type(4n+3) .jalur{background-color:#8A5A2B}
  .kartu:nth-of-type(4n+4) .jalur{background-color:#4B6A3A}
  .kartu::after{
    content:"";position:absolute;left:34px;bottom:-13px;width:0;height:13px;
    border-left:3px dashed var(--tenis);opacity:.75;
  }
  .kisi{position:relative}
  .kartu:last-of-type::after{display:none}
  .kartu .jd{font-weight:700}
  .panah{border-radius:50%;background:var(--tenis);color:var(--lapangan-tua)}
  .lencana{background:var(--lapangan);color:#fff;box-shadow:none;border:2px solid var(--tepi)}
  .lencana::before{content:"⚑ "}

  /* ---------- tombol: bentuk pil ---------- */
  .tombol{border-radius:999px;box-shadow:0 4px 0 var(--tepi);font-weight:600}
  .tombol:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tepi)}
  .tombol.garis{border-radius:999px;border-width:2px;box-shadow:0 4px 0 rgba(36,59,107,.22)}
  .tab button, .kendali button, .kendali .unggah, .balik, .pensil, .g-keluar, .dengar, .sapa button, .g-bunyi{
    border-radius:999px;border-width:2px;border-bottom-width:3px;box-shadow:var(--bayang);
  }
  .tab button[aria-pressed="true"]{box-shadow:0 3px 0 var(--tepi)}
  .nomor{border-radius:16px;border-width:2px;border-bottom-width:4px}

  /* ---------- panel & kotak ---------- */
  .panel, .progres, .fase, .bukti, .rumah-ortu, .kosong-gambar, .bahas, .main, .sapa, .kunci{
    border-width:2px;box-shadow:var(--bayang);
  }
  .panel{border-radius:22px}
  .fase{border-left-width:7px;border-radius:16px}
  .main{border-style:solid;border-color:var(--garis);background:#FFFCF6}
  .main b{color:var(--lapangan)}
  ul.rapi li::before{border-radius:50%;background:var(--tenis)}
  ol.langkah li::before{border-radius:50%;box-shadow:0 0 0 4px rgba(245,165,36,.30)}
  .eyebrow{color:var(--lapangan);font-weight:700}
  .eyebrow::before{border-radius:50%;width:10px;height:10px;margin-top:8px}
  h2{letter-spacing:0}

  /* ---------- peraga: bingkai foto perjalanan ---------- */
  .panggung{
    background:#FFFCF6;
    border:2px solid var(--garis);
    border-radius:20px;
    padding:12px;
    box-shadow:var(--bayang);
  }
  .panggung::before{display:none}
  .panggung img.foto{border-radius:14px;background:#fff}
  .keterangan{
    background:var(--lapangan);color:#fff;border:0;border-radius:14px;
    margin:12px 0 0;font-weight:600;
  }
  .kosong-gambar{background:#FFFCF6;border-style:dashed;border-color:var(--tenis)}

  /* ---------- kuis ---------- */
  .pilihan{border-width:2px;border-bottom-width:3px;border-radius:16px;box-shadow:var(--bayang)}
  .pilihan::before{border-radius:50%}
  .soal .no{background:#FFF0D6;color:#8A5A0B}
  .skor{border-radius:22px;border-bottom:6px solid var(--tepi)}

  /* ---------- suara ---------- */
  .suara{background:#FFF0D6;border:2px dashed var(--tenis);border-radius:16px;padding:10px 12px;flex-wrap:nowrap}
  .suara .dengar{flex:1;justify-content:center;white-space:nowrap}
  .suara .dengar{background:#fff;border-color:var(--tenis);color:#8A5A0B}

  .bintang-kotak, .g-rekorbaru{border-radius:999px}
  footer{border-top:2px dashed var(--garis)}
</style>
</head>

function bukaDB(){
  return new Promise((ok,gagal)=>{
    if(!window.indexedDB) return gagal();
    const r = indexedDB.open("ayogerak",1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("data");
    r.onsuccess = ()=> ok(r.result);
    r.onerror = ()=> gagal(r.error);
  });
}

async function simpanData(){
  const isi = bungkusData();
  try{
    const db = await bukaDB();
    await new Promise((ok,gagal)=>{
      const t = db.transaction("data","readwrite");
      t.objectStore("data").put(isi,"aplikasi");
      t.oncomplete = ok; t.onerror = ()=>gagal(t.error);
    });
    CARA_SIMPAN = "perangkat"; return true;
  }catch(e){
    try{ localStorage.setItem("ayogerak.data", JSON.stringify(isi)); CARA_SIMPAN="perangkat"; return true; }
    catch(e2){ CARA_SIMPAN="memori"; return false; }
  }
}
async function muatData(){

  try{
    const db = await bukaDB();
    const data = await new Promise((ok,gagal)=>{
      const t = db.transaction("data","readonly");
      const q = t.objectStore("data").get("aplikasi");
      q.onsuccess = ()=> ok(q.result); q.onerror = ()=> gagal(q.error);
    });

function migrasiSemua(){
  const peta = {};
  for(let k=1;k<=6;k++){
    const n = (DATA[k]||[]).length + ((S.tambahan[k]||[]).length);
    for(let i=0;i<n;i++) peta[`${k}-${i}`] = kodeMateri(k,i);
  }
  const pindah = obj => Object.keys(obj).forEach(kunci=>{
    const baru = peta[kunci];
    if(baru && baru !== kunci){ if(obj[baru] === undefined) obj[baru] = obj[kunci]; delete obj[kunci]; }
  });
  pindah(S.gambar); pindah(S.video); pindah(S.sunting);
  const pindahProgres = pr => Object.keys(pr).forEach(kunci=>{
    const baru = peta[kunci];
    if(baru){ const b = baru + "-P1"; if(pr[b] === undefined) pr[b] = pr[kunci]; delete pr[kunci]; }
  });
  pindahProgres(S.progres);
  Object.values(S.akun).forEach(a=>{ if(a.progres) pindahProgres(a.progres); });
  Object.keys(S.rekor).forEach(kunci=>{
    const c = kunci.match(/^(\d+-\d+)-(.+)$/);
    if(c && peta[c[1]]){ S.rekor[`${peta[c[1]]}-P1-${c[2]}`] = S.rekor[kunci]; delete S.rekor[kunci]; }
  });
}
function jadikanKotak(berkas, ukuran){
  return new Promise(ok=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const c = document.createElement("canvas");
        c.width = c.height = ukuran;
        const ctx = c.getContext("2d");
        const skala = Math.min(ukuran/img.width, ukuran/img.height);
        const w = img.width*skala, h = img.height*skala;
        ctx.drawImage(img, (ukuran-w)/2, (ukuran-h)/2, w, h);
        try{ ok(c.toDataURL("image/png")); }catch(e){ ok(null); }
      };
      img.onerror = ()=> ok(null);
      img.src = r.result;
    };
    r.onerror = ()=> ok(null);
    r.readAsDataURL(berkas);
  });
}
function kecilkan(berkas){
  return new Promise(ok=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maks = 1200; let w = img.width, h = img.height;
        if(w>maks){ h = Math.round(h*maks/w); w = maks; }
        if(h>maks){ w = Math.round(w*maks/h); h = maks; }
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        try{ ok(c.toDataURL("image/jpeg",0.78)); }catch(e){ ok(r.result); }
      };
      img.onerror = ()=> ok(r.result);
      img.src = r.result;
    };
    r.onerror = ()=> ok(null);
    r.readAsDataURL(berkas);
  });
}

async function sinkronKonten(){

  const h = await ambilKonten(false);
  if(h && h.baru){ pasangNamaApp(); render(); }
}
function waktuVersi(v){
  if(!v) return "belum pernah";
  const d = new Date(Number(v));
  return isNaN(d.getTime()) ? "-" : d.toLocaleString("id-ID", {dateStyle:"medium", timeStyle:"short"});
}

async function kirimAntrian(){
  if(!S.server || !S.antrian.length) return;
  const sisa = [];
  for(const d of S.antrian){ if(!(await kirimSatu(d))) sisa.push(d); }
  const berubah = sisa.length !== S.antrian.length;
  S.antrian = sisa;
  if(berubah) await simpanData();
}
async function ambilHasilServer(){
  if(!S.server) return {ok:false, pesan:"Alamat server belum diisi."};
  if(!S.kodeKelas || !S.kodeGuru) return {ok:false, pesan:"Kode kelas dan kode guru belum lengkap."};
  try{
    const r = await fetch(S.server + (S.server.includes("?")?"&":"?") + "aksi=daftar" +
                          "&kode=" + encodeURIComponent(S.kodeKelas) +
                          "&guru=" + encodeURIComponent(S.kodeGuru));
    const j = await r.json();
    if(j && j.ok === false) return {ok:false, pesan: j.pesan || "Kode guru ditolak server."};
    if(!j || !j.hasil) return {ok:false, pesan:"Balasan server tidak dikenali."};
    S.hasilServer = j.hasil;
    return {ok:true, jumlah:j.hasil.length};
  }catch(e){ return {ok:false, pesan:"Gagal menghubungi server. Periksa alamat dan koneksi internet."}; }
}
async function daftarkanKode(kodeKelas, kodeGuru){
  if(!S.server) return {ok:true, luring:true};
  try{
    const r = await fetch(S.server, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({aksi:"daftarkode", kodeKelas, kodeGuru})});
    const j = await r.json();
    return j && j.ok ? {ok:true} : {ok:false, pesan: j && j.pesan==="terpakai" ? "Kode kelas itu sudah dipakai guru lain. Coba buat lagi." : "Server menolak pendaftaran kode."};
  }catch(e){ return {ok:false, pesan:"Gagal menghubungi server saat mendaftarkan kode."}; }
}
async function cekKodeGuru(kodeKelas, kodeGuru){

                          "&kode=" + encodeURIComponent(kodeKelas) + "&guru=" + encodeURIComponent(kodeGuru));

}

function doGet(e){
  var p = e && e.parameter ? e.parameter : {};

  if(p.aksi === 'cek'){
    return jawab({ok: cekGuru(p.kode, p.guru)});
  }

  if(p.aksi === 'gambar'){
    var shg = lembar('Gambar');
    if(shg.getLastRow() < 2) return jawab({ok:true, versi:0, gambar:[]});
    var dg = shg.getRange(2, 1, shg.getLastRow()-1, 7).getValues();
    var kump = {}, versiG = 0;
    for(var i = 0; i < dg.length; i++){
      if(String(dg[i][0]) !== String(p.kode)) continue;
      if(String(dg[i][1]) !== String(p.materi)) continue;
      versiG = Number(dg[i][3]) || versiG;
      var ix = Number(dg[i][2]) || 0;
      if(!kump[ix]) kump[ix] = [];
      kump[ix].push({b:Number(dg[i][4]) || 1, isi:String(dg[i][6] || '')});
    }
    var keluar = [];
    var urut = Object.keys(kump).sort(function(a,b){ return Number(a) - Number(b); });
    for(var u = 0; u < urut.length; u++){
      var bagi = kump[urut[u]];
      bagi.sort(function(a,b){ return a.b - b.b; });
      var satu = '';
      for(var z = 0; z < bagi.length; z++) satu += bagi[z].isi;
      if(satu) keluar.push(satu);
    }
    return jawab({ok:true, versi:versiG, gambar:keluar});
  }

  if(p.aksi === 'bukti'){
    if(!cekGuru(p.kode, p.guru)) return jawab({ok:false, pesan:'Kode guru salah.'});
    var shb = lembar('Bukti');
    if(shb.getLastRow() < 2) return jawab({ok:true, daftar:[]});
    var db = shb.getRange(2, 1, shb.getLastRow()-1, 10).getValues();
    var peta = {};
    for(var i = 0; i < db.length; i++){
      if(String(db[i][1]) !== String(p.kode)) continue;
      if(p.materi && String(db[i][4]) !== String(p.materi)) continue;
      var kunci = db[i][2] + '|' + db[i][4];
      if(!peta[kunci]) peta[kunci] = {waktu:String(db[i][0]).slice(0,24), nama:db[i][2], kelas:db[i][3],
                                      kode:db[i][4], materi:db[i][5], catatan:db[i][6], bagian:[]};
      peta[kunci].bagian.push({b:Number(db[i][7]) || 1, isi:String(db[i][9] || '')});
    }
    var daftar = [];
    for(var k in peta){
      var x = peta[k];
      x.bagian.sort(function(a,b){ return a.b - b.b; });
      var foto = '';
      for(var z = 0; z < x.bagian.length; z++) foto += x.bagian[z].isi;
      daftar.push({waktu:x.waktu, nama:x.nama, kelas:x.kelas, kode:x.kode,
                   materi:x.materi, catatan:x.catatan, foto:foto});
    }
    return jawab({ok:true, daftar:daftar});
  }

  if(p.aksi === 'konten'){
    var shk = lembar('Konten');
    if(shk.getLastRow() < 2) return jawab({ok:true, versi:0, isi:''});
    var dk = shk.getRange(2, 1, shk.getLastRow()-1, 5).getValues();
    var bag = [], versi = 0;
    for(var i = 0; i < dk.length; i++){
      if(String(dk[i][0]) !== String(p.kode)) continue;
      versi = Number(dk[i][1]) || versi;
      bag.push({b: Number(dk[i][2]) || 1, isi: String(dk[i][4])});
    }
    if(!bag.length) return jawab({ok:true, versi:0, isi:''});
    bag.sort(function(a,b){ return a.b - b.b; });
    var gabung = '';
    for(var k = 0; k < bag.length; k++) gabung += bag[k].isi;
    return jawab({ok:true, versi:versi, isi:gabung});
  }

  if(p.aksi === 'daftar'){
    if(!cekGuru(p.kode, p.guru)) return jawab({ok:false, pesan:'Kode guru salah.'});
    var sh = lembar('Nilai');

    if(sh.getLastRow() > 1){
      var lebar = Math.max(10, sh.getLastColumn());
      var data = sh.getRange(2, 1, sh.getLastRow()-1, lebar).getValues();
      for(var i = 0; i < data.length; i++){
        if(String(data[i][1]) !== String(p.kode)) continue;
        hasil.push({
          waktu: String(data[i][0]).slice(0,24), kodeKelas: data[i][1],
          nama: data[i][2], kelas: data[i][3],
          materi: data[i][4], kelasMateri: data[i][5],
          benar: data[i][6], total: data[i][7], nilai: data[i][8], perangkat: data[i][9],
          kode: data[i][10] || '', pertemuan: data[i][11] || 1
        });
      }
    }
    return jawab({ok:true, hasil:hasil});
  }

  return jawab({ok:true, pesan:'Server nilai Move Adventure siap.'});
}`;

  } else {
    h += `<p class="catatan" style="margin:0 0 8px">Kode kelas boleh diketahui siswa karena hanya dipakai untuk mengirim nilai.</p>
      <div class="baris"><span class="catatan">Kode guru (rahasia)</span><b>${S.kodeGuru?esc(S.kodeGuru):"–"}</b></div>
      <p class="catatan" style="margin:0 0 10px">Catat kode guru ini dan jangan berikan kepada siswa. Kode inilah yang membuka nilai, termasuk saat kamu memakai HP atau laptop lain.</p>
      <div class="kendali"><button id="gantikodekelas">Ganti kode</button></div>`;
  }
  h += `</div>

  <div class="progres" style="margin-top:12px">
    <div class="baris"><span class="catatan">Tautan khusus siswa</span></div>
    <p class="catatan" style="margin:0 0 10px">${S.kodeKelas
      ? "Bagikan tautan ini kepada siswa. Kode kelas sudah menempel di dalamnya, jadi siswa tidak perlu mengetik apa pun."
      : "Buat kode lebih dulu agar tautannya membawa kode dan nilai siswamu tidak tercampur dengan guru lain."}</p>
    <div class="isian"><input id="tautansiswa" readonly value="${esc(tautanSiswa())}">
      <button class="tombol" id="salintautan">Salin tautan</button></div>
    <p class="catatan" id="pesantautan" style="margin:8px 0 0"></p>
    <p class="catatan" style="margin:6px 0 0">Tautan ini membawa kode kelas dan alamat server sekaligus, sehingga perangkat siswa langsung dapat menerima materi dan mengirim nilai tanpa mengatur apa pun. Salin ulang tautan ini setiap kali kamu mengganti alamat server atau kode kelas.</p>
  </div>`;
  return h;
}

    document.getElementById("pesantautan").textContent = r.luring
      ? "Kode dibuat. Alamat server belum diisi, jadi kode ini baru berlaku di perangkat ini."

/* ---------- nilai siswa per kelas, dibuka dengan kode guru ---------- */
function panelNilaiKelas(){
  let h = `<div class="progres" style="margin-top:14px">
    <div class="baris"><span class="catatan">Nilai siswa kelas ${S.kelas}</span></div>`;
  if(!S.server){
    h += `<p class="catatan" style="margin:0">Alamat server belum diisi, jadi nilai siswa dari rumah belum bisa ditampilkan. Isi di tab Alat Bantu.</p></div>`;
    return h;
  }
  if(!S.kodeKelas){
    h += `<p class="catatan" style="margin:0">Buat kode kelas lebih dulu di bagian atas halaman ini.</p></div>`;
    return h;
  }
  if(!S.bukaNilai){
    h += `<p class="catatan" style="margin:0 0 10px">Masukkan kode guru untuk membuka nilai siswa. Ini menjaga agar siswa tidak bisa melihat nilai temannya.</p>
      <div class="isian"><input id="kodebuka" type="password" placeholder="Kode guru" autocomplete="off" maxlength="12">
        <button class="tombol" id="bukanilai">Buka nilai</button></div>
      <p class="catatan" id="pesanbuka" style="margin:8px 0 0"></p></div>`;
    return h;
  }
  const data = (S.hasilServer||[]).filter(x=>String(x.kelas)===String(S.kelas));
  const peta = {};
  data.forEach(x=>{
    const k = String(x.nama).trim().toLowerCase();
    (peta[k] = peta[k] || {nama:String(x.nama).trim(), materi:{}}).materi[x.materi] =
      Math.max(peta[k].materi[x.materi]||0, Number(x.nilai)||0);
  });
  const siswa = Object.values(peta).sort((a,b)=>a.nama.localeCompare(b.nama));
  h += `<div class="kendali" style="margin-top:0"><button id="muatnilai">Muat ulang</button>
        <button id="tutupnilai">Tutup nilai</button></div>`;
  if(siswa.length===0){
    h += `<p class="catatan">Belum ada siswa kelas ${S.kelas} yang mengirim nilai lewat tautanmu.</p>`;
  } else {
    h += `<div class="gulir"><table><thead><tr><th>Nama</th><th>Materi dikerjakan</th><th>Rata-rata</th></tr></thead><tbody>`;
    siswa.forEach(sw=>{
      const nilai = Object.values(sw.materi);
      const rata = Math.round(nilai.reduce((a,b)=>a+b,0)/nilai.length);
      h += `<tr><td>${esc(sw.nama)}</td><td>${nilai.length} dari ${jumlahMateriKelas(S.kelas)}</td><td class="nilai">${rata}</td></tr>`;
      Object.entries(sw.materi).forEach(([nm,nl])=>{
        h += `<tr style="background:var(--kapur)"><td colspan="2" style="padding-left:18px;font-size:13px">${esc(nm)}</td>
          <td style="font-size:13px">${nl}</td></tr>`;
      });
    });
    h += `</tbody></table></div>
      <p class="catatan">${siswa.length} siswa kelas ${S.kelas}. Rincian per soal dan pemeriksaan pengiriman ganda ada di tab Penilaian tiap materi.</p>`;
  }
  return h + `<p class="catatan" id="pesanbuka" style="margin:8px 0 0"></p></div>`;
}
function pasangNilaiKelas(){
  const bn = document.getElementById("bukanilai");

    if(!kg){ kabar.textContent = "Isi kode guru dulu."; return; }
    if(S.kodeGuru && kg !== S.kodeGuru){ kabar.textContent = "Kode guru salah."; return; }
    kabar.textContent = "Membuka nilai...";
    S.kodeGuru = kg;
    const r = await ambilHasilServer();
    if(!r.ok){ kabar.textContent = r.pesan; return; }
    S.bukaNilai = true; tampilBeranda();

    const kabar = document.getElementById("pesanbuka");

    if(!r.ok){ kabar.textContent = r.pesan; return; }

}

/* ---------- beranda ---------- */
function tampilBeranda(){
  const total = jumlahMateriKelas(KELAS_ISI);          // satu set pelajaran untuk semua jenjang
  const selesai = Object.keys(progresAktif()).length;
  const sapa = S.peran==="siswa"
    ? "Pilih pelajaran yang ingin kamu pelajari hari ini."
    : "Pilih pelajaran untuk membuka modul ajar, alur kegiatan, lembar penilaian, dan alat bantu mengajar.";
  let h = barisAkun() + `<p class="eyebrow">${S.peran==="siswa"?"Menu siswa":"Menu guru"}</p>
    <h2>${S.peran==="siswa"?"Belajar Gerak":"Perangkat Mengajar"}</h2>
    <p class="catatan">${sapa}</p>
    <input class="cari" id="cari" placeholder="Cari materi, misal: lompat, voli, kebugaran" value="${esc(S.cari)}" autocomplete="off">`;

  if(S.cari.trim()){
    const q = S.cari.toLowerCase();
    const hasil = [];
    daftarMateri(KELAS_ISI).forEach((m,i)=>{
      const mm = materiAktif(S.kelas || KELAS_ISI, i);
      if((mm.j+" "+mm.e).toLowerCase().includes(q)) hasil.push({k:S.kelas || KELAS_ISI, i, m:mm});
    });
    h += `<p class="eyebrow">Hasil pencarian (${hasil.length})</p>`;
    if(hasil.length===0) h += `<p class="catatan">Materi tidak ditemukan. Coba kata lain seperti "lari", "bola", atau "senam".</p>`;
    hasil.forEach(r=> h += kartuMateri(r.m,r.k,r.i));
  } else {
    if(S.adaPembaruan) h += `<div class="main" style="border-color:var(--lintasan);background:#FFF3ED"><b>Versi baru tersedia</b>Tutup lalu buka kembali aplikasi ini untuk memakai versi terbaru.</div>`;
    if(S.peran==="guru") h += tombolCP() + panelSiswaGuru();
    if(S.peran==="siswa"){
      h += `<div class="progres"><div class="baris"><span class="catatan">Progres belajarmu</span><b>${selesai}/${total}</b></div>
        <div class="bar"><span style="width:${Math.round(selesai/total*100)}%"></span></div></div>`;
    }
    const akun = akunAktif();
    const kunciKelas = S.peran==="siswa" && akun && akun.kelas && !S.lihatKelasLain;
    if(kunciKelas){
      S.kelas = akun.kelas;
      h += `<p class="eyebrow">Pelajaran untuk kelas ${S.kelas}</p>`;
    } else {
      h += `<p class="eyebrow">Pilih kelas</p><div class="kelas-baris tiga">`;
      for(let i=1;i<=3;i++) h += `<button class="nomor" aria-pressed="${S.kelas===i}" data-kelas="${i}">${i}<small>Kelas</small></button>`;
      h += `</div>`;
      if(S.peran==="siswa" && akun && akun.kelas){
        h += `<p style="margin:12px 0 0"><button class="tombol garis" id="balikkelas">Kembali ke kelas ${akun.kelas}</button></p>`;
      }
    }
    if(S.kelas){
      if(!S.kelas) S.kelas = 1;
      h += `<div class="fase"><b>${FASE[S.kelas].f}</b>${FASE[S.kelas].d}</div>`;
      const semua = daftarMateri(S.kelas).map((m,i)=>({m:materiAktif(S.kelas,i), i}));
      [1].forEach(sm=>{
        const isi = semua;
        if(isi.length===0) h += `<p class="catatan">Belum ada pelajaran.</p>`;
        isi.forEach(x=> h += kartuMateri(x.m, S.kelas, x.i));
        if(S.peran==="guru"){
          h += `<p style="margin:0 0 18px"><button class="tombol garis" data-tambahmateri="${sm}">+ Tambah materi semester ${sm}</button></p>`;
        }
      });
      if(S.peran==="guru") h += panelNilaiKelas();
      const akun2 = akunAktif();
      if(S.peran==="siswa" && akun2 && akun2.kelas && !S.lihatKelasLain){
        h += `<p style="margin:14px 0 0"><button class="tombol garis" id="kelaslain">Lihat materi kelas lain</button></p>`;
      }
    }
  }
  h += `<footer>Move Adventure · Media belajar PJOK untuk kelas 1–3 · UPT SPF SDN Rappocini</footer>`;
  isi.innerHTML = h;

  const kl2 = document.getElementById("kelaslain");
  if(kl2) kl2.onclick = ()=>{ S.lihatKelasLain = true; tampilBeranda(); };
  const bk2 = document.getElementById("balikkelas");
  if(bk2) bk2.onclick = ()=>{ S.lihatKelasLain = false; S.kelas = akunAktif().kelas; tampilBeranda(); };
  pasangPanelSiswa();
  const ga = document.getElementById("gantiakun");
  if(ga) ga.onclick = ()=>{ S.siswaAktif=null; S.kelas=null; S.materi=null; render(); };
  pasangGantiKelas();
  const c = document.getElementById("cari");
  c.oninput = ()=>{ S.cari=c.value; const pos=c.selectionStart; tampilBeranda();
    const b=document.getElementById("cari"); b.focus(); b.setSelectionRange(pos,pos); };
  isi.querySelectorAll("[data-kelas]").forEach(b=>b.onclick=()=>{ S.kelas=Number(b.dataset.kelas); tampilBeranda(); });
  isi.querySelectorAll("[data-tambahmateri]").forEach(b=>b.onclick=async ()=>{
    const sm = Number(b.dataset.tambahmateri);
    (S.tambahan[S.kelas] = S.tambahan[S.kelas] || []).push(templatMateri(sm));
    await simpanData();
    S.materi = daftarMateri(S.kelas).length - 1; S.temuKe = 1; S.tab = 0; S.ubah = true; render();
  });
  isi.querySelectorAll("[data-buka]").forEach(b=>b.onclick=()=>{
    const [k,i]=b.dataset.buka.split("-").map(Number);
    S.kelas=k; S.materi=i; S.temuKe=1; S.tab=0; S.jawab={}; S.nilai=[];
    S.ubah=false; S.draftKuis=null; render();
  });
}
function kartuMateri(m,k,i){
  const kode = kodeMateri(k,i);
  const sudah = progresAktif()[`${kode}-P1`] !== undefined;
  const lencana = (S.peran==="siswa" && sudah) ? `<span class="lencana">Selesai</span>` : "";
  return `<button class="kartu" data-buka="${k}-${i}">
    <span class="jalur"></span>
    <span class="kartu-teks"><span class="el">Pelajaran ${i+1} · ${esc(m.e)}</span>
      <span class="jd">${esc(m.j)}</span></span>
    ${lencana}<span class="panah">›</span></button>`;
}

/* ---------- materi gabungan: bawaan + suntingan guru ---------- */
const KELAS_ISI = 1;                 // seluruh jenjang memakai satu set pelajaran yang sama
function daftarMateri(k){ return (DATA[KELAS_ISI]||[]).concat(S.tambahan[KELAS_ISI]||[]); }
function jumlahMateriKelas(k){ return daftarMateri(k).length; }
function soalMateri(k, i, dasar){ return dasar; }

function materiAktif(k,i){
  const dasar = daftarMateri(k)[i];
  if(!dasar) return null;
  const asli = {...dasar, ml: dasar.ml || MATERI_LENGKAP[`${k}-${i}`] || "",
                sem: dasar.sem || SEMESTER[`${k}-${i}`] || 1,
                k: soalMateri(k, i, dasar.k || [])};
  const ubah = S.sunting[kodeMateri(k,i)];
  if(!ubah) return asli;
  return {...asli, ...ubah, g:{...asli.g, ...(ubah.g||{})}};
}
function materiTambahan(k,i){ return i >= DATA[k].length; }
function templatMateri(sem){
  return {id:"T"+Math.random().toString(36).slice(2,7).toUpperCase(),
    j:"Materi baru", e:"Elemen pembelajaran", a:"lari", sem,
    ak:"Tuliskan penekanan teknik gerak di sini.",
    t:["Tujuan pembelajaran pertama."],
    l:["Langkah gerak pertama."],
    ml:"Pengertian\nTuliskan penjelasan materi di sini.\n\nManfaat\nTuliskan manfaatnya.\n\nHal yang perlu diperhatikan\nTuliskan catatan keselamatan dan kesalahan umum.",
    p:[{n:"Nama permainan", d:"Penjelasan permainan."}],
    k:[{s:"Pertanyaan pertama?", o:["Pilihan A","Pilihan B","Pilihan C"], a:0, x:"Penjelasan jawaban benar."}],
    g:{alat:["Peluit"],
       pe:"Berbaris, berdoa, presensi, dan pemanasan.",
       in:"Tuliskan kegiatan inti pembelajaran.",
       pu:"Pendinginan, refleksi, dan doa penutup.",
       r:["Aspek penilaian pertama","Aspek penilaian kedua"]}};
}
function adaSuntingan(k,i){ return !!S.sunting[kodeMateri(k,i)]; }
function simpanSunting(bagian, sasaran){
  const k = kunciMateri();
  if(sasaran === "temu" && S.temuKe) return simpanTemu(k, S.temuKe, bagian);
  if(materiTambahan(S.kelas,S.materi)){
    const posisi = S.materi - DATA[S.kelas].length;
    const lama = S.tambahan[S.kelas][posisi];
    S.tambahan[S.kelas][posisi] = {...lama, ...bagian, g:{...lama.g, ...(bagian.g||{})}};
    return simpanData();
  }
  const lama = S.sunting[k] || {};
  const gabung = {...lama, ...bagian, g:{...(lama.g||{}), ...(bagian.g||{})}};
  if(!Object.keys(gabung.g).length) delete gabung.g;
  S.sunting[k] = gabung;
  return simpanData();
}
function baris(t){ return String(t||"").split("\n").map(x=>x.trim()).filter(Boolean); }
function isiKolom(nilai){ return esc(Array.isArray(nilai) ? nilai.join("\n") : (nilai||"")); }
/* ---------- halaman materi ---------- */
function tampilMateri(){
  const m = temuAktif(S.kelas,S.materi,S.temuKe);
  const tabs = TAB[S.peran].map(x=>x[1]);
  if(S.tab >= tabs.length) S.tab = 0;
  let h = barisAkun() + `<button class="balik" id="balik">‹ Kembali ke daftar materi</button>
    <p class="eyebrow">${esc(m.e)}</p>
    <div class="judul-baris">
      <h2 id="judulmateri">${esc(m.j)}</h2>
      ${S.peran==="guru"?`<button class="pensil" id="ubahnamamateri" title="Ganti nama materi" aria-label="Ganti nama materi">✎</button>`:""}
    </div>
    <p class="catatan">${esc(m.ak)}</p>
    <div class="tab" role="group" aria-label="Bagian materi">`;
  tabs.forEach((t,i)=> h += `<button data-tab="${i}" aria-pressed="${S.tab===i}">${t}</button>`);
  h += `</div><div class="panel" id="panel"></div>`;
  isi.innerHTML = h;
  document.getElementById("balik").onclick = ()=>{ S.materi=null; S.ubah=false; S.draftKuis=null; hentikanJam(); render(); };
  const ga2 = document.getElementById("gantiakun");
  if(ga2) ga2.onclick = ()=>{ S.siswaAktif=null; S.kelas=null; S.materi=null; S.temuKe=null; render(); };
  const unt = document.getElementById("ubahnamamateri");
  if(unt) unt.onclick = ()=> ubahNamaMateri(m);
  pasangGantiKelas();
  isi.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
    S.tab=Number(b.dataset.tab); S.ubah=false; S.draftKuis=null; hentikanJam();
    isi.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-pressed", Number(x.dataset.tab)===S.tab));
    panel();
  });
  panel();
}

function kunciMateri(){ return kodeMateri(S.kelas,S.materi); }
function daftarGambar(){
  const k = kunciMateri(), lama = kunciLama(S.kelas,S.materi);
  return ((GAMBAR[k]||GAMBAR[lama]||[])).map(src=>({src,tetap:true}))
    .concat((S.gambar[k]||[]).map(src=>({src,tetap:false})));
}
function blokPeraga(m){
  const foto = daftarGambar();
  if(S.fotoAktif >= foto.length) S.fotoAktif = 0;

  let h = "";

    }
  } else {
    h += `<div class="kosong-gambar">
      <b>Belum ada gambar peragaan</b>

        ? "Unggah foto gerakan lewat tombol di bawah, lalu tekan Terbitkan gambar peraga di tab Alat Bantu agar sampai ke siswa."
        : "Gurumu belum menambahkan gambar untuk pelajaran ini. Dengarkan penjelasannya dulu ya."}</span>
      <p class="keterangan-kosong">${esc(m.ak)}</p>
    </div>`;
  }

  h += `<div class="kendali">`;
  if(S.peran==="guru"){
    h += `<label class="unggah">+ Unggah gambar<input type="file" id="unggah" accept="image/*" multiple></label>`;
    if(foto.length && !foto[S.fotoAktif].tetap) h += `<button id="hapusfoto">Hapus gambar ini</button>`;

  if(S.peran==="guru"){
    h += CARA_SIMPAN==="perangkat"
      ? `<p class="catatan">Gambar tersimpan di perangkat ini dan tetap ada setelah aplikasi ditutup. Gambar hanya hilang bila kamu menghapusnya sendiri.</p>`
      : `<p class="catatan">Penyimpanan perangkat belum aktif di browser ini, jadi gambar hanya bertahan selama halaman dibuka. Buka file lewat browser Chrome atau Firefox agar tersimpan permanen.</p>`;
  }
  return h;
}
function pasangKendali(){
  document.querySelectorAll("[data-foto]").forEach(b=>b.onclick=()=>{ S.fotoAktif=Number(b.dataset.foto); panel(); });
  const u=document.getElementById("unggah");
  if(u) u.onchange=async ()=>{
    const k=kunciMateri(); const berkas=[...u.files]; if(!berkas.length) return;
    for(const f of berkas){
      const data = await kecilkan(f);
      if(data) (S.gambar[k]=S.gambar[k]||[]).push(data);
    }
    await simpanData();
    S.paksaAnimasi=false; S.fotoAktif=daftarGambar().length-1; panel();
  };
  const hp=document.getElementById("hapusfoto");
  if(hp) hp.onclick=async ()=>{

  };
}

/* ---------- materi lengkap ---------- */
function tampilMateriLengkap(m){
  if(!m.ml.trim()) return `<p class="catatan">Materi lengkap belum diisi untuk bagian ini.</p>`;
  return m.ml.split(/\n\s*\n/).map(bagian=>{
    const baris2 = bagian.split("\n");
    let h = "";
    baris2.forEach((b,i)=>{
      const t = b.trim(); if(!t) return;
      if(i===0 && t.length<60 && !/[.!?]$/.test(t)) h += `<h3${h?"":' style="margin-top:0"'}>${esc(t)}</h3>`;
      else h += `<p>${esc(t)}</p>`;
    });
    return h;
  }).join("");
}
