baris, berdoa, presensi, pemanasan lari dan peregangan menyeluruh (15 menit).", "in": "Guru menjelaskan pembagian daerah penjagaan. Regu menyusun strategi di kertas, mencoba satu babak, mengevaluasi, lalu bermain Kasti Penuh Antarregu (75 menit).", "pu": "Pendinginan, refleksi strategi yang berhasil dan yang perlu diperbaiki, doa (15 menit).", "r": ["Ketepatan penempatan pemain", "Komunikasi dan kerja sama regu", "Kepemimpinan dan sportivitas"]}},
 {"j": "Atletik: Lari Jarak Pendek Start Berdiri", "e": "Aktivitas atletik", "a": "lari", "ak": "Aba-aba bersedia, siap, ya. Kecepatan dipertahankan sampai melewati garis finis, bukan direm sebelumnya.", "ml": "Pengertian\nLari jarak pendek atau sprint adalah lari dengan kecepatan maksimal pada jarak yang relatif pendek. Di kelas enam jaraknya umumnya enam puluh meter dengan start berdiri.\n\nManfaat\nMelatih kecepatan, daya ledak tungkai, koordinasi lengan dan kaki, serta sikap sportif dalam berlomba.\n\nHal yang perlu diperhatikan\nUrutan aba-aba adalah bersedia, siap, ya. Lintasan harus rata dan bebas batu. Kecepatan dipertahankan sampai melewati garis finis, sebab mengerem sebelum garis membuat catatan waktu memburuk dan berisiko terjatuh.", "t": ["Mempraktikkan start berdiri sesuai aba-aba.", "Mempraktikkan lari cepat dengan teknik yang benar sampai garis finis.", "Menunjukkan sikap sportif saat menang maupun kalah."], "l": ["Aba-aba bersedia: berdiri di belakang garis, kaki terkuat di depan, badan condong.", "Aba-aba siap: tekuk lutut sedikit, pindahkan berat badan ke kaki depan, pandangan ke lintasan.", "Aba-aba ya: dorong kuat kaki depan, lari dengan langkah yang makin panjang.", "Ayunkan lengan menyiku sembilan puluh derajat berlawanan dengan kaki.", "Angkat lutut ke depan dan mendarat dengan ujung kaki.", "Pertahankan kecepatan sampai beberapa langkah melewati garis finis."], "p": [{"n": "Reaksi Peluit", "d": "Siswa berdiri membelakangi guru. Saat peluit berbunyi, siswa berbalik dan berlari sepuluh meter secepat mungkin."}, {"n": "Lomba Seri Kecil", "d": "Siswa dibagi dalam seri berisi empat orang dengan kemampuan sepadan agar setiap anak merasakan persaingan yang berimbang."}], "k": [{"s": "Urutan aba-aba lari jarak pendek adalah...", "o": ["Bersedia, siap, ya", "Siap, bersedia, ya", "Ya, bersedia, siap"], "a": 0, "x": "Urutan ini berlaku pada semua perlombaan lari."}, {"s": "Start yang digunakan pada lari jarak pendek tingkat sekolah dasar umumnya adalah start...", "o": ["Berdiri", "Jongkok penuh", "Melayang"], "a": 0, "x": "Start berdiri lebih aman dan mudah bagi siswa sekolah dasar."}, {"s": "Saat berlari cepat, kaki mendarat dengan...", "o": ["Ujung kaki", "Seluruh telapak", "Tumit keras"], "a": 0, "x": "Mendarat pada ujung kaki membuat langkah lebih ringan dan cepat."}, {"s": "Lengan diayun membentuk sudut sekitar...", "o": ["Sembilan puluh derajat", "Seratus delapan puluh derajat", "Tiga puluh derajat"], "a": 0, "x": "Siku menyiku sembilan puluh derajat menghasilkan ayunan yang efisien."}, {"s": "Kecepatan lari sebaiknya dipertahankan sampai...", "o": ["Beberapa langkah setelah garis finis", "Sebelum garis finis", "Setengah lintasan"], "a": 0, "x": "Mengerem sebelum garis membuat waktu memburuk."}, {"s": "Pada aba-aba siap, berat badan dipindahkan ke...", "o": ["Kaki depan", "Kaki belakang", "Kedua tumit"], "a": 0, "x": "Berat badan di kaki depan mempercepat dorongan saat aba-aba ya."}, {"s": "Lintasan lari yang aman adalah lintasan yang...", "o": ["Rata dan bebas batu", "Menurun tajam", "Berpasir tebal"], "a": 0, "x": "Permukaan rata mencegah terpeleset dan terkilir."}, {"s": "Badan saat berlari cepat sebaiknya...", "o": ["Sedikit condong ke depan", "Tegak lurus", "Condong ke belakang"], "a": 0, "x": "Condong ke depan membantu dorongan ke arah lari."}, {"s": "Pemanasan sebelum lari cepat bertujuan...", "o": ["Menyiapkan otot agar tidak cedera", "Menambah berat badan", "Menghabiskan waktu"], "a": 0, "x": "Otot yang hangat lebih siap menerima beban lari maksimal."}, {"s": "Sikap sportif ditunjukkan dengan...", "o": ["Memberi selamat kepada pemenang", "Menuduh lawan curang", "Meninggalkan lintasan"], "a": 0, "x": "Menghargai lawan adalah inti sportivitas dalam perlombaan."}], "g": {"alat": ["Peluit", "Stopwatch", "Kerucut penanda start dan finis", "Meteran", "Lintasan rata"], "pe": "Berbaris, berdoa, presensi, pemanasan lari kecil, gerakan ABC running, dan peregangan tungkai (15 menit).", "in": "Guru mencontohkan sikap pada tiap aba-aba. Siswa berlatih start berulang, permainan Reaksi Peluit, dilanjutkan Lomba Seri Kecil enam puluh meter (75 menit).", "pu": "Pendinginan berjalan dan peregangan, refleksi hasil dan target perbaikan diri, doa (15 menit).", "r": ["Ketepatan sikap pada tiap aba-aba", "Teknik lari dan mempertahankan kecepatan", "Sportivitas dalam perlombaan"]}},
 {"j": "Atletik: Lempar Turbo", "e": "Aktivitas atletik", "a": "lempar", "ak": "Turbo dipegang di atas bahu, dilempar ke depan atas. Melempar hanya setelah aba-aba guru.", "ml": "Pengertian\nLempar turbo adalah nomor atletik untuk anak yang menjadi pengantar nomor lempar lembing. Alatnya berupa turbo, yaitu peluru roket ringan dari plastik atau busa yang aman bagi siswa.\n\nManfaat\nMelatih kekuatan dan koordinasi otot lengan serta bahu, ketepatan arah, keseimbangan badan, dan pemahaman dasar gerakan melempar dalam atletik.\n\nHal yang perlu diperhatikan\nMelempar hanya dilakukan setelah aba-aba guru dan ke arah yang sama bagi seluruh siswa. Pengambilan alat dilakukan bersama-sama setelah semua selesai melempar. Tidak ada siswa yang berdiri di depan daerah lemparan.", "t": ["Mempraktikkan cara memegang dan membawa turbo dengan benar.", "Mempraktikkan lemparan turbo dengan awalan sederhana.", "Menaati aturan keselamatan saat kegiatan melempar."], "l": ["Pegang turbo pada bagian pegangannya dengan satu tangan, jari-jari melingkar dengan nyaman.", "Bawa turbo di atas bahu dengan mata alat mengarah ke depan atas.", "Berdiri menyamping, kaki berlawanan dengan tangan pelempar berada di depan.", "Tarik lengan ke belakang, dada dibuka, pandangan ke arah sasaran.", "Lemparkan ke depan atas dengan sudut sekitar empat puluh lima derajat sambil memindahkan berat badan ke kaki depan.", "Jaga keseimbangan setelah melempar agar tidak melewati garis batas."], "p": [{"n": "Lempar Zona Nilai", "d": "Lapangan dibagi menjadi tiga zona bernilai. Siswa melempar bergantian dan mencatat nilainya sendiri."}, {"n": "Turbo Berpasangan", "d": "Dua siswa berdiri berjauhan dan melempar bergantian ke arah pasangan yang berdiri di samping daerah sasaran, bukan di dalamnya."}], "k": [{"s": "Lempar turbo merupakan pengantar untuk nomor...", "o": ["Lempar lembing", "Lompat jauh", "Lari estafet"], "a": 0, "x": "Turbo adalah versi ringan dan aman dari lembing untuk anak."}, {"s": "Turbo dibawa pada posisi...", "o": ["Di atas bahu", "Di bawah pinggang", "Di belakang punggung"], "a": 0, "x": "Posisi di atas bahu menyiapkan lengan untuk melempar ke depan atas."}, {"s": "Sudut lemparan yang dianjurkan sekitar...", "o": ["Empat puluh lima derajat", "Sepuluh derajat", "Sembilan puluh derajat"], "a": 0, "x": "Sudut ini menghasilkan jarak lemparan paling jauh."}, {"s": "Sikap badan saat bersiap melempar adalah...", "o": ["Menyamping", "Membelakangi sasaran", "Duduk"], "a": 0, "x": "Sikap menyamping memberi ruang tarikan lengan yang panjang."}, {"s": "Kaki yang berada di depan adalah kaki yang...", "o": ["Berlawanan dengan tangan pelempar", "Sama dengan tangan pelempar", "Bebas"], "a": 0, "x": "Kaki berlawanan menjaga keseimbangan saat berat badan dipindahkan."}, {"s": "Melempar boleh dilakukan...", "o": ["Setelah aba-aba guru", "Kapan saja", "Saat teman mengambil alat"], "a": 0, "x": "Aturan aba-aba mencegah siswa terkena lemparan."}, {"s": "Pengambilan turbo dilakukan...", "o": ["Bersama-sama setelah semua melempar", "Satu per satu sambil yang lain melempar", "Sebelum aba-aba"], "a": 0, "x": "Tidak boleh ada siswa di daerah lemparan saat yang lain melempar."}, {"s": "Saat melempar, berat badan dipindahkan ke...", "o": ["Kaki depan", "Kaki belakang", "Kedua tumit"], "a": 0, "x": "Perpindahan berat badan menambah tenaga lemparan."}, {"s": "Otot yang paling banyak bekerja saat melempar turbo adalah otot...", "o": ["Lengan dan bahu", "Betis", "Jari kaki"], "a": 0, "x": "Gerakan melempar bertumpu pada rangkaian otot lengan dan bahu."}, {"s": "Lemparan dinyatakan tidak sah apabila...", "o": ["Pelempar melewati garis batas", "Turbo jatuh di zona bernilai", "Lemparan terlalu tinggi"], "a": 0, "x": "Menjaga keseimbangan setelah melempar mencegah pelanggaran garis."}], "g": {"alat": ["Turbo atau peluru roket busa", "Kerucut penanda zona", "Meteran", "Kapur garis batas", "Peluit"], "pe": "Berbaris, berdoa, presensi, pemanasan menyeluruh dengan penekanan pada bahu, lengan, dan punggung (15 menit).", "in": "Guru menjelaskan aturan keselamatan dan mencontohkan lemparan. Siswa berlatih tanpa awalan lalu dengan awalan sederhana, dilanjutkan Lempar Zona Nilai (75 menit).", "pu": "Pendinginan peregangan lengan dan bahu, refleksi tentang keselamatan bersama, doa (15 menit).", "r": ["Ketepatan teknik memegang dan melempar", "Jarak dan arah lemparan", "Ketaatan pada aturan keselamatan"]}},
 {"j": "Senam Lantai: Rangkaian Guling Depan dan Guling Belakang", "e": "Aktivitas senam", "a": "guling-mundur", "ak": "Pada guling belakang, telapak tangan di samping telinga siap mendorong matras saat punggung menyentuh.", "t": ["Mempraktikkan guling depan dengan teknik yang benar.", "Mempraktikkan guling belakang dengan aman.", "Merangkai dua gerakan menjadi satu rangkaian sederhana."], "l": ["Guling depan diawali jongkok, dagu ke dada, tengkuk menyentuh matras.", "Berguling dengan badan membulat dan akhiri jongkok.", "Guling belakang diawali jongkok membelakangi arah gulingan.", "Letakkan kedua telapak tangan di samping telinga, ibu jari ke bahu.", "Guling ke belakang, dorong matras dengan kedua tangan hingga kembali jongkok."], "p": [{"n": "Rangkaian Berpasangan", "d": "Berpasangan menampilkan guling depan lalu guling belakang secara berurutan dan saling menilai."}, {"n": "Guling Estafet Kelompok", "d": "Kelompok bergantian melakukan rangkaian guling, dinilai kerapian bukan kecepatan."}], "k": [{"s": "Posisi telapak tangan saat guling belakang berada di...", "o": ["Samping telinga", "Depan perut", "Di belakang punggung"], "a": 0, "x": "Telapak di samping telinga siap mendorong matras."}, {"s": "Dagu dirapatkan ke dada bertujuan untuk...", "o": ["Melindungi leher", "Menambah kecepatan", "Menjaga pandangan"], "a": 0, "x": "Dagu rapat ke dada mencegah cedera leher."}, {"s": "Sikap akhir kedua gerakan guling adalah...", "o": ["Jongkok", "Telentang", "Berdiri satu kaki"], "a": 0, "x": "Guling depan maupun belakang diakhiri sikap jongkok."}, {"s": "Guling depan diawali dengan sikap...", "o": ["Jongkok", "Berdiri tegak", "Berbaring"], "a": 0, "x": "Guling depan diawali jongkok di ujung matras."}, {"s": "Bagian tubuh yang menyentuh matras lebih dulu pada guling depan adalah...", "o": ["Tengkuk", "Kepala bagian atas", "Punggung"], "a": 0, "x": "Dagu rapat ke dada agar tengkuk menyentuh matras lebih dulu."}, {"s": "Bentuk badan saat berguling sebaiknya...", "o": ["Membulat", "Lurus kaku", "Melengkung ke belakang"], "a": 0, "x": "Badan membulat membuat gulingan mengalir."}, {"s": "Guling belakang diawali jongkok dengan posisi...", "o": ["Membelakangi arah gulingan", "Menghadap arah gulingan", "Menyamping"], "a": 0, "x": "Jongkok membelakangi arah gulingan memudahkan jatuh ke belakang."}, {"s": "Ibu jari saat guling belakang mengarah ke...", "o": ["Bahu", "Lantai", "Lutut"], "a": 0, "x": "Ibu jari ke bahu menyiapkan dorongan tangan."}, {"s": "Dorongan tangan pada guling belakang berguna untuk...", "o": ["Membantu badan berputar penuh", "Menahan kepala", "Menambah kecepatan lari"], "a": 0, "x": "Dorongan tangan meringankan beban pada leher."}, {"s": "Kesalahan yang berbahaya saat berguling adalah...", "o": ["Dagu terangkat", "Badan membulat", "Tangan menempel matras"], "a": 0, "x": "Dagu terangkat membuat leher tertekan."}], "g": {"alat": ["Matras senam", "Peluit", "Lembar penilaian teman sebaya"], "pe": "Berbaris, berdoa, pemanasan khusus leher, punggung, dan pergelangan tangan (10 menit).", "in": "Demonstrasi kedua gulingan, latihan bertahap dengan bantuan, penyusunan rangkaian, penampilan berpasangan (55 menit).", "pu": "Pendinginan, umpan balik antarteman, doa (10 menit).", "r": ["Teknik guling depan", "Teknik guling belakang", "Kerapian rangkaian gerak"]}, "ml": "Pengertian\nGuling depan dan guling belakang adalah gerakan dasar senam lantai. Keduanya dilakukan dengan badan membulat dan berakhir pada sikap jongkok.\n\nManfaat\nMelatih kelenturan, kekuatan lengan, keseimbangan, keberanian, serta kemampuan merangkai gerak menjadi satu penampilan utuh.\n\nHal yang perlu diperhatikan\nPada guling belakang, kedua telapak tangan diletakkan di samping telinga dengan ibu jari mengarah ke bahu, siap mendorong matras. Dagu tetap rapat ke dada. Siswa dengan keluhan leher atau punggung diberi kegiatan alternatif."},
 {"j": "Gerak Berirama: Senam Kreasi dan SKJ", "e": "Aktivitas gerak berirama", "a": "ritmik", "ak": "Setiap rangkaian dilakukan berurutan: pemanasan, gerakan inti, lalu pendinginan mengikuti irama.", "ml": "Pengertian\nSenam kesegaran jasmani adalah rangkaian senam massal yang tersusun atas gerakan pemanasan, gerakan inti, dan pendinginan, dilakukan bersama mengikuti irama musik.\n\nManfaat\nMeningkatkan kebugaran menyeluruh, melatih kekompakan, disiplin, serta menjadi kegiatan rutin sekolah yang mudah dilakukan bersama.\n\nHal yang perlu diperhatikan\nBarisan diatur berjarak agar gerakan leluasa. Gerakan dipelajari bertahap per rangkaian, dan siswa yang sedang tidak sehat diberi kegiatan alternatif yang lebih ringan.", "t": ["Mempraktikkan rangkaian pemanasan, inti, dan pendinginan senam kesegaran jasmani.", "Menyelaraskan gerak dengan irama musik.", "Memimpin barisan senam secara bergantian."], "l": ["Barisan diatur berjarak dua langkah ke samping dan ke depan.", "Rangkaian pemanasan: gerakan kepala, bahu, lengan, dan pinggang 2x8 hitungan.", "Rangkaian inti: langkah, ayunan lengan, dan lompat ringan 4x8 hitungan.", "Jaga tempo tetap sama dengan aba-aba pemimpin barisan.", "Rangkaian pendinginan: peregangan dan pengaturan napas 2x8 hitungan."], "p": [{"n": "Pemimpin Bergilir", "d": "Setiap kelompok menunjuk satu siswa memimpin barisan senam secara bergantian."}, {"n": "Senam Bersama Antarkelas", "d": "Dua kelas melakukan senam bersama di lapangan, dinilai kekompakan tiap barisannya."}], "k": [{"s": "Urutan rangkaian senam kesegaran jasmani adalah...", "o": ["Pemanasan, inti, pendinginan", "Inti, pemanasan, pendinginan", "Pendinginan, inti, pemanasan"], "a": 0, "x": "Urutan ini menyiapkan tubuh, melatihnya, lalu memulihkannya."}, {"s": "Tujuan gerakan pendinginan adalah...", "o": ["Memulihkan denyut nadi secara bertahap", "Menambah kecepatan", "Menguras tenaga"], "a": 0, "x": "Pendinginan menurunkan denyut nadi perlahan agar tubuh pulih dengan nyaman."}, {"s": "Jarak barisan saat senam massal diatur agar...", "o": ["Gerakan leluasa dan tidak bertabrakan", "Terlihat penuh", "Lebih cepat selesai"], "a": 0, "x": "Jarak yang cukup membuat gerakan aman dan barisan terlihat rapi."}, {"s": "Jarak barisan saat senam kesegaran jasmani adalah...", "o": ["Dua langkah ke samping dan ke depan", "Rapat tanpa jarak", "Sepuluh langkah"], "a": 0, "x": "Jarak dua langkah mencegah benturan antarpeserta."}, {"s": "Rangkaian pemanasan berisi gerakan...", "o": ["Kepala, bahu, lengan, dan pinggang", "Lompat tinggi", "Lari cepat"], "a": 0, "x": "Pemanasan dimulai dari bagian atas tubuh menuju bawah."}, {"s": "Rangkaian pemanasan dilakukan sebanyak...", "o": ["2x8 hitungan", "8x8 hitungan", "1 hitungan"], "a": 0, "x": "Pemanasan pada materi ini 2x8 hitungan."}, {"s": "Rangkaian inti dilakukan sebanyak...", "o": ["4x8 hitungan", "1x8 hitungan", "10x8 hitungan"], "a": 0, "x": "Bagian inti berisi langkah, ayunan, dan lompat ringan 4x8 hitungan."}, {"s": "Tempo gerakan dijaga tetap sama mengikuti...", "o": ["Aba-aba pemimpin barisan", "Keinginan sendiri", "Suara penonton"], "a": 0, "x": "Aba-aba pemimpin menjaga keserempakan barisan."}, {"s": "Rangkaian pendinginan berisi...", "o": ["Peregangan dan pengaturan napas", "Lari cepat", "Lompat jauh"], "a": 0, "x": "Pendinginan menurunkan denyut nadi secara bertahap."}, {"s": "Urutan senam kesegaran jasmani yang benar adalah...", "o": ["Pemanasan, inti, pendinginan", "Inti, pemanasan, pendinginan", "Pendinginan, inti, pemanasan"], "a": 0, "x": "Urutan ini menjaga tubuh siap dan pulih dengan baik."}], "g": {"alat": ["Pemutar musik dan pengeras suara", "Peluit", "Lapangan sekolah"], "pe": "Berbaris dengan jarak dua langkah, berdoa, penjelasan rangkaian yang akan dipelajari (10 menit).", "in": "Latihan rangkaian pemanasan, inti, dan pendinginan secara bertahap, dilanjutkan Pemimpin Bergilir tiap kelompok (55 menit).", "pu": "Pengaturan napas, refleksi kekompakan barisan, doa (10 menit).", "r": ["Kebenaran rangkaian gerak", "Keserasian dengan irama", "Kekompakan dan kepemimpinan barisan"]}},
 {"j": "Kebugaran Jasmani dan Pola Hidup Sehat", "e": "Kebugaran jasmani", "a": "kuat", "ak": "Setiap pos tes dilakukan dengan gerak penuh dan tempo tetap agar hasil pengukuran sahih.", "t": ["Mempraktikkan tes kebugaran sederhana.", "Mencatat dan membaca hasil tes kebugaran sendiri.", "Menyusun kebiasaan hidup sehat harian."], "l": ["Lari 600 meter untuk mengukur daya tahan, catat waktunya.", "Sit up 30 detik untuk mengukur kekuatan otot perut.", "Push up 30 detik untuk mengukur kekuatan otot lengan.", "Lompat tanpa awalan untuk mengukur daya ledak tungkai.", "Catat semua hasil pada kartu kebugaran pribadi."], "p": [{"n": "Sirkuit Kebugaran 5 Pos", "d": "Lima pos tes dijalani bergantian, teman sekelompok bertugas mencatat hasil."}, {"n": "Papan Kebiasaan Sehat", "d": "Siswa menempel kartu kebiasaan sehat mingguan seperti tidur cukup, sarapan, dan berolahraga."}], "k": [{"s": "Tes yang mengukur daya tahan jantung dan paru adalah...", "o": ["Lari 600 meter", "Sit up", "Lompat tanpa awalan"], "a": 0, "x": "Lari jarak menengah mengukur daya tahan kardiorespirasi."}, {"s": "Sit up digunakan untuk mengukur kekuatan otot...", "o": ["Perut", "Lengan", "Leher"], "a": 0, "x": "Sit up mengukur kekuatan dan daya tahan otot perut."}, {"s": "Kebiasaan yang mendukung kebugaran adalah...", "o": ["Tidur cukup dan sarapan", "Begadang", "Jarang bergerak"], "a": 0, "x": "Istirahat cukup dan gizi seimbang menjaga kebugaran."}, {"s": "Lari 600 meter dipakai mengukur...", "o": ["Daya tahan", "Kelenturan", "Kelincahan"], "a": 0, "x": "Lari jarak menengah mengukur daya tahan jantung dan paru."}, {"s": "Sit up selama 30 detik mengukur kekuatan otot...", "o": ["Perut", "Lengan", "Tungkai"], "a": 0, "x": "Sit up mengukur kekuatan otot perut."}, {"s": "Push up selama 30 detik mengukur kekuatan otot...", "o": ["Lengan", "Perut", "Leher"], "a": 0, "x": "Push up mengukur kekuatan otot lengan dan bahu."}, {"s": "Lompat tanpa awalan mengukur...", "o": ["Daya ledak tungkai", "Kelenturan punggung", "Daya tahan"], "a": 0, "x": "Lompat tanpa awalan mengukur daya ledak otot tungkai."}, {"s": "Hasil seluruh tes sebaiknya...", "o": ["Dicatat pada kartu kebugaran", "Dihafal", "Diabaikan"], "a": 0, "x": "Catatan memudahkan membandingkan kemajuan."}, {"s": "Sebelum melakukan tes kebugaran, wajib...", "o": ["Pemanasan", "Makan kenyang", "Tidur"], "a": 0, "x": "Pemanasan menurunkan risiko cedera."}, {"s": "Kebugaran jasmani berguna untuk...", "o": ["Melakukan kegiatan harian tanpa lelah berlebihan", "Menambah berat badan", "Mempercepat pertumbuhan gigi"], "a": 0, "x": "Kebugaran membuat tubuh mampu beraktivitas tanpa kelelahan berarti."}], "g": {"alat": ["Stopwatch", "Meteran", "Matras", "Kartu kebugaran siswa", "Peluit"], "pe": "Berbaris, berdoa, penjelasan tujuan tes, pemanasan menyeluruh (10 menit).", "in": "Pelaksanaan sirkuit lima pos tes kebugaran secara bergantian dengan pencatatan hasil oleh teman (55 menit).", "pu": "Pendinginan, membaca hasil kartu kebugaran, menyusun rencana kebiasaan sehat, doa (10 menit).", "r": ["Kesungguhan mengikuti tes", "Ketepatan mencatat hasil", "Kesadaran pola hidup sehat"]}, "ml": "Pengertian\nKebugaran jasmani diukur melalui beberapa komponen, antara lain daya tahan jantung dan paru, kekuatan otot, kelenturan, dan daya ledak. Pengukuran dilakukan lewat tes sederhana yang dapat dikerjakan di sekolah.\n\nManfaat\nSiswa mengetahui kondisi tubuhnya sendiri, dapat menetapkan target perbaikan, serta terdorong membiasakan pola hidup sehat.\n\nHal yang perlu diperhatikan\nHasil tes dipakai untuk perbaikan diri, bukan untuk membandingkan atau mempermalukan siswa. Pemanasan wajib dilakukan sebelum tes, dan siswa yang sedang tidak sehat tidak dipaksa mengikuti."},
 {"j": "Pencegahan Cedera dan Pertolongan Pertama", "e": "Kebugaran dan kesehatan", "a": "sehat", "ak": "Cedera ringan ditangani dengan istirahat, kompres dingin, balut, dan tinggikan. Cedera berat selalu dilaporkan kepada guru.", "ml": "Pengertian\nCedera olahraga adalah kerusakan jaringan tubuh yang terjadi saat beraktivitas fisik. Cedera ringan yang sering dialami siswa adalah lecet, memar, dan terkilir. Pencegahan cedera adalah rangkaian kebiasaan yang menurunkan risiko tersebut.\n\nManfaat\nSiswa mampu menjaga keselamatan diri dan teman, mengenali tanda cedera, serta memberikan pertolongan pertama sederhana sebelum bantuan orang dewasa datang.\n\nHal yang perlu diperhatikan\nPertolongan pertama oleh siswa terbatas pada tindakan sederhana. Setiap cedera wajib dilaporkan kepada guru. Siswa tidak boleh memijat bagian yang terkilir atau meluruskan anggota badan yang dicurigai patah.", "t": ["Menyebutkan kebiasaan yang mencegah cedera saat berolahraga.", "Mempraktikkan pertolongan pertama sederhana pada cedera ringan.", "Menunjukkan kepedulian terhadap keselamatan diri dan teman."], "l": ["Cegah cedera dengan pemanasan yang cukup sebelum berolahraga.", "Gunakan pakaian dan alas kaki yang sesuai serta periksa lapangan dari benda berbahaya.", "Tingkatkan beban latihan secara bertahap, jangan langsung berat.", "Pada cedera ringan lakukan empat langkah: istirahatkan, kompres dingin, balut, dan tinggikan bagian yang cedera.", "Bersihkan luka lecet dengan air mengalir, lalu tutup dengan kain bersih.", "Laporkan setiap cedera kepada guru, dan jangan memijat bagian yang terkilir."], "p": [{"n": "Simulasi Pertolongan", "d": "Berpasangan, satu siswa berperan mengalami terkilir ringan, pasangannya mempraktikkan empat langkah penanganan dengan kain bersih."}, {"n": "Periksa Lapangan", "d": "Regu memeriksa lapangan dan mencatat benda atau keadaan yang berpotensi menyebabkan cedera, lalu melaporkannya kepada guru."}], "k": [{"s": "Kegiatan yang paling penting untuk mencegah cedera sebelum berolahraga adalah...", "o": ["Pemanasan", "Makan kenyang", "Mengobrol"], "a": 0, "x": "Pemanasan menyiapkan otot dan sendi menerima beban."}, {"s": "Empat langkah penanganan cedera ringan adalah...", "o": ["Istirahatkan, kompres dingin, balut, tinggikan", "Pijat, panaskan, tarik, gerakkan", "Diamkan, biarkan, lupakan, lanjutkan"], "a": 0, "x": "Rangkaian ini mengurangi pembengkakan dan nyeri."}, {"s": "Luka lecet sebaiknya dibersihkan dengan...", "o": ["Air mengalir", "Tanah", "Kain kotor"], "a": 0, "x": "Air mengalir mengangkat kotoran tanpa menambah kuman."}, {"s": "Bagian yang terkilir sebaiknya...", "o": ["Tidak dipijat", "Dipijat kuat", "Ditarik lurus"], "a": 0, "x": "Memijat bagian terkilir dapat memperparah pembengkakan."}, {"s": "Kompres yang digunakan pada cedera baru adalah kompres...", "o": ["Dingin", "Panas", "Hangat sekali"], "a": 0, "x": "Dingin menyempitkan pembuluh darah sehingga bengkak berkurang."}, {"s": "Peningkatan beban latihan sebaiknya dilakukan secara...", "o": ["Bertahap", "Langsung berat", "Tidak teratur"], "a": 0, "x": "Peningkatan bertahap memberi waktu tubuh menyesuaikan diri."}, {"s": "Setiap cedera yang dialami siswa wajib...", "o": ["Dilaporkan kepada guru", "Dirahasiakan", "Diobati sendiri sampai sembuh"], "a": 0, "x": "Guru dapat menilai apakah dibutuhkan penanganan lanjutan."}, {"s": "Sebelum bermain, lapangan perlu diperiksa dari...", "o": ["Batu, pecahan, dan genangan", "Jumlah penonton", "Arah matahari"], "a": 0, "x": "Benda berbahaya di lapangan adalah penyebab cedera yang mudah dicegah."}, {"s": "Anggota badan yang dicurigai patah sebaiknya...", "o": ["Tidak diluruskan dan segera ditangani orang dewasa", "Diluruskan sendiri", "Digerakkan berulang"], "a": 0, "x": "Meluruskan tulang yang patah dapat menambah kerusakan."}, {"s": "Bagian tubuh yang cedera ditinggikan supaya...", "o": ["Bengkak berkurang", "Terasa hangat", "Cepat digerakkan"], "a": 0, "x": "Posisi lebih tinggi memperlancar aliran darah kembali dan menurunkan bengkak."}], "g": {"alat": ["Kain bersih atau perban", "Kantong es atau air dingin", "Kotak pertolongan pertama sekolah", "Kartu peran simulasi"], "pe": "Berbaris, berdoa, presensi, tanya jawab pengalaman cedera yang pernah dialami siswa (15 menit).", "in": "Guru menjelaskan pencegahan cedera dan empat langkah penanganan, mendemonstrasikan pembalutan sederhana, siswa berlatih berpasangan lewat Simulasi Pertolongan, dilanjutkan Periksa Lapangan (75 menit).", "pu": "Menyimpulkan kebiasaan aman berolahraga, menempel poster hasil pemeriksaan lapangan, doa (15 menit).", "r": ["Pengetahuan pencegahan cedera", "Ketepatan langkah pertolongan pertama", "Kepedulian terhadap keselamatan teman"]}}

function bukaDB(){
  return new Promise((ok,gagal)=>{
    if(!window.indexedDB) return gagal();
    const r = indexedDB.open("moveadventure",1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("data");
    r.onsuccess = ()=> ok(r.result);
    r.onerror = ()=> gagal(r.error);
  });
}

async function simpanData(){

    await new Promise((ok,gagal)=>{
      const t = db.transaction("data","readwrite");
      t.objectStore("data").put(isi,"aplikasi");
      t.oncomplete = ok; t.onerror = ()=>gagal(t.error);
    });
    CARA_SIMPAN = "perangkat"; return true;
  }catch(e){
    try{ localStorage.setItem("moveadventure.data", JSON.stringify(isi)); CARA_SIMPAN="perangkat"; return true; }

  }
}

function migrasiSemua(){
  const peta = {};
  for(let k=1;k<=6;k++){
    const n = (DATA[k]||[]).length + ((S.tambahan[k]||[]).length);
    for(let i=0;i<n;i++) peta[`${k}-${i}`] = kodeMateri(k,i);
  }
  const pindah = obj => Object.keys(obj).forEach(kunci=>{
    const baru = peta[kunci];
    if(baru && baru !== kunci){ if(obj[baru] === undefined) obj[baru] = obj[kunci]; delete obj[kunci]; }
  });
  pindah(S.gambar); pindah(S.video); pindah(S.sunting);
  const pindahProgres = pr => Object.keys(pr).forEach(kunci=>{
    const baru = peta[kunci];
    if(baru){ const b = baru + "-P1"; if(pr[b] === undefined) pr[b] = pr[kunci]; delete pr[kunci]; }
  });
  pindahProgres(S.progres);
  Object.values(S.akun).forEach(a=>{ if(a.progres) pindahProgres(a.progres); });
  Object.keys(S.rekor).forEach(kunci=>{
    const c = kunci.match(/^(\d+-\d+)-(.+)$/);
    if(c && peta[c[1]]){ S.rekor[`${peta[c[1]]}-P1-${c[2]}`] = S.rekor[kunci]; delete S.rekor[kunci]; }
  });
}
function jadikanKotak(berkas, ukuran){
  return new Promise(ok=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const c = document.createElement("canvas");
        c.width = c.height = ukuran;
        const ctx = c.getContext("2d");
        const skala = Math.min(ukuran/img.width, ukuran/img.height);
        const w = img.width*skala, h = img.height*skala;
        ctx.drawImage(img, (ukuran-w)/2, (ukuran-h)/2, w, h);
        /* Logo disimpan di dalam berkas aplikasi, jadi ukurannya ditekan:
           PNG dipakai bila kecil, selebihnya JPEG di atas alas putih. */
        try{
          const png = c.toDataURL("image/png");
          if(png.length < 120000){ ok(png); return; }
          const c2 = document.createElement("canvas");
          c2.width = c2.height = ukuran;
          const x2 = c2.getContext("2d");
          x2.fillStyle = "#FFFFFF"; x2.fillRect(0,0,ukuran,ukuran);
          x2.drawImage(c, 0, 0);
          const jpg = c2.toDataURL("image/jpeg", 0.85);
          ok(jpg.length < png.length ? jpg : png);
        }catch(e){ ok(null); }
      };
      img.onerror = ()=> ok(null);
      img.src = r.result;
    };
    r.onerror = ()=> ok(null);
    r.readAsDataURL(berkas);
  });
}
function kecilkan(berkas){
  return new Promise(ok=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maks = 1200; let w = img.width, h = img.height;
        if(w>maks){ h = Math.round(h*maks/w); w = maks; }
        if(h>maks){ w = Math.round(w*maks/h); h = maks; }
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        try{ ok(c.toDataURL("image/jpeg",0.78)); }catch(e){ ok(r.result); }
      };
      img.onerror = ()=> ok(r.result);
      img.src = r.result;
    };
    r.onerror = ()=> ok(null);
    r.readAsDataURL(berkas);
  });
}

  const h = await ambilKonten(false);
  if(h && h.baru){ pasangNamaApp(); render(); }
}
function waktuVersi(v){
  if(!v) return "belum pernah";
  const d = new Date(Number(v));
  return isNaN(d.getTime()) ? "-" : d.toLocaleString("id-ID", {dateStyle:"medium", timeStyle:"short"});
}

async function kirimAntrian(){
  if(!S.server || !S.antrian.length) return;
  const sisa = [];
  for(const d of S.antrian){ if(!(await kirimSatu(d))) sisa.push(d); }
  const berubah = sisa.length !== S.antrian.length;
  S.antrian = sisa;
  if(berubah) await simpanData();
}
async function ambilHasilServer(){
  if(!S.server) return {ok:false, pesan:"Alamat server belum diisi."};
  if(!S.kodeKelas || !S.kodeGuru) return {ok:false, pesan:"Kode kelas dan kode guru belum lengkap."};
  try{
    const r = await fetch(S.server + (S.server.includes("?")?"&":"?") + "aksi=daftar" +
                          "&kode=" + encodeURIComponent(S.kodeKelas) +
                          "&guru=" + encodeURIComponent(S.kodeGuru));
    const j = await r.json();
    if(j && j.ok === false) return {ok:false, pesan: j.pesan || "Kode guru ditolak server."};
    if(!j || !j.hasil) return {ok:false, pesan:"Balasan server tidak dikenali."};
    S.hasilServer = j.hasil;
    return {ok:true, jumlah:j.hasil.length};
  }catch(e){ return {ok:false, pesan:"Gagal menghubungi server. Periksa alamat dan koneksi internet."}; }
}
async function daftarkanKode(kodeKelas, kodeGuru){
  if(!S.server) return {ok:true, luring:true};
  try{
    const r = await fetch(S.server, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({aksi:"daftarkode", kodeKelas, kodeGuru})});
    const j = await r.json();
    return j && j.ok ? {ok:true} : {ok:false, pesan: j && j.pesan==="terpakai" ? "Kode kelas itu sudah dipakai guru lain. Coba buat lagi." : "Server menolak pendaftaran kode."};
  }catch(e){ return {ok:false, pesan:"Gagal menghubungi server saat mendaftarkan kode."}; }
}
async function cekKodeGuru(kodeKelas, kodeGuru){
  if(!S.server) return {ok:false, pesan:"Alamat server belum diisi."};
  try{
    const r = await fetch(S.server + (S.server.includes("?")?"&":"?") + "aksi=cek" +
                          "&kode=" + encodeURIComponent(kodeKelas) + "&guru=" + encodeURIComponent(kodeGuru));
    const j = await r.json();
    return j && j.ok ? {ok:true} : {ok:false, pesan:"Kode kelas dan kode guru tidak cocok."};
  }catch(e){ return {ok:false, pesan:"Gagal menghubungi server."}; }
}

  var sh = lembar('Kode');
  if(sh.getLastRow() < 2) return false;
  var data = sh.getRange(2, 1, sh.getLastRow()-1, 2).getValues();
  for(var i = 0; i < data.length; i++){
    if(String(data[i][0]) === String(kodeKelas) && String(data[i][1]) === String(kodeGuru)) return true;
  }
  return false;
}

}

      for(var q = 0; q < tot; q++){
        shb.appendRow([new Date(), d.kodeKelas, d.nama, d.kelas, d.kode, d.materi, d.catatan || '', q + 1, tot, f.substr(q * pj, pj)]);

function doGet(e){
  var p = e && e.parameter ? e.parameter : {};

  if(p.aksi === 'cek'){
    return jawab({ok: cekGuru(p.kode, p.guru)});
  }

  if(p.aksi === 'gambar'){
    var shg = lembar('Gambar');
    if(shg.getLastRow() < 2) return jawab({ok:true, versi:0, gambar:[]});
    var dg = shg.getRange(2, 1, shg.getLastRow()-1, 7).getValues();
    var kump = {}, versiG = 0;
    for(var i = 0; i < dg.length; i++){
      if(String(dg[i][0]) !== String(p.kode)) continue;
      if(String(dg[i][1]) !== String(p.materi)) continue;
      versiG = Number(dg[i][3]) || versiG;
      var ix = Number(dg[i][2]) || 0;
      if(!kump[ix]) kump[ix] = [];
      kump[ix].push({b:Number(dg[i][4]) || 1, isi:String(dg[i][6] || '')});
    }
    var keluar = [];
    var urut = Object.keys(kump).sort(function(a,b){ return Number(a) - Number(b); });
    for(var u = 0; u < urut.length; u++){
      var bagi = kump[urut[u]];
      bagi.sort(function(a,b){ return a.b - b.b; });
      var satu = '';
      for(var z = 0; z < bagi.length; z++) satu += bagi[z].isi;
      if(satu) keluar.push(satu);
    }
    return jawab({ok:true, versi:versiG, gambar:keluar});
  }

  if(p.aksi === 'bukti'){
    if(!cekGuru(p.kode, p.guru)) return jawab({ok:false, pesan:'Kode guru salah.'});
    var shb = lembar('Bukti');
    if(shb.getLastRow() < 2) return jawab({ok:true, daftar:[]});
    var db = shb.getRange(2, 1, shb.getLastRow()-1, 10).getValues();
    var peta = {};
    for(var i = 0; i < db.length; i++){
      if(String(db[i][1]) !== String(p.kode)) continue;
      if(p.materi && String(db[i][4]) !== String(p.materi)) continue;
      var kunci = db[i][2] + '|' + db[i][4];
      if(!peta[kunci]) peta[kunci] = {waktu:String(db[i][0]).slice(0,24), nama:db[i][2], kelas:db[i][3],
                                      kode:db[i][4], materi:db[i][5], catatan:db[i][6], bagian:[]};
      peta[kunci].bagian.push({b:Number(db[i][7]) || 1, isi:String(db[i][9] || '')});
    }
    var daftar = [];
    for(var k in peta){
      var x = peta[k];
      x.bagian.sort(function(a,b){ return a.b - b.b; });
      var foto = '';
      for(var z = 0; z < x.bagian.length; z++) foto += x.bagian[z].isi;
      daftar.push({waktu:x.waktu, nama:x.nama, kelas:x.kelas, kode:x.kode,
                   materi:x.materi, catatan:x.catatan, foto:foto});
    }
    return jawab({ok:true, daftar:daftar});
  }

  if(p.aksi === 'konten'){
    var shk = lembar('Konten');
    if(shk.getLastRow() < 2) return jawab({ok:true, versi:0, isi:''});
    var dk = shk.getRange(2, 1, shk.getLastRow()-1, 5).getValues();
    var bag = [], versi = 0;
    for(var i = 0; i < dk.length; i++){
      if(String(dk[i][0]) !== String(p.kode)) continue;
      versi = Number(dk[i][1]) || versi;
      bag.push({b: Number(dk[i][2]) || 1, isi: String(dk[i][4])});
    }
    if(!bag.length) return jawab({ok:true, versi:0, isi:''});
    bag.sort(function(a,b){ return a.b - b.b; });
    var gabung = '';
    for(var k = 0; k < bag.length; k++) gabung += bag[k].isi;
    return jawab({ok:true, versi:versi, isi:gabung});
  }

  if(p.aksi === 'daftar'){
    if(!cekGuru(p.kode, p.guru)) return jawab({ok:false, pesan:'Kode guru salah.'});
    var sh = lembar('Nilai');
    var hasil = [];
    if(sh.getLastRow() > 1){
      var lebar = Math.max(10, sh.getLastColumn());
      var data = sh.getRange(2, 1, sh.getLastRow()-1, lebar).getValues();
      for(var i = 0; i < data.length; i++){
        if(String(data[i][1]) !== String(p.kode)) continue;
        hasil.push({
          waktu: String(data[i][0]).slice(0,24), kodeKelas: data[i][1],
          nama: data[i][2], kelas: data[i][3],
          materi: data[i][4], kelasMateri: data[i][5],
          benar: data[i][6], total: data[i][7], nilai: data[i][8], perangkat: data[i][9],
          kode: data[i][10] || '', pertemuan: data[i][11] || 1
        });
      }
    }
    return jawab({ok:true, hasil:hasil});
  }

  return jawab({ok:true, pesan:'Server nilai Move Adventure siap.'});
}`;

function idAkun(){ return "s" + Date.now().toString(36) + Math.floor(Math.random()*999).toString(36); }
function nilaiDari(v){ return typeof v==="number" ? v : (v && v.n) || 0; }
function akunAktif(){ return S.siswaAktif ? S.akun[S.siswaAktif] : null; }
function progresAktif(){ const a = akunAktif(); return a ? (a.progres = a.progres||{}) : S.progres; }
function buatKodeKelas(){
  const huruf = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let k = "";
  for(let i=0;i<6;i++) k += huruf[Math.floor(Math.random()*huruf.length)];
  return k;
}

}

    const isi = document.createElement("div");

    isi.style.marginTop = "8px";
    isi.innerHTML = `<span>Pindah ke kelas berapa?</span>

  };
}

    <p class="catatan" style="margin:0 0 10px">${S.kodeKelas
      ? "Bagikan tautan ini kepada siswa. Kode kelas sudah menempel di dalamnya, jadi siswa tidak perlu mengetik apa pun."
      : "Buat kode lebih dulu agar tautannya membawa kode dan nilai siswamu tidak tercampur dengan guru lain."}</p>

  </div>`;
  return h;
}

/* ---------- nilai siswa per kelas, dibuka dengan kode guru ---------- */
function panelNilaiKelas(){
  let h = `<div class="progres" style="margin-top:14px">
    <div class="baris"><span class="catatan">Nilai siswa kelas ${S.kelas}</span></div>`;
  if(!S.server){
    h += `<p class="catatan" style="margin:0">Alamat server belum diisi, jadi nilai siswa dari rumah belum bisa ditampilkan. Isi di tab Alat Bantu.</p></div>`;
    return h;
  }
  if(!S.kodeKelas){
    h += `<p class="catatan" style="margin:0">Buat kode kelas lebih dulu di bagian atas halaman ini.</p></div>`;
    return h;
  }
  if(!S.bukaNilai){
    h += `<p class="catatan" style="margin:0 0 10px">Masukkan kode guru untuk membuka nilai siswa. Ini menjaga agar siswa tidak bisa melihat nilai temannya.</p>
      <div class="isian"><input id="kodebuka" type="password" placeholder="Kode guru" autocomplete="off" maxlength="12">
        <button class="tombol" id="bukanilai">Buka nilai</button></div>
      <p class="catatan" id="pesanbuka" style="margin:8px 0 0"></p></div>`;
    return h;
  }
  const data = (S.hasilServer||[]).filter(x=>String(x.kelas)===String(S.kelas));
  const peta = {};
  data.forEach(x=>{
    const k = String(x.nama).trim().toLowerCase();
    (peta[k] = peta[k] || {nama:String(x.nama).trim(), materi:{}}).materi[x.materi] =
      Math.max(peta[k].materi[x.materi]||0, Number(x.nilai)||0);
  });
  const siswa = Object.values(peta).sort((a,b)=>a.nama.localeCompare(b.nama));
  h += `<div class="kendali" style="margin-top:0"><button id="muatnilai">Muat ulang</button>
        <button id="tutupnilai">Tutup nilai</button></div>`;
  if(siswa.length===0){
    h += `<p class="catatan">Belum ada siswa kelas ${S.kelas} yang mengirim nilai lewat tautanmu.</p>`;
  } else {
    h += `<div class="gulir"><table><thead><tr><th>Nama</th><th>Materi dikerjakan</th><th>Rata-rata</th></tr></thead><tbody>`;
    siswa.forEach(sw=>{
      const nilai = Object.values(sw.materi);
      const rata = Math.round(nilai.reduce((a,b)=>a+b,0)/nilai.length);
      h += `<tr><td>${esc(sw.nama)}</td><td>${nilai.length} dari ${jumlahMateriKelas(S.kelas)}</td><td class="nilai">${rata}</td></tr>`;
      Object.entries(sw.materi).forEach(([nm,nl])=>{
        h += `<tr style="background:var(--kapur)"><td colspan="2" style="padding-left:18px;font-size:13px">${esc(nm)}</td>
          <td style="font-size:13px">${nl}</td></tr>`;
      });
    });
    h += `</tbody></table></div>
      <p class="catatan">${siswa.length} siswa kelas ${S.kelas}. Rincian per soal dan pemeriksaan pengiriman ganda ada di tab Penilaian tiap materi.</p>`;
  }
  return h + `<p class="catatan" id="pesanbuka" style="margin:8px 0 0"></p></div>`;
}
function pasangNilaiKelas(){
  const bn = document.getElementById("bukanilai");
  if(bn) bn.onclick = async ()=>{
    const kabar = document.getElementById("pesanbuka");
    const kg = document.getElementById("kodebuka").value.trim().toUpperCase();
    if(!kg){ kabar.textContent = "Isi kode guru dulu."; return; }
    if(S.kodeGuru && kg !== S.kodeGuru){ kabar.textContent = "Kode guru salah."; return; }
    kabar.textContent = "Membuka nilai...";
    S.kodeGuru = kg;
    const r = await ambilHasilServer();
    if(!r.ok){ kabar.textContent = r.pesan; return; }
    S.bukaNilai = true; tampilBeranda();
  };
  const mn = document.getElementById("muatnilai");
  if(mn) mn.onclick = async ()=>{
    const kabar = document.getElementById("pesanbuka");
    kabar.textContent = "Memuat...";
    const r = await ambilHasilServer();
    if(!r.ok){ kabar.textContent = r.pesan; return; }
    tampilBeranda();
  };
  const tn = document.getElementById("tutupnilai");
  if(tn) tn.onclick = ()=>{ S.bukaNilai = false; S.hasilServer = null; tampilBeranda(); };
}

/* ---------- beranda ---------- */
function tampilBeranda(){
  const total = jumlahMateriKelas(S.kelas || 1);
  const selesai = Object.keys(progresAktif()).length;
  const sapa = S.peran==="siswa"
    ? "Pilih pelajaran yang ingin kamu pelajari hari ini."
    : "Pilih pelajaran untuk membuka modul ajar, alur kegiatan, lembar penilaian, dan alat bantu mengajar.";
  let h = barisAkun() + `<p class="eyebrow">${S.peran==="siswa"?"Menu siswa":"Menu guru"}</p>

    <p class="catatan">${sapa}</p>
    <input class="cari" id="cari" placeholder="Cari materi, misal: lompat, voli, kebugaran" value="${esc(S.cari)}" autocomplete="off">`;

    const hasil = [];
    const kel = S.kelas || 1;

    });

    hasil.forEach(r=> h += kartuMateri(r.m,r.k,r.i));
  } else {
    if(S.adaPembaruan) h += `<div class="main" style="border-color:var(--lintasan);background:#FFF3ED"><b>Versi baru tersedia</b>Tutup lalu buka kembali aplikasi ini untuk memakai versi terbaru.</div>`;
    if(S.peran==="guru") h += tombolCP() + panelSiswaGuru();
    if(S.peran==="siswa"){
      h += `<div class="progres"><div class="baris"><span class="catatan">Progres belajarmu</span><b>${selesai}/${total}</b></div>
        <div class="bar"><span style="width:${Math.round(selesai/total*100)}%"></span></div></div>`;
    }
    const akun = akunAktif();
    const kunciKelas = S.peran==="siswa" && akun && akun.kelas && !S.lihatKelasLain;
    if(kunciKelas){
      S.kelas = akun.kelas;
      h += `<p class="eyebrow">Pelajaran untuk kelas ${S.kelas}</p>`;
    } else {
      h += `<p class="eyebrow">Pilih kelas</p><div class="kelas-baris">`;
      for(let i=1;i<=6;i++) h += `<button class="nomor" aria-pressed="${S.kelas===i}" data-kelas="${i}">${i}<small>Kelas</small></button>`;
      h += `</div>`;
      if(S.peran==="siswa" && akun && akun.kelas){
        h += `<p style="margin:12px 0 0"><button class="tombol garis" id="balikkelas">Kembali ke kelas ${akun.kelas}</button></p>`;
      }
    }
    if(S.kelas){
      h += `<div class="fase"><b>${FASE[S.kelas].f}</b>${FASE[S.kelas].d}</div>`;
      const semua = daftarMateri(S.kelas).map((m,i)=>({m:materiAktif(S.kelas,i), i}));
      if(semua.length===0) h += `<p class="catatan">Belum ada pelajaran.</p>`;
      semua.forEach(x=> h += kartuMateri(x.m, S.kelas, x.i));
      if(S.peran==="guru"){
        h += `<p style="margin:0 0 18px"><button class="tombol garis" data-tambahmateri="1">+ Tambah pelajaran</button></p>`;
      }
      if(S.peran==="guru") h += panelNilaiKelas();
      const akun2 = akunAktif();
      if(S.peran==="siswa" && akun2 && akun2.kelas && !S.lihatKelasLain){
        h += `<p style="margin:14px 0 0"><button class="tombol garis" id="kelaslain">Lihat materi kelas lain</button></p>`;
      }

  h += `<footer>Move Adventure · Media belajar PJOK untuk kelas 1–6 · UPT SPF SDN Rappocini</footer>`;

  const kl2 = document.getElementById("kelaslain");
  if(kl2) kl2.onclick = ()=>{ S.lihatKelasLain = true; tampilBeranda(); };

  if(bk2) bk2.onclick = ()=>{ S.lihatKelasLain = false; S.kelas = akunAktif().kelas; tampilBeranda(); };
  pasangPanelSiswa();
  const ga = document.getElementById("gantiakun");
  if(ga) ga.onclick = ()=>{ S.siswaAktif=null; S.kelas=null; S.materi=null; render(); };
  pasangGantiKelas();
  const c = document.getElementById("cari");
  c.oninput = ()=>{ S.cari=c.value; const pos=c.selectionStart; tampilBeranda();

  isi.querySelectorAll("[data-kelas]").forEach(b=>b.onclick=()=>{ S.kelas=Number(b.dataset.kelas); tampilBeranda(); });
  isi.querySelectorAll("[data-tambahmateri]").forEach(b=>b.onclick=async ()=>{
    const sm = Number(b.dataset.tambahmateri);
    (S.tambahan[S.kelas] = S.tambahan[S.kelas] || []).push(templatMateri(sm));
    await simpanData();
    S.materi = daftarMateri(S.kelas).length - 1; S.temuKe = 1; S.tab = 0; S.ubah = true; render();
  });

    const [k,i]=b.dataset.buka.split("-").map(Number);

  });
}
function kartuMateri(m,k,i){
  const kode = kodeMateri(k,i);
  const sudah = progresAktif()[`${kode}-P1`] !== undefined;
  const lencana = (S.peran==="siswa" && sudah) ? `<span class="lencana">Selesai</span>` : "";
  return `<button class="kartu" data-buka="${k}-${i}">
    <span class="kartu-teks"><span class="el">Pelajaran ${i+1} · ${esc(m.e)}</span>
      <span class="jd">${esc(m.j)}</span></span>
    ${lencana}<span class="panah">›</span></button>`;
}

/* ---------- materi gabungan: bawaan + suntingan guru ---------- */
function daftarMateri(k){ return (DATA[k]||[]).concat(S.tambahan[k]||[]); }
function jumlahMateriKelas(k){ return daftarMateri(k).length; }
function soalMateri(k, i, dasar){ return dasar; }

function teksLengkap(k,i){ return MATERI_LENGKAP[`${k}-${i}`] || MATERI_LENGKAP[`1-${i}`] || ""; }
function materiAktif(k,i){
  const dasar = daftarMateri(k)[i];
  if(!dasar) return null;
  const asli = {...dasar, ml: dasar.ml || teksLengkap(k,i),
                k: soalMateri(k, i, dasar.k || [])};
  const ubah = S.sunting[kodeMateri(k,i)];
  if(!ubah) return asli;
  const gab = {...asli, ...ubah, g:{...asli.g, ...(ubah.g||{})}};
  // suntingan yang rusak atau berasal dari aplikasi lain tidak boleh mematikan halaman
  ["t","l","k","p"].forEach(f=>{ if(!Array.isArray(gab[f])) gab[f] = asli[f] || []; });
  ["alat","r"].forEach(f=>{ if(!Array.isArray(gab.g[f])) gab.g[f] = asli.g[f] || []; });
  if(typeof gab.j !== "string" || !gab.j.trim()) gab.j = asli.j;
  return gab;
}
function materiTambahan(k,i){ return i >= DATA[k].length; }
function templatMateri(sem){
  return {id:"T"+Math.random().toString(36).slice(2,7).toUpperCase(),
    j:"Materi baru", e:"Elemen pembelajaran", a:"lari", sem,
    ak:"Tuliskan penekanan teknik gerak di sini.",
    t:["Tujuan pembelajaran pertama."],
    l:["Langkah gerak pertama."],
    ml:"Pengertian\nTuliskan penjelasan materi di sini.\n\nManfaat\nTuliskan manfaatnya.\n\nHal yang perlu diperhatikan\nTuliskan catatan keselamatan dan kesalahan umum.",
    p:[{n:"Nama permainan", d:"Penjelasan permainan."}],
    k:[{s:"Pertanyaan pertama?", o:["Pilihan A","Pilihan B","Pilihan C"], a:0, x:"Penjelasan jawaban benar."}],
    g:{alat:["Peluit"],
       pe:"Berbaris, berdoa, presensi, dan pemanasan.",
       in:"Tuliskan kegiatan inti pembelajaran.",
       pu:"Pendinginan, refleksi, dan doa penutup.",
       r:["Aspek penilaian pertama","Aspek penilaian kedua"]}};
}
function adaSuntingan(k,i){ return !!S.sunting[kodeMateri(k,i)]; }
function simpanSunting(bagian, sasaran){
  const k = kunciMateri();
  if(sasaran === "temu" && S.temuKe) return simpanTemu(k, S.temuKe, bagian);
  if(materiTambahan(S.kelas,S.materi)){
    const posisi = S.materi - DATA[S.kelas].length;
    const lama = S.tambahan[S.kelas][posisi];
    S.tambahan[S.kelas][posisi] = {...lama, ...bagian, g:{...lama.g, ...(bagian.g||{})}};
    return simpanData();
  }
  const lama = S.sunting[k] || {};
  const gabung = {...lama, ...bagian, g:{...(lama.g||{}), ...(bagian.g||{})}};
  if(!Object.keys(gabung.g).length) delete gabung.g;
  S.sunting[k] = gabung;
  return simpanData();
}
function baris(t){ return String(t||"").split("\n").map(x=>x.trim()).filter(Boolean); }
function isiKolom(nilai){ return esc(Array.isArray(nilai) ? nilai.join("\n") : (nilai||"")); }
/* ---------- halaman materi ---------- */
function tampilMateri(){
  const m = temuAktif(S.kelas,S.materi,S.temuKe);
  const tabs = TAB[S.peran].map(x=>x[1]);
  if(S.tab >= tabs.length) S.tab = 0;
  let h = barisAkun() + `<button class="balik" id="balik">‹ Kembali ke daftar materi</button>
    <p class="eyebrow">${esc(m.e)}</p>
    <div class="judul-baris">
      <h2 id="judulmateri">${esc(m.j)}</h2>
      ${S.peran==="guru"?`<button class="pensil" id="ubahnamamateri" title="Ganti nama materi" aria-label="Ganti nama materi">✎</button>`:""}
    </div>
    <p class="catatan">${esc(m.ak)}</p>
    <div class="tab" role="group" aria-label="Bagian materi">`;
  tabs.forEach((t,i)=> h += `<button data-tab="${i}" aria-pressed="${S.tab===i}">${t}</button>`);
  h += `</div><div class="panel" id="panel"></div>`;
  isi.innerHTML = h;
  document.getElementById("balik").onclick = ()=>{ S.materi=null; S.ubah=false; S.draftKuis=null; hentikanJam(); render(); };
  const ga2 = document.getElementById("gantiakun");
  if(ga2) ga2.onclick = ()=>{ S.siswaAktif=null; S.kelas=null; S.materi=null; S.temuKe=null; render(); };
  const unt = document.getElementById("ubahnamamateri");
  if(unt) unt.onclick = ()=> ubahNamaMateri(m);
  pasangGantiKelas();
  isi.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
    S.tab=Number(b.dataset.tab); S.ubah=false; S.draftKuis=null; hentikanJam();
    isi.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-pressed", Number(x.dataset.tab)===S.tab));
    panel();
  });
  panel();
}

function kunciMateri(){ return kodeMateri(S.kelas,S.materi); }
function daftarGambar(){
  const k = kunciMateri(), lama = kunciLama(S.kelas,S.materi);
  return ((GAMBAR[k]||GAMBAR[lama]||[])).map(src=>({src,tetap:true}))
    .concat((S.gambar[k]||[]).map(src=>({src,tetap:false})));
}
function blokPeraga(m){
  const foto = daftarGambar();
  if(S.fotoAktif >= foto.length) S.fotoAktif = 0;

  let h = "";
  if(foto.length){
    h += `<div class="panggung"><img class="foto" src="${foto[S.fotoAktif].src}" alt="Peragaan gerak ${esc(m.j)}">
      <p class="keterangan">${esc(m.ak)}</p></div>`;
    if(foto.length>1){
      h += `<div class="mini" role="group" aria-label="Pilih gambar">` +
        foto.map((f,i)=>`<button data-foto="${i}" aria-pressed="${S.fotoAktif===i}"><img src="${f.src}" alt="Gambar ${i+1}"></button>`).join("") + `</div>`;
    }
  } else {
    h += `<div class="kosong-gambar">
      <b>Belum ada gambar peragaan</b>
      <span>${S.peran==="guru"

function tampilMateriLengkap(m){
  if(!m.ml.trim()) return `<p class="catatan">Materi lengkap belum diisi untuk bagian ini.</p>`;
  return m.ml.split(/\n\s*\n/).map(bagian=>{
    const baris2 = bagian.split("\n");
    let h = "";
    baris2.forEach((b,i)=>{
      const t = b.trim(); if(!t) return;
      if(i===0 && t.length<60 && !/[.!?]$/.test(t)) h += `<h3${h?"":' style="margin-top:0"'}>${esc(t)}</h3>`;
      else h += `<p>${esc(t)}</p>`;
    });
    return h;
  }).join("");
}

/* =======================================================================
   KODE TETAP & PERTEMUAN
   Kode materi tidak berubah walaupun urutan materi digeser atau namanya
   diganti, sehingga nilai siswa tetap tertaut ke materi yang benar.
   ======================================================================= */
const JML_TEMU_BAWAAN = 1;

function kodeMateri(k,i){
  const jmlBawaan = DATA[k] ? DATA[k].length : 0;
  if(i < jmlBawaan) return `K${k}-M${String(i+1).padStart(2,"0")}`;
  const t = (S.tambahan[k]||[])[i - jmlBawaan];
  if(!t) return `K${k}-M??`;
  if(!t.id) t.id = "T" + Math.random().toString(36).slice(2,7).toUpperCase();
  return `K${k}-${t.id}`;
}
function kunciLama(k,i){ return `${k}-${i}`; }

/* ---------- jumlah & isi pertemuan ---------- */
function dataTemu(kode){ return S.temuData[kode] || {jml:JML_TEMU_BAWAAN, list:{}}; }
function jumlahTemu(kode){ return 1; }
function judulTemuBawaan(n,jml){
  if(n === jml) return "Penerapan dan penilaian";
  if(n === 1) return "Mengenal gerak dasar";
  if(n === 2) return "Melatih gerak lanjutan";
  if(n === 3) return "Merangkai dan memvariasikan";
  return "Memperdalam variasi gerak";
}
/* apa yang dikerjakan siswa pada tiap tahap, bukan sekadar materi yang diulang */
function kegiatanTemuBawaan(n,jml){
  if(n === jml) return "Memainkan permainan utuh dengan aturan sederhana, sambil dinilai gurunya.";
  if(n === 1) return "Menirukan gerakan yang dicontohkan, satu per satu dan pelan-pelan.";
  if(n === 2) return "Mengulang gerakan berpasangan sambil saling mengoreksi.";
  if(n === 3) return "Menyambung seluruh gerakan menjadi satu rangkaian, lalu diubah-ubah tingkat kesulitannya.";
  return "Mengulang rangkaian dengan tantangan yang lebih sulit dari pertemuan sebelumnya.";
}
/* saran variasi yang membedakan pertemuan lanjutan, dapat diubah guru */
function variasiTemuBawaan(n,jml){
  if(n <= 2) return [];
  if(n === jml) return ["Gerakan dilakukan dalam permainan sesungguhnya, bukan latihan terpisah.",
                        "Setiap siswa mendapat giliran yang sama banyak.",
                        "Guru menilai sambil siswa bermain, tanpa menghentikan permainan."];
  const dasar = [
    ["Jarak diperjauh atau diperpendek dari pertemuan sebelumnya.",
     "Kecepatan gerak ditambah, dari pelan menjadi sedang.",
     "Arah gerak diubah, tidak hanya lurus ke depan."],
    ["Gerakan dilakukan sambil berpindah tempat.",
     "Ditambah satu rintangan sederhana yang harus dilewati.",
     "Dilakukan berpasangan secara bergantian."],
    ["Jumlah pengulangan ditambah dengan waktu yang sama.",
     "Gerakan disambung langsung tanpa berhenti di antaranya.",
     "Dilakukan sambil menghitung atau mengikuti aba-aba."]
  ];
  return dasar[(n - 3) % dasar.length];
}
function fokusTemuBawaan(n,jml){
  if(n === jml) return "Seluruh gerak dipakai dalam permainan dan dinilai. Tidak ada gerak baru yang diajarkan.";
  if(n === 1) return "Bagian awal gerakan saja. Tekankan sikap awal dan keselamatan.";
  if(n === 2) return "Bagian lanjutan gerakan, melanjutkan yang sudah dikuasai pada pertemuan pertama.";
  if(n === 3) return "Seluruh bagian disambung menjadi satu rangkaian, lalu divariasikan.";
  return "Rangkaian yang sama dengan tantangan yang lebih sulit.";
}
/* membagi sebuah daftar menjadi beberapa bagian berurutan yang tidak saling menimpa */
function bagiBerurutan(arr, bagian, ke){
  if(!arr.length) return [];
  if(bagian <= 1) return arr.slice();
  const dasar = Math.floor(arr.length / bagian), sisa = arr.length % bagian;
  let mulai = 0;
  for(let i = 1; i < ke; i++) mulai += dasar + (i <= sisa ? 1 : 0);
  const panjang = dasar + (ke <= sisa ? 1 : 0);
  const potong = arr.slice(mulai, mulai + panjang);
  return potong.length ? potong : arr.slice(-1);
}
/* permainan latihan dipakai lebih dulu, permainan utuh disimpan untuk pertemuan lanjutan */
function permainanTahap(P, n, lanjutan){
  if(!P.length) return [];
  const penuh = /mini|turnamen|pertandingan|lawan|beregu/i;
  const latihan = P.filter(x=>!penuh.test(x.n));
  const utuh = P.filter(x=>penuh.test(x.n));
  if(lanjutan) return (utuh.length ? utuh : P).slice(-1);
  const urut = latihan.concat(utuh);
  return urut.slice(n-1, n).length ? urut.slice(n-1, n) : urut.slice(0,1);
}
/* Pembagian bertahap: pertemuan awal mempelajari bagian gerak yang berbeda,
   pertemuan lanjutan merangkai seluruhnya dengan variasi, pertemuan terakhir menilai. */
function temuBawaan(m,n,jml){
  const L = m.l||[], P = m.p||[], K = m.k||[], T = m.t||[];
  const tahapBelajar = Math.max(1, Math.min(2, jml - 2));   // berapa pertemuan untuk memecah langkah
  let l, p, k, t;

  if(n === jml){                       // pertemuan penilaian
    l = L; p = P; k = K; t = T;
  } else if(n <= tahapBelajar){        // memecah langkah gerak menjadi bagian berbeda
    l = bagiBerurutan(L, tahapBelajar, n);
    t = bagiBerurutan(T, tahapBelajar + 1, n);
    p = permainanTahap(P, n, false);
    k = K.slice(n-1, n).length ? K.slice(n-1, n) : K.slice(0,1);
  } else {                             // merangkai seluruh gerak dengan variasi
    l = L;
    t = bagiBerurutan(T, tahapBelajar + 1, tahapBelajar + 1);
    p = permainanTahap(P, n, true);
    k = K.slice(n-1, n).length ? K.slice(n-1, n) : K.slice(-1);
  }
  if(!l.length) l = L;
  if(!p.length) p = P;
  if(!k.length) k = K;
  if(!t.length) t = T;
  return {judul: judulTemuBawaan(n,jml), fokus: fokusTemuBawaan(n,jml),
          kegiatan: kegiatanTemuBawaan(n,jml), variasi: variasiTemuBawaan(n,jml),
          t, l, p, k};
}
function temuAktif(k,i,n){
  const m = materiAktif(k,i);
  if(!m) return null;
  const kode = kodeMateri(k,i);
  const jml = jumlahTemu(kode);
  const nomor = Math.min(Math.max(1, n||1), jml);
  const dasar = temuBawaan(m, nomor, jml);
  const ubah = (dataTemu(kode).list || {})[nomor] || {};
  return {...m, ...dasar, ...ubah,
    g: {...m.g, ...(ubah.g||{})},
    j: m.j, judul: m.j, kegiatan: "", variasi: [], fokus: m.ak || "",
    nomor, jmlTemu: jml, kodeMateri: kode, kodeTemu: `${kode}-P${nomor}`};
}
function adaSuntinganTemu(kode,n){ return !!((dataTemu(kode).list||{})[n]); }
function temuSelesai(kode,n){ return progresAktif()[`${kode}-P${n}`] !== undefined; }

async function simpanTemu(kode, n, bagian){
  const d = S.temuData[kode] || (S.temuData[kode] = {jml:JML_TEMU_BAWAAN, list:{}});
  d.list = d.list || {};
  const lama = d.list[n] || {};
  d.list[n] = {...lama, ...bagian, g:{...(lama.g||{}), ...(bagian.g||{})}};
  if(!Object.keys(d.list[n].g).length) delete d.list[n].g;
  return simpanData();
}


function ubahNamaMateri(m){
  const h2 = document.getElementById("judulmateri");
  if(!h2 || h2.dataset.ubah) return;
  h2.dataset.ubah = "1";
  const kode = kodeMateri(S.kelas,S.materi);
  const asli = materiTambahan(S.kelas,S.materi)
    ? m.j
    : (DATA[S.kelas][S.materi] ? DATA[S.kelas][S.materi].j : m.j);
  h2.outerHTML = `<div class="ubah-nama">
    <input class="cari" id="namamaterib" value="${esc(m.j)}" aria-label="Nama materi">
    <div class="kendali" style="margin-top:8px">
      <button class="tombol" id="simpannamamateri">Simpan nama</button>
      <button id="batalnamamateri">Batal</button>
      ${m.j!==asli?`<button id="pulihnamamateri">Kembalikan nama asli</button>`:""}
    </div></div>`;
  const inp = document.getElementById("namamaterib");
  inp.focus(); inp.select();
  const simpan = async (nilai)=>{
    const n = String(nilai).trim();
    if(n.length < 2) return;
    await simpanSunting({j:n}, "materi");
    tampilMateri();
  };
  document.getElementById("simpannamamateri").onclick = ()=> simpan(inp.value);
  inp.onkeydown = e=>{ if(e.key==="Enter") simpan(inp.value); };
  document.getElementById("batalnamamateri").onclick = ()=> tampilMateri();
  const pl = document.getElementById("pulihnamamateri");
  if(pl) pl.onclick = ()=> simpan(asli);
}

/* kata pada daftar alat -> piktogram */
const KATA_ALAT = [
  [/bola\s*(plastik|besar|voli|basket|sepak)?\b/i,"bola"], [/kasti|bola kecil|kertas|tenis/i,"bolakecil"],
  [/simpai|hula/i,"simpai"], [/keranjang|ember|kardus/i,"keranjang"],
  [/kerucut|cone|botol/i,"kerucut"], [/peluit/i,"peluit"], [/tali|karet/i,"tali"],
  [/matras|kasur/i,"matras"], [/tongkat|estafet/i,"tongkat"], [/net|jaring/i,"net"],
  [/sabun/i,"sabun"], [/air|keran|gayung/i,"air"]
];
function piktoDariTeks(teks){
  for(const [pola,kunci] of KATA_ALAT) if(pola.test(String(teks))) return kunci;
  return null;
}
function piktoDariAnimasi(a){ return PETA_ANIMASI[a] || "lari"; }

function gambarPikto(kunci, kelas){
  const p = PIKTO[kunci];
  if(!p) return "";
  return `<svg class="pk ${kelas||""}" viewBox="0 0 100 100" role="img" aria-label="${esc(p.n)}">${p.s}</svg>`;
}
function namaPikto(kunci){ return (PIKTO[kunci]||{}).n || ""; }

  const b = [];
  if(id==="tujuan"){
    b.push(`Pelajaran ${esc(m.j)}.`, "Yang akan kamu capai.");
    (m.t||[]).forEach((x,i)=> b.push(`Nomor ${i+1}. ${x}`));
  } else if(id==="gerak"){
    b.push(`Cara melakukan ${m.j}.`, m.ak || "");
    (m.l||[]).forEach((x,i)=> b.push(`Langkah ${i+1}. ${x}`));
  } else if(id==="rumah"){
    const r = rumahAktif(m);
    b.push("Cara melakukannya di rumah.", r.ruang);
    (r.alat||[]).forEach(x=> b.push(`${x.asli} diganti dengan ${x.ganti}.`));
    b.push("Supaya aman.");
    (r.aman||[]).forEach(x=> b.push(x));
  } else if(id==="materi"){
    b.push(m.ml || m.ak || "");
    (m.p||[]).forEach(x=> b.push(`Permainan ${x.n}. ${x.d}`));
  } else if(id==="kuis"){
    b.push("Ayo jawab pertanyaannya.");
    (m.k||[]).forEach((q,i)=>{
      b.push(`Soal nomor ${i+1}. ${q.s}`);
      q.o.forEach((o,j)=> b.push(`Pilihan ${String.fromCharCode(65+j)}. ${o}.`));
    });
  } else if(id==="video"){
    b.push("Bagian video. Mintalah bantuan gurumu untuk memutarnya.");
  }
  return bersihkanUcap(b.filter(Boolean).join(" "));
}
function barisSuara(){
  return `<div class="suara">
    <button class="dengar" id="dengartab">🔊 Dengarkan halaman ini</button>
    <button class="dengar" id="stopdengar">■ Berhenti</button>
  </div>`;
}
function pasangSuara(m, id){
  const d = document.getElementById("dengartab");
  if(d) d.onclick = ()=>{

      return;
    }
    S.bunyi = true;
    ucap(t);

function ucap(teks){

    u.lang = "id-ID"; u.rate = .92; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* =======================================================================
   ISI PERMAINAN MENGIKUTI PERTEMUAN
   Piktogram diambil dari langkah gerak pertemuan yang sedang dibuka,
   sehingga tiap pertemuan memunculkan gambar dan tingkat kesulitan
   yang berbeda.
   ======================================================================= */
const KATA_GERAK = [
  [/berlari|lari\b|sprint|kecepatan/i,"lari"],
  [/berjalan|jalan\b|melangkah|langkah/i,"jalan"],
  [/melompat|meloncat|lompat|loncat|tolakan|mendarat|awalan/i,"lompat"],
  [/guling|berguling|roll/i,"guling"],
  [/mengayun|ayun/i,"ayun"],
  [/memutar|putar|rotasi/i,"putar"],
  [/menekuk|tekuk|meliuk|liuk|membungkuk|bungkuk|kayang|lentur/i,"tekuk"],
  [/seimbang|keseimbangan|satu kaki|sikap lilin/i,"imbang"],
  [/bergantung|gantung|bertumpu|tumpuan/i,"gantung"],
  [/mendorong|dorong|menarik|tarik|kekuatan|otot/i,"kuat"],
  [/melempar|lempar|melambung/i,"lempar"],
  [/menangkap|tangkap|menerima/i,"tangkap"],
  [/menendang|tendang|menyepak|gawang/i,"tendang"],
  [/memantul|pantul|menggiring|giring|dribel/i,"dribel"],
  [/passing|umpan|mengoper|oper|servis bawah/i,"passing"],
  [/memukul|pukul|servis atas|smes|raket/i,"pukul"],
  [/irama|ritmik|senam|hitungan|tepuk|musik|lagu/i,"ritmik"],
  [/cuci tangan|sabun|kebersihan|mandi|gigi|kuman|sehat/i,"sehat"]
];
function piktoDariLangkah(teks){
  for(const [pola,kunci] of KATA_GERAK) if(pola.test(String(teks))) return kunci;
  return null;
}
/* kumpulan gambar khas satu pertemuan */
function kolamPertemuan(m){
  const set = [];
  const tambah = k => { if(k && PIKTO[k] && !set.includes(k)) set.push(k); };
  (m.l||[]).forEach(x=> tambah(piktoDariLangkah(x)));
  tambah(piktoDariAnimasi(m.a));
  (m.g && m.g.alat || []).forEach(x=> tambah(piktoDariTeks(x)));
  return set;
}
function kolamLengkap(m, minimal){
  const set = kolamPertemuan(m).slice();
  kolamGerak().forEach(k=>{ if(!set.includes(k)) set.push(k); });
  while(set.length < (minimal||4)){
    const t = PIK_GERAK[Math.floor(Math.random()*PIK_GERAK.length)];
    if(!set.includes(t)) set.push(t);
  }
  return set;
}
function animasiUntuk(pikto){
  return Object.keys(PETA_ANIMASI).find(a=> PETA_ANIMASI[a] === pikto) || null;
}

/* =======================================================================
   PEMILIHAN PERMAINAN OLEH GURU
   ======================================================================= */
const SEMUA_GAME = {
  tebak:     {ikon:"👀", nama:"Tebak Gerak",       ket:"Lihat gerakannya, lalu pilih gambar yang sama.", fase:"A"},
  lampu:     {ikon:"🚦", nama:"Lampu Lalu Lintas", ket:"Aba-aba warna, anak menekan gambar gerak yang cocok.", fase:"A"},
  pasang:    {ikon:"🃏", nama:"Cari Pasangan",     ket:"Buka kartu dan temukan gambar yang kembar.", fase:"A"},
  sehatg:    {ikon:"🧼", nama:"Pilih yang Sehat",  ket:"Ketuk semua kebiasaan yang menyehatkan.", fase:"A"},
  susun:     {ikon:"🧩", nama:"Susun Gerakan",     ket:"Urutkan langkah gerakan pertemuan ini.", fase:"BC"},
  kilat:     {ikon:"⚡", nama:"Kuis Kilat",        ket:"Jawab soal pertemuan ini sebelum waktunya habis.", fase:"BC"},
  tantangan: {ikon:"🏃", nama:"Tantangan Gerak",   ket:"Praktikkan tiap langkah pertemuan ini sungguhan.", fase:"AB"}
};
function gameLayak(m){
  const ada = [];
  const l = (m.l||[]).length, k = (m.k||[]).length;
  if(fase_A()){
    ada.push("tebak","pasang");
    ada.push("lampu");
    if(m.a === "sehat" || /sehat|kebersihan|gizi|makan/i.test(m.e + " " + m.j)) ada.push("sehatg");
    if(l >= 1) ada.push("tantangan");
  } else {
    if(l >= 2) ada.push("susun");
    if(k >= 1) ada.push("kilat");
    if(l >= 1) ada.push("tantangan");
    ada.push("pasang","tebak");
  }
  return ada;
}
/* permainan bawaan berbeda tiap pertemuan, mengikuti tahap belajarnya */
function gameBawaanTemu(m){
  const n = m.nomor, akhir = n === m.jmlTemu, layak = gameLayak(m);
  if(m.jmlTemu === 1){
    const semua = fase_A() ? ["tebak","pasang","lampu","tantangan","sehatg"]
                           : ["susun","kilat","tantangan","tebak","pasang"];
    const hasilSemua = semua.filter(x=> layak.includes(x));
    return hasilSemua.length ? hasilSemua : layak.slice(0,1);
  }
  let urut;
  if(fase_A()){
    if(akhir)      urut = ["pasang","sehatg","tebak"];
    else if(n===1) urut = ["tebak","pasang"];
    else if(n===2) urut = ["lampu","tebak"];
    else           urut = ["tantangan","lampu"];
  } else {
    if(akhir)      urut = ["kilat","susun"];
    else if(n===1) urut = ["susun","kilat"];
    else if(n===2) urut = ["susun","tantangan"];
    else           urut = ["tantangan","kilat"];
  }
  const hasil = urut.filter(x=> layak.includes(x));
  return hasil.length ? hasil : layak.slice(0,1);
}
function gamePilihan(m){
  const p = (m.gamePilih || []).filter(x=> gameLayak(m).includes(x));
  return p.length ? p : gameBawaanTemu(m);
}
function gameSisa(m){
  const utama = gamePilihan(m);
  return gameLayak(m).filter(x=> !utama.includes(x));
}

/* ---------- tab guru: Permainan ---------- */
function pilihGame(p,m){
  const layak = gameLayak(m);
  const dipakai = gamePilihan(m);
  const sendiri = !!(m.gamePilih && m.gamePilih.length);
  let h = tombolUbah();
  h += `<h3>Permainan untuk Pertemuan ${m.nomor}</h3>
    <p class="catatan">Centang permainan yang muncul paling atas di menu siswa pada pertemuan ini. Permainan lain tetap bisa dibuka siswa lewat tombol Permainan lain. Isi tiap permainan mengikuti langkah gerak dan soal pertemuan ini, jadi otomatis berbeda antarpertemuan.</p>
    <p class="catatan">${sendiri ? "Saat ini memakai pilihanmu sendiri." : "Saat ini memakai pilihan bawaan untuk pertemuan ini."}</p>
    <div class="g-pilih">`;
  layak.forEach(id=>{
    const g = SEMUA_GAME[id], aktif = dipakai.includes(id);
    h += `<button class="g-kartu ${aktif?"g-terpilih":""}" data-pilihgame="${id}" aria-pressed="${aktif}">
      <span class="g-ikon">${g.ikon}</span>
      <span class="g-teks"><span class="g-nama">${g.nama}</span><span class="g-ket">${esc(g.ket)}</span>
        <span class="g-rekor">${aktif ? "Ditampilkan di pertemuan ini" : "Tersembunyi di Permainan lain"}</span></span>
      <span class="g-centang">${aktif?"✓":"+"}</span></button>`;
  });
  h += `</div>
    <div class="kendali">
      ${sendiri?`<button id="pulihgame">Kembalikan pilihan bawaan</button>`:""}
    </div>
    <p class="catatan" id="pesangame"></p>`;
  if(fase_A()){
    h += `<p class="catatan">Kelas ${S.kelas} termasuk Fase A, jadi permainan yang tersedia adalah yang bergambar dan bisa dimainkan tanpa membaca.</p>`;
  }
  p.innerHTML = h;
  pasangUbah(p,m);

  p.querySelectorAll("[data-pilihgame]").forEach(b=> b.onclick = async ()=>{
    const id = b.dataset.pilihgame;
    let baru = gamePilihan(m).slice();
    if(baru.includes(id)){
      if(baru.length === 1){
        document.getElementById("pesangame").textContent = "Sisakan minimal satu permainan untuk pertemuan ini.";
        return;
      }
      baru = baru.filter(x=>x!==id);
    } else baru.push(id);
    await simpanTemu(m.kodeMateri, m.nomor, {gamePilih:baru});
    panel();
  });
  const pg = document.getElementById("pulihgame");
  if(pg) pg.onclick = async ()=>{
    const d = S.temuData[m.kodeMateri];
    if(d && d.list && d.list[m.nomor]) delete d.list[m.nomor].gamePilih;
    await simpanData(); panel();
  };
}

/* =======================================================================
   PERMAINAN BERGAMBAR UNTUK KELAS 1-2 (FASE A)
   Semua permainan dapat diselesaikan tanpa membaca satu kata pun.
   Instruksi dibacakan suara, gambar besar, paling banyak tiga pilihan.
   ======================================================================= */
const GAME_A = [
  {id:"tebak",  ikon:"👀", nama:"Tebak Gerak",       ket:"Lihat gerakannya, lalu pilih gambar yang sama."},
  {id:"lampu",  ikon:"🚦", nama:"Lampu Lalu Lintas", ket:"Merah berhenti, kuning jalan di tempat, hijau lari."},
  {id:"pasang", ikon:"🃏", nama:"Cari Pasangan",     ket:"Buka kartu dan temukan gambar yang kembar."},
  {id:"sehatg", ikon:"🧼", nama:"Pilih yang Sehat",  ket:"Ketuk semua kebiasaan yang menyehatkan."}
];
const RONDE_TEBAK = 5, RONDE_LAMPU = 8;

function fase_A(){ return false; }
function gameATersedia(m){
  return GAME_A.filter(g=>{
    if(g.id === "sehatg") return m.a === "sehat" || /sehat|kebersihan|gizi|makan/i.test(m.e + " " + m.j);
    return true;
  });
}
function kolamGerak(){
  const set = new Set();
  daftarMateri(S.kelas).forEach((x,i)=>{
    const mm = materiAktif(S.kelas,i);
    if(mm) set.add(piktoDariAnimasi(mm.a));
  });
  const arr = [...set].filter(x=>PIKTO[x]);
  while(arr.length < 4){
    const tambah = PIK_GERAK[Math.floor(Math.random()*PIK_GERAK.length)];
    if(!arr.includes(tambah)) arr.push(tambah);
  }
  return arr;
}

/* ---------- bilah atas versi anak ---------- */
function aBar(judul, kanan){

/* =======================================================================
   1. TEBAK GERAK
   ======================================================================= */
function mulaiTebak(m){
  hentikanGame();
  const khas = kolamPertemuan(m);
  const kolam = kolamLengkap(m, 5);
  const jmlRonde = Math.min(8, Math.max(RONDE_TEBAK, khas.length + m.nomor));
  const jmlPilihan = m.nomor <= 2 ? 3 : 4;
  const urutTarget = acak(khas.length ? khas : kolam);
  const ronde = [];
  for(let r=0;r<jmlRonde;r++){
    const target = urutTarget[r % urutTarget.length];
    const lain = acak(kolam.filter(x=>x!==target)).slice(0,jmlPilihan-1);
    while(lain.length < jmlPilihan-1){
      const t = PIK_GERAK[Math.floor(Math.random()*PIK_GERAK.length)];
      if(t!==target && !lain.includes(t)) lain.push(t);
    }
    ronde.push({target, pilihan:acak([target,...lain])});
  }
  S.gs = {ronde, ke:0, benar:0, jawab:null, selesai:false, rekorBaru:false};
}
function mainTebak(p,m){
  if(!S.gs) mulaiTebak(m);
  const g = S.gs;
  S.ulang = ()=> mainTebak(p,m);

  if(g.selesai){
    p.innerHTML = aBar("👀 Tebak Gerak", `${g.benar}/${g.ronde.length}`) +
      aHasil(g.benar === g.ronde.length ? "🎉" : "👍", `${g.benar} dari ${g.ronde.length} benar`,
             g.benar === g.ronde.length ? "Semua gerakan kamu kenali. Hebat!" : "Lihat lagi gerakannya di tab Gerakan, lalu coba lagi.",
             g.rekorBaru);
    pasangKeluar(p,m); pasangUlang(p,m);
    return;
  }

  const r = g.ronde[g.ke];
  const anim = animasiUntuk(r.target);
  let h = aBar("👀 Tebak Gerak", titikRonde(g.ke, g.ronde.length, g.benar));
  h += `<p class="a-perintah">${anim ? "Gerakan mana yang sama?" : "Bayangan ini gambar apa?"}</p>`;
  h += anim
    ? `<div class="panggung g-panggung">${svgGerak(anim)}</div>`
    : `<div class="a-siluet-kotak">${gambarPikto(r.target,"siluet")}</div>`;
  h += `<div class="a-pilih ${r.pilihan.length>3?"empat":"tiga"}">`;
  r.pilihan.forEach(k=>{
    let kelas = "";
    if(g.jawab){ kelas = k === r.target ? " a-benar" : (k === g.jawab ? " a-salah" : " a-redup"); }
    h += `<button class="a-kartu${kelas}" data-pilih="${k}" ${g.jawab?"disabled":""}>
      ${gambarPikto(k)}<span class="a-label">${esc(namaPikto(k))}</span></button>`;
  });
  h += `</div>`;
  if(g.jawab) h += `<div class="g-aksi"><button class="tombol" id="glanjut">${g.ke+1 < g.ronde.length ? "Lanjut" : "Lihat hasil"}</button></div>`;
  p.innerHTML = h;
  pasangKeluar(p,m);
  const svg = p.querySelector("svg.gerak");
  if(svg) svg.classList.toggle("lambat", true);
  if(!g.jawab) ucap(anim ? "Gerakan mana yang sama?" : "Bayangan ini gambar apa?");

  p.querySelectorAll("[data-pilih]").forEach(b=> b.onclick = ()=>{
    if(g.jawab) return;
    g.jawab = b.dataset.pilih;
    if(g.jawab === r.target){ g.benar++; bunyi("benar"); ucap("Benar"); }
    else { bunyi("salah"); ucap("Coba lagi ya"); }
    mainTebak(p,m);
  });
  const lj = document.getElementById("glanjut");
  if(lj) lj.onclick = ()=>{
    g.ke++;
    if(g.ke >= g.ronde.length){ g.selesai = true; g.rekorBaru = catatRekor("tebak", g.benar); bunyi("juara"); }
    else g.jawab = null;
    mainTebak(p,m);
  };
}
function titikRonde(ke, jml, benar){
  let h = `<span class="a-titik">`;
  for(let i=0;i<jml;i++) h += `<i class="${i<ke?(i<benar?"isi":"lewat"):(i===ke?"kini":"")}"></i>`;
  return h + `</span>`;
}

/* =======================================================================
   2. LAMPU LALU LINTAS
   ======================================================================= */
const LAMPU = [
  {warna:"merah",  pikto:"berhenti",      kata:"Merah, berhenti"},
  {warna:"kuning", pikto:"jalanditempat", kata:"Kuning, jalan di tempat"},
  {warna:"hijau",  pikto:"lari",          kata:"Hijau, lari"}
];
function lampuUntuk(m){
  const dasar = LAMPU.slice();
  if(m.nomor >= 3){
    const k = kolamPertemuan(m)[0] || piktoDariAnimasi(m.a);
    if(k && !dasar.some(x=>x.pikto===k)){
      dasar.push({warna:"biru", pikto:k, kata:"Biru, lakukan " + namaPikto(k).toLowerCase()});
    }
  }
  return dasar;
}
function mulaiLampu(m){
  hentikanGame();
  const daftar = lampuUntuk(m);
  const jml = Math.min(12, 5 + m.nomor*2);
  const ronde = [];
  for(let i=0;i<jml;i++) ronde.push(Math.floor(Math.random()*daftar.length));
  S.gs = {daftar, ronde, ke:0, benar:0, jawab:null, selesai:false, rekorBaru:false};
}
function mainLampu(p,m){
  if(!S.gs) mulaiLampu(m);
  const g = S.gs;
  const daftar = g.daftar || LAMPU;

  if(g.selesai){

             "Permainan ini juga bisa dimainkan di lapangan bersama teman satu kelas.", g.rekorBaru);
    pasangKeluar(p,m); pasangUlang(p,m);
    return;
  }

  const l = daftar[g.ronde[g.ke]];
